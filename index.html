/* ----------------------- impor dari Drive ----------------------- */

function folderImpor_() {
  var nama = P_('folder_impor') || 'LENSA Impor';
  var it = DriveApp.getFoldersByName(nama);
  var f = it.hasNext() ? it.next() : DriveApp.createFolder(nama);
  var sub = function (n) { var i = f.getFoldersByName(n); return i.hasNext() ? i.next() : f.createFolder(n); };
  return { utama: f, sudah: sub('Sudah diimpor'), gagal: sub('Gagal') };
}

function bacaFileDrive_(file) {
  var mime = file.getMimeType();
  if (mime === MimeType.GOOGLE_SHEETS) {
    return SpreadsheetApp.openById(file.getId()).getSheets()[0].getDataRange().getDisplayValues()
      .map(function (r) { return r.map(function (x) { return String(x).trim(); }); });
  }
  if (/sheet|excel/.test(mime) && !/\.csv$/i.test(file.getName())) {
    throw new Error('File Excel belum bisa dibaca langsung. Ekspor sebagai CSV, atau buka di Google Sheets lalu simpan sebagai Google Spreadsheet.');
  }
  var blob = file.getBlob();
  var teks = blob.getDataAsString('UTF-8');
  if (teks.indexOf('\uFFFD') >= 0) teks = blob.getDataAsString('ISO-8859-1');
  return uraiCsv_(teks, deteksiPemisah_(teks));
}

/** Mengimpor semua file di folder Drive. Urutan: Data BU, Monitoring, ITW/ITB, Kartu Iuran. */
function imporDariFolder_() {
  var f = folderImpor_();
  var it = f.utama.getFiles(), antre = [], hasil = [];
  while (it.hasNext()) {
    var file = it.next();
    try {
      var grid = bacaFileDrive_(file);
      var an = analisaGrid_(grid, file.getName());
      antre.push({ file: file, grid: grid, an: an });
    } catch (e) {
      tambahBaris_('LOG_IMPOR', [{ id_impor: idWaktu_('I'), waktu: sekarangStr_(), nama_file: file.getName(), pesan: 'GAGAL: ' + e.message }]);
      hasil.push({ ok: false, ringkas: file.getName() + ': GAGAL — ' + e.message });
      file.moveTo(f.gagal);
    }
  }
  antre.sort(function (a, b) {
    return (PRIORITAS_IMPOR[a.an.jenis] - PRIORITAS_IMPOR[b.an.jenis]) || (a.file.getName() < b.file.getName() ? -1 : 1);
  });
  antre.forEach(function (x) {
    var h = imporGrid_(x.file.getName(), x.grid, x.an);
    hasil.push(h);
    x.file.moveTo(h.ok ? f.sudah : f.gagal);
  });
  return hasil;
}

/* ===================== MASTER PERUSAHAAN & TINJAU ===================== */

function daftarKecamatan_() {
  var d = [];
  try { bacaTab_('WILAYAH').data.forEach(function (o) { if (o.kecamatan) d.push(String(o.kecamatan).trim().toUpperCase()); }); } catch (e) { /* diam */ }
  if (!d.length) d = DEF_WILAYAH.map(function (k) { return k.toUpperCase(); });
  return d.sort(function (a, b) { return b.length - a.length; });
}

/** Alamat sistem berpola "... Desa KECAMATAN KABUPATEN". */
function uraiAlamat_(alamat, kab, daftarKec) {
  var hasil = { desa: '', kecamatan: '', kabupaten: '' };
  var s = String(alamat || '').replace(/\s+/g, ' ').trim();
  if (!s) return hasil;
  var tok = s.split(' ');
  var kabU = String(kab || '').trim().toUpperCase();
  if (kabU) {
    var kt = kabU.split(' ');
    if (tok.length > kt.length && tok.slice(-kt.length).join(' ').toUpperCase() === kabU) {
      tok = tok.slice(0, -kt.length);
      hasil.kabupaten = judulKata_(kabU);
    }
  }
  var kec = '';
  daftarKec = daftarKec || daftarKecamatan_();
  for (var i = 0; i < daftarKec.length; i++) {
    var k2 = daftarKec[i].split(' ');
    if (tok.length > k2.length && tok.slice(-k2.length).join(' ') === daftarKec[i]) {
      kec = daftarKec[i];
      tok = tok.slice(0, -k2.length);
      break;
    }
  }
  if (!kec && tok.length > 1) {
    var akhir = tok[tok.length - 1];
    if (/^[A-Z]{3,}$/.test(akhir) && /[a-z]/.test(tok[tok.length - 2])) { kec = akhir; tok = tok.slice(0, -1); }
  }
  var desa = [];
  for (var j = tok.length - 1; j >= 0; j--) {
    var w = tok[j];
    if (/[a-z]/.test(w) || /^\(.*\)$/.test(w)) desa.unshift(w);
    else break;
  }
  hasil.kecamatan = kec ? judulKata_(kec) : '';
  hasil.desa = desa.join(' ');
  return hasil;
}

function tebakSegmen_(nama, ilo, skala) {
  var n = ' ' + String(nama || '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ') + ' ';
  var i = String(ilo || '').toUpperCase();
  if (/ (DESA|PEMDES|BPD|KADES|PERANGKAT DESA|APARAT DESA|BADAN PERMUSYAWARATAN DESA) /.test(n)) return 'Desa';
  if (/ SPPG |PEMENUHAN GIZI/.test(n)) return 'SPPG';
  if (/ (PR|ROKOK|TEMBAKAU|SIGARET|CIGARETTE) /.test(n) || /ROKOK|TEMBAKAU/.test(i)) return 'Pabrik rokok';
  if (/ (SEKOLAH|MADRASAH|MI|MTS|MA|SD|SDN|SMP|SMPN|SMA|SMAN|SMK|SMKN|YAYASAN|PONDOK|PESANTREN|PP|UNIVERSITAS|INSTITUT|STAI|STAIN|IAIN|STIE|STKIP|AKADEMI|POLITEKNIK|PAUD|TK|RA|KB|LEMBAGA PENDIDIKAN) /.test(n) || /PENDIDIKAN/.test(i)) return 'Lembaga pendidikan';
  if (skala === 'MI' || / (DINAS|BADAN|KANTOR|KECAMATAN|KELURAHAN|SEKRETARIAT|SETDA|PEMKAB|PEMERINTAH|RSUD|PUSKESMAS|K2|HONORER|NON ASN|PDAM|PERUMDA|BUMD|SATPOL|BAPPEDA|INSPEKTORAT|DPRD|KABUPATEN|KEMENTERIAN|KEMENAG|POLRES|KODIM|PMI|BAZNAS|KPU|BAWASLU) /.test(n) || /PEMERINTAH/.test(i)) return 'Instansi';
  return 'Usaha';
}

function peranDari_(jab) {
  var j = ' ' + String(jab || '').toUpperCase().replace(/[^A-Z]+/g, ' ') + ' ';
  if (/PEMILIK|OWNER/.test(j)) return 'Pemilik';
  if (/DIREKTUR|DIRUT|DIRECTOR/.test(j)) return 'Direktur';
  if (/BENDAHARA|KEUANGAN|FINANCE|AKUNTAN|ACCOUNTING|KASIR| GAJI /.test(j)) return 'Keuangan';
  if (/ HRD | PERSONALIA | SDM | HR | KEPEGAWAIAN /.test(j)) return 'HRD';
  if (/SEKRETARIS ?DINAS/.test(j)) return 'Pimpinan';
  if (/KEPALA|PIMPINAN|KADES|KETUA|MANAJER|MANAGER|CAMAT|KEPSEK|KOORDINATOR/.test(j)) return 'Pimpinan';
  if (/PENGURUS/.test(j)) return 'Pengurus';
  if (/ADMIN|STAF|STAFF|OPERATOR| TU |TATA USAHA|PEGAWAI|KARYAWAN|SEKRETARIS|SEKDES/.test(j)) return 'Admin';
  return 'PIC';
}

function sapaanDari_(nama) {
  var tok = String(nama || '').toUpperCase().replace(/[^A-Z\. ]+/g, ' ').split(/\s+/).filter(String);
  var lewati = { H: 1, HJ: 1, DR: 1, DRS: 1, IR: 1, KH: 1, NY: 1, R: 1, RA: 1, MOH: 1, MOCH: 1, MUH: 1, M: 1, MUHAMMAD: 1, MOHAMMAD: 1, MOHAMAD: 1, MUHAMAD: 1, ST: 1, SH: 1, SE: 1, SPD: 1, SAG: 1, SPDI: 1, HAJI: 1, HAJJAH: 1, BAPAK: 1, IBU: 1, BPK: 1 };
  for (var i = 0; i < tok.length; i++) {
    var t = tok[i].replace(/\./g, '');
    if (!t || lewati[t] || tok[i].indexOf('.') >= 0 || t.length < 3) continue;
    return 'Bapak/Ibu ' + judulKata_(t);
  }
  return 'Bapak/Ibu';
}

function aliasOtomatis_(nama) {
  var n = String(nama || '').replace(/\s+/g, ' ').trim();
  var a = n.replace(/^(PT|CV|UD|PR|FA|TB)\.?\s+/i, '').replace(/,?\s+(PT|CV|UD|TBK)\.?$/i, '').trim();
  return (a && a.toUpperCase() !== n.toUpperCase()) ? a : '';
}

function gabungTelp_(area, telp) {
  var t = String(telp || '').replace(/[^\d]/g, '');
  if (!t) return '';
  var a = String(area || '').replace(/[^\d]/g, '');
  if (a && a.charAt(0) !== '0') a = '0' + a;
  if (t.charAt(0) === '0' || /^62/.test(t)) return t;
  return a ? a + '-' + t : t;
}

function emailPribadi_(email) {
  var d = String(email || '').split('@')[1] || '';
  return DOMAIN_PRIBADI.test(d);
}

function profilDariDbu_(d, mon, daftarKec) {
  var al = uraiAlamat_(d.alamat, d.kabupaten, daftarKec);
  var telp = gabungTelp_(d.kode_area, d.telp);
  if (telp && normHp_(telp) === normHp_(d.pic_hp)) telp = '';
  var email = String(d.pic_email || '').trim().toLowerCase();
  var sipp = mon && mon.sipp_prs !== undefined ? (/SIPP/i.test(mon.sipp_prs) ? 'Ya' : 'Tidak') : '';
  mon = mon || {};
  return {
    npp: d.npp, div: d.div || '000', nama_perusahaan: d.nama, nama_lapangan: '',
    status_kepesertaan: d.blth_na ? 'Nonaktif' : 'Aktif', keps_awal: mon.keps_awal || d.blth_keps, keps_jp: mon.keps_jp || '',
    skala: mon.skala || '', segmen: tebakSegmen_(d.nama, d.nama_ilo, mon.skala), program: mon.prog || '',
    kode_ilo: d.kode_ilo, nama_ilo: d.nama_ilo, rate_jkk: d.rate_jkk, alamat: d.alamat, desa: al.desa, kecamatan: al.kecamatan,
    kabupaten: d.kabupaten ? judulKata_(d.kabupaten) : al.kabupaten, lat: '', lng: '', sumber_geotag: '', tgl_geotag: '',
    telp_kantor: telp, email_perusahaan: email, punya_sipp: sipp, email_sipp: '',
    cara_tagih: sipp === 'Ya' ? 'SIPP' : 'Surat (Konseptor)', nib: '', tag_potensi: '', grup_manual: '', kelompok_saya: '',
    non_asn: tebakNonAsn_(d.nama, mon.skala, tebakSegmen_(d.nama, d.nama_ilo, mon.skala)),
    petugas_pembina: P_('kode_pembina') || '', catatan: '', diperbarui: sekarangStr_()
  };
}

function pengurusDariDbu_(d) {
  var hp = hpSeluler_(d.pic_hp);
  var email = String(d.pic_email || '').trim().toLowerCase();
  return {
    nama: judulKata_(d.pic_nama), sapaan: sapaanDari_(d.pic_nama), no_wa: hp ? hpTampil_(hp) : '',
    no_hp_2: (!hp && d.pic_hp) ? String(d.pic_hp) : '', email: (email && emailPribadi_(email)) ? email : '',
    jabatan_umum: judulKata_(d.pic_jabatan), kanal_disukai: hp ? 'WA' : 'Telepon', waktu_terbaik: '', catatan: '',
    status: 'Aktif', diverifikasi: 'Belum', _peran: peranDari_(d.pic_jabatan)
  };
}

function petaMonitoringTerbaru_() {
  var peta = {};
  try {
    bacaTab_('MONITORING').data.forEach(function (o) {
      var k = String(o.npp), cur = peta[k];
      var kunci = String(o.periode) + '|' + String(o.periode_laporan);
      if (!cur || kunci > cur._kunci) { o._kunci = kunci; peta[k] = o; }
    });
  } catch (e) { /* diam */ }
  return peta;
}

/** Impor Data BU pertama: mengisi PERUSAHAAN, PENGURUS, RELASI, ALIAS sekaligus. */
function isiMasterAwal_(dbu) {
  var mon = petaMonitoringTerbaru_(), daftarKec = daftarKecamatan_();
  var tP = bacaTab_('PENGURUS').data, tR = bacaTab_('RELASI').data;
  var idP = idBerikut_('P', tP.map(function (o) { return o.id_pengurus; }));
  var idR = idBerikut_('R', tR.map(function (o) { return o.id_relasi; }));
  var perHp = {};
  tP.forEach(function (p) { var h = hpSeluler_(p.no_wa); if (h) perHp[h] = p; });
  var per = [], pengurus = [], relasi = [], alias = [];
  dbu.forEach(function (d) {
    per.push(profilDariDbu_(d, mon[d.npp], daftarKec));
    var a = aliasOtomatis_(d.nama);
    if (a) alias.push({ npp: d.npp, alias: a, jenis: 'Otomatis', sumber: 'Sistem', dibuat: hariIniStr_() });
    if (!d.pic_nama && !d.pic_hp) return;
    var calon = pengurusDariDbu_(d), hp = hpSeluler_(d.pic_hp);
    var p = hp ? perHp[hp] : null;
    if (!p) {
      p = calon;
      p.id_pengurus = idP();
      pengurus.push(p);
      if (hp) perHp[hp] = p;
    } else {
      if (!p.email && calon.email) p.email = calon.email;
      if (String(calon.nama).length > String(p.nama).length && normCari_(calon.nama).indexOf(normCari_(p.nama)) === 0) p.nama = calon.nama;
    }
    relasi.push({ id_relasi: idR(), npp: d.npp, id_pengurus: p.id_pengurus, peran: calon._peran,
      pengendali: PERAN_PENGENDALI[calon._peran] ? 'Ya' : 'Tidak', pic_utama: 'Ya', aktif: 'Ya', mulai: hariIniStr_(), selesai: '', catatan: 'Dari Data BU' });
  });
  tulisTab_('PERUSAHAAN', per);
  tambahBaris_('PENGURUS', pengurus);
  tambahBaris_('RELASI', relasi);
  tambahBaris_('ALIAS', alias);
  var usul = usulanGrup_(relasi.concat(tR), pengurus.concat(tP), per);
  var nUsul = tambahTinjau_(usul);
  return { baru: per.length, berubah: 0, cek: 'PERUSAHAAN ' + per.length + ' · PENGURUS ' + pengurus.length + ' · RELASI ' + relasi.length + ' · ALIAS ' + alias.length,
    pesan: 'Master terisi pertama kali.' + (nUsul ? ' ' + nUsul + ' usulan grup di TINJAU.' : '') };
}

/** Kontak yang memegang 2 PK atau lebih tetapi belum ditandai pengendali → usulan grup. */
function usulanGrup_(relasi, pengurus, per) {
  var nama = {}, perP = {};
  per.forEach(function (o) { nama[String(o.npp)] = o.nama_perusahaan; });
  relasi.forEach(function (r) {
    if (r.aktif === 'Tidak') return;
    (perP[r.id_pengurus] = perP[r.id_pengurus] || []).push(r);
  });
  var pp = {};
  pengurus.forEach(function (p) { pp[p.id_pengurus] = p; });
  var usul = [];
  Object.keys(perP).forEach(function (id) {
    var rs = perP[id];
    var npps = {};
    rs.forEach(function (r) { npps[r.npp] = true; });
    var daftar = Object.keys(npps);
    if (daftar.length < 2) return;
    if (rs.some(function (r) { return r.pengendali === 'Ya'; })) return;
    var p = pp[id] || {};
    usul.push({ jenis: 'Usulan grup', npp: daftar[0], nama: p.nama || id, kolom: 'pengendali', nilai_lama: 'Tidak',
      nilai_baru: daftar.length + ' PK: ' + daftar.map(function (n) { return nama[n] || n; }).join('; '),
      catatan: 'Kontak ' + (p.nama || id) + ' (' + (p.jabatan_umum || 'PIC') + ') memegang ' + daftar.length + ' PK. Terapkan bila ia pengendali (satu grup).',
      data: JSON.stringify({ id_pengurus: id }) });
  });
  return usul;
}

function perbaruiMasterDariDbu_(rows, m, periode) {
  var mon = petaMonitoringTerbaru_(), daftarKec = daftarKecamatan_();
  var peta = {};
  m.forEach(function (o) { peta[String(o.npp)] = o; });
  var tP = bacaTab_('PENGURUS').data, tR = bacaTab_('RELASI').data;
  var hpKe = {};
  tP.forEach(function (p) { [p.no_wa, p.no_hp_2].forEach(function (h) { var n = normHp_(h); if (n) hpKe[n] = p.id_pengurus; }); });
  var relasiAda = {};
  tR.forEach(function (r) { relasiAda[r.npp + '|' + r.id_pengurus] = true; });
  var emailAda = {};
  tP.forEach(function (p) { if (p.email) emailAda[String(p.email).toLowerCase()] = true; });
  var usul = [], alias = [], berubah = 0, ada = {};
  rows.forEach(function (d) {
    ada[d.npp] = true;
    var ms = peta[d.npp];
    if (!ms) {
      var prof = profilDariDbu_(d, mon[d.npp], daftarKec), calon = pengurusDariDbu_(d);
      usul.push({ jenis: 'NPP baru', npp: d.npp, nama: d.nama, nilai_baru: 'Ada di Data BU, belum di PERUSAHAAN',
        data: JSON.stringify({ perusahaan: prof, pengurus: (d.pic_nama || d.pic_hp) ? calon : null, alias: aliasOtomatis_(d.nama) }) });
      return;
    }
    var ubah = false;
    [['kode_ilo', d.kode_ilo], ['nama_ilo', d.nama_ilo], ['rate_jkk', d.rate_jkk]].forEach(function (p) {
      if (p[1] !== '' && p[1] !== null && String(ms[p[0]]) !== String(p[1])) { ms[p[0]] = p[1]; ubah = true; }
    });
    if (!ms.keps_awal && d.blth_keps) { ms.keps_awal = d.blth_keps; ubah = true; }
    if (d.nama && normCari_(d.nama) !== normCari_(ms.nama_perusahaan)) {
      if (ms.nama_perusahaan) alias.push({ npp: d.npp, alias: ms.nama_perusahaan, jenis: 'Nama lama', sumber: 'Sistem', dibuat: hariIniStr_() });
      ms.nama_perusahaan = d.nama;
      ubah = true;
    }
    var telp = gabungTelp_(d.kode_area, d.telp);
    if (!ms.telp_kantor && telp && normHp_(telp) !== normHp_(d.pic_hp)) { ms.telp_kantor = telp; ubah = true; }
    var email = String(d.pic_email || '').toLowerCase();
    if (email && !ms.email_perusahaan) { ms.email_perusahaan = email; ubah = true; }
    else if (email && String(ms.email_perusahaan).toLowerCase() !== email) {
      usul.push({ jenis: 'Email berbeda', npp: d.npp, nama: ms.nama_perusahaan, kolom: 'email_perusahaan', nilai_lama: ms.email_perusahaan, nilai_baru: email });
    }
    if (d.alamat && normCari_(d.alamat) !== normCari_(ms.alamat)) {
      usul.push({ jenis: 'Alamat berbeda', npp: d.npp, nama: ms.nama_perusahaan, kolom: 'alamat', nilai_lama: ms.alamat, nilai_baru: d.alamat,
        catatan: 'Terapkan hanya mengganti teks alamat; desa dan kecamatan yang sudah diisi tetap.', data: JSON.stringify({ kabupaten: d.kabupaten }) });
    }
    var hp = normHp_(d.pic_hp);
    var idAda = hp ? hpKe[hp] : null;
    if ((hp && !(idAda && relasiAda[d.npp + '|' + idAda])) || (!hp && d.pic_nama && !tR.some(function (r) { return r.npp === d.npp; }))) {
      var c = pengurusDariDbu_(d);
      usul.push({ jenis: 'Kontak baru', npp: d.npp, nama: ms.nama_perusahaan, kolom: 'kontak', nilai_lama: '',
        nilai_baru: c.nama + ' (' + (c.jabatan_umum || c._peran) + ') ' + (c.no_wa || c.no_hp_2), data: JSON.stringify({ pengurus: c }) });
    }
    if (ubah) { ms.diperbarui = sekarangStr_(); berubah++; }
  });
  var aktifM = m.filter(function (o) { return o.status_kepesertaan === 'Aktif'; });
  if (rows.length >= aktifM.length * 0.5) {
    aktifM.forEach(function (o) {
      if (!ada[String(o.npp)]) usul.push({ jenis: 'Tidak ada di laporan', npp: String(o.npp), nama: o.nama_perusahaan, kolom: 'status_kepesertaan',
        nilai_lama: 'Aktif', nilai_baru: 'Pindah pembina', catatan: 'Tidak tercantum di Data BU ' + tglIndo_(periode) + '.' });
    });
  }
  if (berubah) tulisTab_('PERUSAHAAN', m);
  tambahBaris_('ALIAS', alias);
  var nUsul = tambahTinjau_(usul);
  return { baru: nUsul, berubah: berubah, cek: 'Diperbarui ' + berubah + ' PK' + (alias.length ? ' · ' + alias.length + ' nama lama jadi alias' : ''),
    pesan: nUsul ? nUsul + ' usulan baru di TINJAU' : '' };
}

/* ----------------------------- TINJAU ----------------------------- */

function kunciTinjau_(o) {
  if (o.jenis === 'NPP baru' || o.jenis === 'Usulan grup') return o.jenis + '|' + o.npp + (o.jenis === 'Usulan grup' ? '|' + o.nama : '');
  return [o.jenis, o.npp, o.kolom || '', normCari_(o.nilai_baru)].join('|');
}

/** Menambah usulan ke TINJAU. Usulan yang sama (termasuk yang pernah diabaikan) tidak diulang. */
function tambahTinjau_(usul) {
  if (!usul.length) return 0;
  var t = bacaTab_('TINJAU').data, ada = {};
  t.forEach(function (o) { ada[kunciTinjau_(o)] = true; });
  var next = idBerikut_('T', t.map(function (o) { return o.id; }));
  var baru = [];
  usul.forEach(function (u) {
    var k = kunciTinjau_(u);
    if (ada[k]) return;
    ada[k] = true;
    baru.push({ id: next(), waktu: sekarangStr_(), jenis: u.jenis, npp: u.npp, nama: u.nama || '', kolom: u.kolom || '',
      nilai_lama: u.nilai_lama || '', nilai_baru: u.nilai_baru || '', keputusan: '', diproses: '', catatan: u.catatan || '', data: u.data || '' });
  });
  tambahBaris_('TINJAU', baru);
  return baru.length;
}

function terapkanTinjau() {
  var h = terapkanTinjau_();
  if (h.diterapkan || h.diabaikan) hitungUlang_();
  kabar_('Diterapkan: ' + h.diterapkan + ' · Diabaikan: ' + h.diabaikan + (h.gagal.length ? '\nGagal: ' + h.gagal.join('; ') : '') +
    '\n\nUsulan yang diabaikan tidak akan diusulkan lagi.');
}

function terapkanTinjau_() {
  var t = bacaTab_('TINJAU');
  var antre = t.data.filter(function (o) { return (o.keputusan === 'Terapkan' || o.keputusan === 'Abaikan') && !o.diproses; });
  var hasil = { diterapkan: 0, diabaikan: 0, gagal: [] };
  if (!antre.length) return hasil;
  var per = bacaTab_('PERUSAHAAN').data, peng = bacaTab_('PENGURUS').data, rel = bacaTab_('RELASI').data;
  var aliasBaru = [];
  var petaPer = {};
  per.forEach(function (o) { petaPer[String(o.npp)] = o; });
  var idP = idBerikut_('P', peng.map(function (o) { return o.id_pengurus; }));
  var idR = idBerikut_('R', rel.map(function (o) { return o.id_relasi; }));
  var hpKe = {};
  peng.forEach(function (p) { var n = normHp_(p.no_wa); if (n) hpKe[n] = p; });
  var daftarKec = daftarKecamatan_();

  function sambungPengurus(npp, c, utama) {
    if (!c) return;
    var hp = hpSeluler_(c.no_wa);
    var p = hp ? hpKe[hp] : null;
    if (!p) {
      p = {};
      Object.keys(c).forEach(function (k) { if (k.charAt(0) !== '_') p[k] = c[k]; });
      p.id_pengurus = idP();
      peng.push(p);
      if (hp) hpKe[hp] = p;
    }
    var sudah = rel.some(function (r) { return r.npp === npp && r.id_pengurus === p.id_pengurus; });
    if (!sudah) {
      var adaUtama = rel.some(function (r) { return r.npp === npp && r.pic_utama === 'Ya' && r.aktif !== 'Tidak'; });
      var peran = c._peran || 'PIC';
      rel.push({ id_relasi: idR(), npp: npp, id_pengurus: p.id_pengurus, peran: peran, pengendali: PERAN_PENGENDALI[peran] ? 'Ya' : 'Tidak',
        pic_utama: (utama || !adaUtama) ? 'Ya' : 'Tidak', aktif: 'Ya', mulai: hariIniStr_(), selesai: '', catatan: 'Dari TINJAU' });
    }
  }

  antre.forEach(function (o) {
    try {
      if (o.keputusan === 'Terapkan') {
        var data = {};
        try { data = o.data ? JSON.parse(o.data) : {}; } catch (e) { data = {}; }
        var npp = String(o.npp);
        if (o.jenis === 'NPP baru') {
          if (!petaPer[npp]) {
            var pr = data.perusahaan || { npp: npp, nama_perusahaan: o.nama, status_kepesertaan: 'Aktif' };
            pr.segmen = pr.segmen || tebakSegmen_(pr.nama_perusahaan, pr.nama_ilo, pr.skala);
            pr.diperbarui = sekarangStr_();
            per.push(pr);
            petaPer[npp] = pr;
            if (data.alias) aliasBaru.push({ npp: npp, alias: data.alias, jenis: 'Otomatis', sumber: 'Sistem', dibuat: hariIniStr_() });
          }
          sambungPengurus(npp, data.pengurus, true);
        } else if (o.jenis === 'Alamat berbeda') {
          var ms = petaPer[npp];
          if (ms) {
            var al = uraiAlamat_(o.nilai_baru, data.kabupaten || ms.kabupaten, daftarKec);
            ms.alamat = o.nilai_baru;
            // desa/kecamatan yang sudah diisi (mungkin dikoreksi petugas) tidak ditimpa
            if (al.desa && !ms.desa) ms.desa = al.desa;
            if (al.kecamatan && !ms.kecamatan) ms.kecamatan = al.kecamatan;
            ms.diperbarui = sekarangStr_();
          }
        } else if (o.jenis === 'Kontak baru') {
          sambungPengurus(npp, data.pengurus, false);
        } else if (o.jenis === 'Email berbeda') {
          if (petaPer[npp]) { petaPer[npp].email_perusahaan = o.nilai_baru; petaPer[npp].diperbarui = sekarangStr_(); }
        } else if (o.jenis === 'Menjadi nonaktif' || o.jenis === 'Tidak ada di laporan') {
          if (petaPer[npp]) { petaPer[npp].status_kepesertaan = o.nilai_baru || 'Nonaktif'; petaPer[npp].diperbarui = sekarangStr_(); }
        } else if (o.jenis === 'Usulan grup') {
          rel.forEach(function (r) { if (r.id_pengurus === data.id_pengurus && r.aktif !== 'Tidak') r.pengendali = 'Ya'; });
        }
        hasil.diterapkan++;
      } else {
        hasil.diabaikan++;
      }
      o.diproses = sekarangStr_();
    } catch (e) {
      hasil.gagal.push(o.id + ': ' + e.message);
    }
  });
  tulisTab_('PERUSAHAAN', per);
  tulisTab_('PENGURUS', peng);
  tulisTab_('RELASI', rel);

/**
 * PK pendaftar pekerja non-ASN: bukan badan usaha/tidak mencari laba, pekerjanya digaji langsung oleh pemerintah
 * tanpa pihak ketiga (aparat desa, BPD, kader PKK/posyandu, RT/RW, relawan SPPG, tenaga pendukung, honorer).
 * Skala "MI" (M + huruf I besar) dari sistem selalu dianggap non-ASN; karena sistem tidak selalu konsisten,
 * nama PK juga diperiksa. Badan usaha (PT, CV, PDAM, bank, koperasi, klinik, PMI, yayasan) tidak dianggap non-ASN.
 */
function tebakNonAsn_(nama, skala, segmen) {
  var n = ' ' + String(nama || '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ') + ' ';
  if (String(skala || '').trim() === 'MI') return 'Ya';
  if (/ (PT|CV|UD|PDAM|PERUMDA|PERUMDAM|PERSERODA|BUMD|BUMN|BUMDES|BANK|BPR|KOPERASI|KOP|KLINIK|PMI|APOTEK) /.test(n)) return 'Tidak';
  if (/ NON ASN | K2 | HONORER | TENAGA KONTRAK | TENAGA PENDUKUNG | TENAGA HARIAN LEPAS | THL | PTT | PPPK | TKS | GTT | PEGAWAI TIDAK TETAP | GURU TIDAK TETAP /.test(n)) return 'Ya';
  if (/ (APARAT|APARATUR|PERANGKAT) (PEMERINTAH |PEMRINTAH )?DESA | PEMDES | BPD | BADAN PERMUSYAWARATAN | KADER | PKK | POSYANDU | KPM | LEMBAGA ADAT | RT RW | RUKUN TETANGGA | RUKUN WARGA | LINMAS | RELAWAN SPPG | PETUGAS SENSUS | KPPS | PANTARLIH /.test(n)) return 'Ya';
  if (/ YAYASAN | PONDOK | PESANTREN /.test(n)) return 'Tidak';
  if ((segmen === 'Instansi' || segmen === 'Lembaga pendidikan' || segmen === 'Desa') &&
    / (NEGERI|SDN|SMPN|SMAN|SMKN|MIN|MTSN|MAN|DINAS|BADAN|KANTOR|KECAMATAN|KELURAHAN|SEKRETARIAT|SETDA|RSUD|PUSKESMAS|UPT|UPTD|BLUD|INSPEKTORAT|BAPPEDA|SATPOL|DPRD|PEMKAB|PEMERINTAH|KABUPATEN|BAWASLU|KPU|KEMENAG) /.test(n)) return 'Ya';
  return 'Tidak';
}

/** Status ITB per bulan (6 bulan terakhir yang sudah lewat): true / false / tidak diketahui. */
function riwayatItb_(npp, D) {
  var h = {}, snaps = D.snap[npp] || [], rec = D.riwayat[npp] || [], kartu = D.kartu[npp] || [];
  for (var M = D.M0 - 6; M < D.M0; M++) {
    var kt = kartu.filter(function (x) { return x.bi === M; });
    if (kt.length) {
      h[M] = kt.some(function (x) { return x.tb !== null && x.tb <= M; });
      continue;
    }
    var pos = false, neg = false;
    snaps.forEach(function (s) {
      if (s.sm <= M && s.bp >= M) pos = true;
      if (s.sm > M && s.bp < M) neg = true;
    });
    rec.forEach(function (r) {
      if (r.tm <= M && M <= r.bp) pos = true;
      if (r.bp === M && r.tm > M) neg = true;
    });
    if (neg) h[M] = false;
    else if (pos) h[M] = true;
  }
  return h;
}

function hariBayarTipikal_(npp, D) {
  var lihat = {}, hari = [];
  (D.riwayat[npp] || []).forEach(function (r) {
    if (r.tm >= D.M0 - 6 && r.tm <= r.bp && !lihat[r.tgl]) { lihat[r.tgl] = true; hari.push(+r.tgl.slice(8, 10)); }
  });
  (D.kartu[npp] || []).forEach(function (x) {
    if (x.tgl && x.bi >= D.M0 - 6 && x.tb !== null && x.tb <= x.bi && !lihat[x.tgl]) { lihat[x.tgl] = true; hari.push(+x.tgl.slice(8, 10)); }
  });
  if (!hari.length) return { hari: null, n: 0 };
  hari.sort(function (a, b) { return a - b; });
  var mid = Math.floor(hari.length / 2);
  var med = hari.length % 2 ? hari[mid] : Math.round((hari[mid - 1] + hari[mid]) / 2);
  return { hari: med, n: hari.length };
}

function kontakUtama_(rs, D) {

    var s = function (r) { return (r.pic_utama === 'Ya' ? 4 : 0) + (r.pengendali === 'Ya' ? 2 : 0) + (r.peran === 'Keuangan' ? 1 : 0); };
    return s(b) - s(a);
  });
  var cadangan = null;
  for (var i = 0; i < urut.length; i++) {
    var p = D.peng[String(urut[i].id_pengurus)];
    if (!p || p.status === 'Tidak aktif') continue;
    var wa = hpSeluler_(p.no_wa);
    if (wa) return { p: p, r: urut[i], wa: wa };
    if (!cadangan && (p.no_wa || p.no_hp_2)) cadangan = { p: p, r: urut[i], wa: '' };

  return cadangan;
}

/** Status per PK aktif (semesta = laporan ITW/ITB terbaru, sama dengan angka kantor). */
function hitungStatus_(D) {

    });
  });
  var jumlahPk = function (id) { return Object.keys(pkPerPeng[id] || {}).length; };

  var out = [];
  D.itw.forEach(function (w) {
    var npp = String(w.npp), m = D.per[npp] || {}, mon = D.mon[npp] || {}, dbu = D.dbu[npp] || {};
    var koef = angka_(w.koef), bln = angka_(w.bln_belum_posting), itw = String(w.itw), itb = String(w.itb);

    if (geser > 0) {
      D.itwKedaluwarsa = true;
      bln += geser; koef += geser;
      itw = koef <= 1 ? 'Y' : 'T';
      itb = bln <= 0 ? 'Y' : 'T';
    }
    var skala = String(mon.skala || m.skala || '');
    var segmen = m.segmen || tebakSegmen_(w.nama, dbu.nama_ilo, skala);
    var namaResmi = m.nama_perusahaan || w.nama;
    var nama = namaUtama_(m.nama_lapangan) || namaResmi;
    var iuran = angka_(w.iuran_terakhir);
    var status = itb === 'Y' ? 'Sudah ITB' : itw === 'Y' ? 'Belum bulan ini' : koef === 2 ? 'Telat 1 bulan' : 'Telat 2 bulan+';
    var tunggakan = Math.max(0, koef - 1) * iuran;
    var tk = angka_(mon.tk_aktif);
    var kodeIlo = String(m.kode_ilo || dbu.kode_ilo || '').trim();
    var namaIlo = String(m.nama_ilo || dbu.nama_ilo || '').trim();
    var jenisUsaha = kodeIlo || namaIlo ? (kodeIlo ? kodeIlo + ' · ' : '') + judulKata_(namaIlo) : '';
    var nonAsn = m.non_asn === 'Ya' || m.non_asn === 'Tidak' ? m.non_asn : tebakNonAsn_(namaResmi, skala, segmen);

    var rs = D.rel[npp] || [];
    var ku = kontakUtama_(rs, D);

    var hist = riwayatItb_(npp, D), nBln = 0, kBln = 0;
    for (var M = D.M0 - 6; M < D.M0; M++) if (hist[M] !== undefined) { nBln++; if (hist[M]) kBln++; }
    var lalu = hist[D.M0 - 1];
    var kel, kelSumber;
    if (koef >= 3) { kel = 'Macet'; kelSumber = 'telat ' + (koef - 1) + ' bln'; }
    else if (nBln >= 3) {
      var p = kBln / nBln;
      kel = p === 1 ? 'Pasti' : p >= 2 / 3 ? 'Biasanya' : p > 0 ? 'Ragu' : 'Macet';
      kelSumber = 'riwayat ' + kBln + '/' + nBln + ' bln';
    } else {
      if (koef === 2 || lalu === false) kel = 'Ragu';
      else if (lalu === true && (segmen === 'Desa' || segmen === 'Instansi')) kel = 'Pasti';
      else kel = 'Biasanya';
      kelSumber = 'perkiraan' + (nBln ? ' (' + kBln + '/' + nBln + ' bln)' : '');
    }
    var hb = hariBayarTipikal_(npp, D);

    var thKeps = String(keBlth_(m.keps_awal || mon.keps_awal || dbu.blth_keps)).slice(0, 4);
    var flags = [];
    if (+thKeps === tahunIni) flags.push('PK baru ' + tahunIni);
    if (koef <= 0 && itb !== 'Y') flags.push('IBR cukup belum posting');
    if (!ku || !ku.wa) flags.push('Tanpa WA');
    if (nonAsn === 'Ya') flags.push('Non-ASN');
    if (!m.npp) flags.push('Belum di master');

    var grup = '', grupJenis = '', grupId = '';
    if (m.grup_manual) { grup = String(m.grup_manual); grupJenis = 'Manual'; grupId = 'M:' + normCari_(grup); }
    else {
      var pg = rs.filter(function (r) { return r.pengendali === 'Ya' && jumlahPk(String(r.id_pengurus)) >= 2; });
      if (pg.length) {

    var kunci = [namaResmi, m.nama_lapangan, w.nama, npp, grup, m.desa, m.kecamatan].concat(D.alias[npp] || []).concat(kelSaya);
    rs.forEach(function (r) { var pp = D.peng[String(r.id_pengurus)]; if (pp) kunci.push(pp.nama); });
    var tokSet = {}, tokens = [];
    normCari_(kunci.join(' ')).split(' ').forEach(function (t) { if (t && !tokSet[t]) { tokSet[t] = true; tokens.push(t); } });

    var aksi = itb === 'Y' ? 'Sudah ITB bulan ini' : AKSI_KELOMPOK[kel];
    if (!ku || !ku.wa) aksi += ' · lengkapi nomor WA';

    out.push({
      npp: npp, div: w.div, nama: nama, segmen: segmen, skala: skala, kecamatan: m.kecamatan || '', jenis_usaha: jenisUsaha,
      grup: grup, kelompok_saya: kelSaya.join(', '),
      kontak_utama: ku ? ku.p.nama + ' (' + (ku.p.no_wa || ku.p.no_hp_2) + ')' : '', status_bayar: status, koef: koef,
      itw: itw, itb: itb, perkiraan_tunggakan: tunggakan, iuran_terakhir: iuran, blth_posting: keBlth_(w.blth_posting), bln_belum_posting: bln,
      ibr_nilai: angka_(w.ibr_nilai), tk_aktif: tk || '',
      hari_bayar_tipikal: hb.hari || '', kebiasaan_bayar: kel, kebiasaan_sumber: kelSumber, aksi: aksi,
      flags: flags.join(', '), kata_kunci: tokens.join(' '), periode_data: tglIndo_(D.periodeItw),
      _ku: ku, _bln: bln, _lalu: lalu, _nBln: nBln, _kBln: kBln, _blthPosting: keBlth_(w.blth_posting), _namaResmi: namaResmi,
      _grupId: grupId, _grupJenis: grupJenis, _kelSaya: kelSaya, _ilo: kodeIlo || normCari_(namaIlo), _tkBaru: +thKeps === tahunIni,
      _kepsAwal: keBlth_(m.keps_awal || mon.keps_awal || dbu.blth_keps), _nonAsn: nonAsn === 'Ya', _m: m, _mon: mon, _dbu: dbu, _rs: rs, _w: w
    });
  });
  var urut = { 'Telat 2 bulan+': 0, 'Telat 1 bulan': 1, 'Belum bulan ini': 2, 'Sudah ITB': 3 };
  out.sort(function (a, b) {
    return (urut[a.status_bayar] - urut[b.status_bayar]) || (b.koef - a.koef) || (b.perkiraan_tunggakan - a.perkiraan_tunggakan) ||
      (a.nama < b.nama ? -1 : 1);
  });
  return out;
}

var URUT_DASAR = { 'Pengurus': 0, 'Kelompok saya': 1, 'Kecamatan': 2, 'Jenis usaha': 3 };

/** Grup dengan empat dasar: pengurus (pengendali/kontak bersama/manual), kelompok saya, kecamatan, jenis usaha (ILO). */
function hitungGrup_(R) {
  var g = {};
  function tambah(dasar, kunci, nama, jenis, r, p) {
    var id = dasar + '|' + kunci, x = g[id];
    if (!x) {
      x = g[id] = { dasar: dasar, grup: nama, jenis: jenis, kontak: '', no_wa: '', jumlah_pk: 0, sudah_itb: 0, belum_bulan_ini: 0,
        telat: 0, perkiraan_tunggakan: 0, iuran_per_bulan: 0, tk_aktif: 0, _kec: {}, _pk: [] };
      if (p) { x.kontak = p.nama + (p.jabatan_umum ? ' (' + p.jabatan_umum + ')' : ''); x.no_wa = p.no_wa || p.no_hp_2 || ''; }
    }
    if (dasar === 'Pengurus' && !x.kontak && r._ku) { x.kontak = r._ku.p.nama; x.no_wa = r._ku.p.no_wa || ''; }
    x.jumlah_pk++;
    if (r.itb === 'Y') x.sudah_itb++;
    else if (r.itw === 'Y') x.belum_bulan_ini++;
    else x.telat++;
    x.perkiraan_tunggakan += r.perkiraan_tunggakan;
    x.iuran_per_bulan += r.iuran_terakhir;
    x.tk_aktif += r.tk_aktif || 0;
    if (r.kecamatan) x._kec[r.kecamatan] = (x._kec[r.kecamatan] || 0) + 1;
    x._pk.push(r.nama + (r.itb === 'Y' ? ' ✓' : r.itw === 'Y' ? '' : ' (telat)'));
  }
  R.forEach(function (r) {
    if (r._grupId) {
      var p = r._ku && String(r._ku.p.id_pengurus) === r._grupId ? r._ku.p : null;
      tambah('Pengurus', r._grupId, r.grup, r._grupJenis, r, p);
    }
    r._kelSaya.forEach(function (k) { tambah('Kelompok saya', normCari_(k), k, 'Buatan petugas', r); });
    tambah('Kecamatan', normCari_(r.kecamatan) || '-', r.kecamatan || '(kecamatan belum diisi)', '', r);
    tambah('Jenis usaha', r._ilo || '-', r.jenis_usaha || '(kode ILO belum ada)', '', r);
  });
  var daftar = Object.keys(g).map(function (k) {
    var x = g[k];
    x.kecamatan = Object.keys(x._kec).sort(function (a, b) { return x._kec[b] - x._kec[a]; }).slice(0, 2).join(', ');
    x.daftar_pk = x._pk.join('; ');
    return x;
  });
  daftar.sort(function (a, b) {
    return (URUT_DASAR[a.dasar] - URUT_DASAR[b.dasar]) || (b.jumlah_pk - a.jumlah_pk) || (b.telat - a.telat) || (a.grup < b.grup ? -1 : 1);
  });
  return daftar;
}

var WARNA_STATUS = { 'Sudah ITB': WARNA.latarHijau, 'Belum bulan ini': WARNA.latarBiru, 'Telat 1 bulan': WARNA.latarKuning, 'Telat 2 bulan+': WARNA.latarMerah };
var WARNA_RAPOR = { Hijau: WARNA.latarHijau, Kuning: WARNA.latarKuning, Merah: WARNA.latarMerah };
var WARNA_KELOMPOK = { Pasti: WARNA.latarHijau, Biasanya: WARNA.latarBiru, Ragu: WARNA.latarKuning, Macet: WARNA.latarMerah };

function warnaiKolom_(sh, kepala, nama, nilai, peta) {

function perbaruiHasilPosting_(D, R) {
  var itbNow = {};
  R.forEach(function (r) { itbNow[r.npp] = r.itb === 'Y'; });
  var ubah = [], cacheH = {};
  D.log.forEach(function (o) {
    if (['WA', 'Telepon', 'Kunjungan', 'Surat', 'Email'].indexOf(String(o.jenis)) < 0) return;
    var tgl = keTanggal_(o.tanggal), npp = String(o.npp || '');
    if (!tgl || !npp || npp.indexOf(',') >= 0) return;
    var lama = String(o.hasil_posting || '');
    if (lama && lama.indexOf('Menunggu') !== 0 && lama.indexOf('Belum') !== 0) return;
    var bulanLog = mIdx_(tgl.slice(0, 7)), baru = '';
    if (bulanLog === D.M0) {
      if (itbNow[npp]) baru = 'Terposting (cek ' + tglIndo_(D.periodeItw) + ')';
      else baru = selisihHari_(tgl, D.hariIni) >= 7 ? 'Belum terposting ≥7 hari' : 'Menunggu';
    } else if (bulanLog < D.M0) {
      var h = cacheH[npp] || (cacheH[npp] = riwayatItb_(npp, D));
      baru = h[bulanLog] === true ? 'Terposting di bulan itu' : h[bulanLog] === false ? 'Tidak terposting di bulan itu' : (lama || '');
    }
    if (baru && baru !== lama) { o.hasil_posting = baru; ubah.push(o); }
  });
  if (!ubah.length) return;
  if (ubah.length > 25) tulisTab_('LOG_INTERAKSI', D.log);
  else ubah.forEach(function (o) { ubahSel_('LOG_INTERAKSI', o, ['hasil_posting']); });
}

/** Mengisi ID dan nilai bawaan yang kosong pada tab yang diisi petugas. */
function lengkapiId_() {
  var atur = [
    ['JADWAL', 'id_jadwal', 'J', function (o) { var u = false; if (!o.status) { o.status = 'Rencana'; u = true; } return u; }],
    ['LOG_INTERAKSI', 'id_log', 'L', function () { return false; }],
    ['PENGURUS', 'id_pengurus', 'P', function (o) { var u = false; if (!o.status) { o.status = 'Aktif'; u = true; } return u; }],
    ['RELASI', 'id_relasi', 'R', function (o) { var u = false; if (!o.aktif) { o.aktif = 'Ya'; u = true; } return u; }]
  ];
  atur.forEach(function (a) {
    var t = bacaTab_(a[0]);
    var next = idBerikut_(a[2], t.data.map(function (o) { return o[a[1]]; }));
    var ubah = [];
    t.data.forEach(function (o) {
      var u = a[3](o);
      if (!o[a[1]]) { o[a[1]] = next(); u = true; }
      if (u) ubah.push(o);
    });
    if (!ubah.length) return;
    if (ubah.length > 20) tulisTab_(a[0], t.data);
    else ubah.forEach(function (o) { ubahSel_(a[0], o, [a[1], 'status', 'aktif'].filter(function (k) { return t.kepala.indexOf(k) >= 0; })); });
  });
}

/* ============================ HARI_INI ============================ */
// Kolom: A centang · B kontak/label · C PK/nilai · D status/catatan · E tautan WA · F no HP · G kanal
//        H npp (tersembunyi) · I id kontak|tahap|bulan (tersembunyi) · J tercatat · K id log (tersembunyi)

var HI_LEBAR = 11;

function bersihkanHariIni_(sh) {
  if (sh.getMaxColumns() < HI_LEBAR) sh.insertColumnsAfter(sh.getMaxColumns(), HI_LEBAR - sh.getMaxColumns());
  var rg = sh.getRange(1, 1, sh.getMaxRows(), sh.getMaxColumns());
  rg.clearDataValidations();
  rg.clear();
  try { sh.showColumns(1, sh.getMaxColumns()); } catch (e) { /* diam */ }
}

function tulisHariIniKosong_(pesan) {
  var sh = lembar_('HARI_INI');
  bersihkanHariIni_(sh);
  sh.getRange(1, 1, 2, 1).setValues([['LENSA PK · Hari ini'], [pesan]]);
  sh.getRange(1, 1).setFontSize(14).setFontWeight('bold').setFontColor(WARNA.biru);
}

function tahap_(d) {
  var sapu = Pn_('sapu_akhir_tgl'), tel = Pn_('telepon_akhir_tgl'), batas = Pn_('batas_aman_posting'), h = Pn_('h_minus_hari_bayar');
  if (d < sapu) return { kode: 'awal', judul: 'Awal bulan', kanal: 'WA',
    ket: 'Surat + rincian (Konseptor) dan email untuk semua PK. WA hanya untuk PK yang telat dan yang mendekati hari bayarnya (H-' + h + ').' };
  if (d < tel) return { kode: 'sapu', judul: 'Sapu akhir bulan', kanal: 'WA', ket: 'WA satu pesan per kontak, hanya untuk PK yang belum posting.' };
  if (d <= batas) return { kode: 'telepon', judul: 'Telepon', kanal: 'Telepon', ket: 'Telepon PK yang belum posting sebelum batas aman tanggal ' + batas + '.' };
  return { kode: 'lewat', judul: 'Lewat batas aman', kanal: 'Telepon', ket: 'Posting setelah tanggal ' + batas + ' bisa tercatat bulan depan. Tetap hubungi yang belum.' };
}

function susunPesan_(p, items, tahap, D, batasTgl) {
  var semuaTelat = items.every(function (i) { return i.alasan === 'telat'; });
  var templat = semuaTelat ? P_('templat_telat') : tahap.kode === 'awal' ? P_('templat_pengingat') : P_('templat_sapu');
  var tanda = String(P_('penanda_daftar') || '•').trim() || '•';
  var adaKode = false;
  var daftar = items.map(function (i) {
    var t = tanda + ' ' + i.r._namaResmi;
    if (i.alasan === 'telat' && i.r._blthPosting) t += ' (belum terbayar sejak ' + namaBulan_(blthDariIdx_(mIdx_(i.r._blthPosting) + 1)) + ')';
    var kode = kodeIuran_(i.r.npp, (D.per && D.per[String(i.r.npp)] || {}).kode_iuran);
    if (kode) { t += '\n   Kode iuran: ' + kode; adaKode = true; }
    return t;
  }).join('\n') + (adaKode ? '\n\n' + teksKanalBayar_() : '');
  // {salam} sengaja dibiarkan: diisi saat tautan dibuat (Sheets) atau saat tombol WA diketuk (aplikasi HP), sesuai jam kirim.
  return String(templat)
    .replace(/\{sapaan\}/g, p.sapaan || 'Bapak/Ibu')
    .replace(/\{bulan\}/g, namaBulan_(D.bulanIni))
    .replace(/\{daftar\}/g, daftar)
    .replace(/\{batas\}/g, tglSedang_(batasTgl))
    .replace(/\{petugas\}/g, P_('nama_petugas') || 'Petugas pembina')
    .replace(/\{kantor\}/g, P_('kantor') || '');
}

function tulisHariIni_(D, R) {
  var sh = lembar_('HARI_INI');
  var hi = D.hariIni, d = +hi.slice(8, 10), blth = D.bulanIni;
  var batasTgl = tanggalBulan_(blth, Pn_('batas_aman_posting'));
  var aktif = R.length;
  var nItb = R.filter(function (r) { return r.itb === 'Y'; }).length;
  var nItw = R.filter(function (r) { return r.itw === 'Y'; }).length;
  var target = Math.round(aktif * Pn_('target_itb_persen') / 100);
  var proyeksi = R.filter(function (r) { return r.itb === 'Y' || r._lalu === true; }).length;
  var kurang = Math.max(0, target - proyeksi);
  var hk = hi <= batasTgl ? jumlahHariKerja_(hi, batasTgl, D.libur) : 0;
  var kuota = kurang ? (hk ? Math.ceil(kurang / hk) : kurang) : 0;
  var tahap = tahap_(d);
  var H = Pn_('h_minus_hari_bayar');

  // kontak terakhir per PK
  var terakhir = {};
  D.log.forEach(function (o) {
    var t = keTanggal_(o.tanggal);
    if (!t) return;
    String(o.npp || '').split(/[,;\s]+/).forEach(function (n) { if (n && (!terakhir[n] || t > terakhir[n])) terakhir[n] = t; });
  });
  var mulaiJeda = tahap.kode === 'awal' ? tambahHari_(hi, -(Pn_('jeda_kontak_hari') - 1))
    : tahap.kode === 'sapu' ? tanggalBulan_(blth, Pn_('sapu_akhir_tgl'))
    : tahap.kode === 'telepon' ? tanggalBulan_(blth, Pn_('telepon_akhir_tgl'))
    : tambahHari_(batasTgl, 1);

  var calon = [], tanpaKontak = 0, sudahDihubungi = 0;
  R.forEach(function (r) {
    if (r.itb === 'Y') return;
    var alasan = null, hb = +r.hari_bayar_tipikal || 0;
    if (tahap.kode === 'awal') {
      if (r.koef >= 2) alasan = 'telat';
      else if (r.kebiasaan_bayar !== 'Pasti' && hb && d >= hb - H && d <= hb) alasan = 'h3';
    } else if (!(tahap.kode === 'sapu' && r.kebiasaan_bayar === 'Pasti' && hb > d)) {
      alasan = r.koef >= 2 ? 'telat' : 'belum';
    }
    if (!alasan) return;
    if (terakhir[r.npp] && terakhir[r.npp] >= mulaiJeda) { sudahDihubungi++; return; }
    if (!r._ku) { tanpaKontak++; return; }
    calon.push({ r: r, alasan: alasan });
  });
  var perKontak = {};
  calon.forEach(function (c) {
    var id = String(c.r._ku.p.id_pengurus);
    (perKontak[id] = perKontak[id] || { p: c.r._ku.p, wa: c.r._ku.wa, items: [] }).items.push(c);
  });
  var kontak = Object.keys(perKontak).map(function (k) {
    var x = perKontak[k];
    x.skor = 0; x.tunggakan = 0;
    x.items.forEach(function (i) { x.skor += i.r.koef <= 1 ? 3 : i.r.koef === 2 ? 2 : 1; x.tunggakan += i.r.perkiraan_tunggakan; });
    return x;
  });
  kontak.sort(function (a, b) { return (b.skor - a.skor) || (b.tunggakan - a.tunggakan) || (String(a.p.nama) < String(b.p.nama) ? -1 : 1); });
  var totalKontak = kontak.length;
  kontak = kontak.slice(0, Pn_('batas_daftar_harian'));

  // ----- susun baris -----
  var rows = [], gaya = [];
  function baris(v, g) {
    var r = [];
    for (var i = 0; i < HI_LEBAR; i++) r.push(v[i] === undefined ? '' : v[i]);
    rows.push(r);
    gaya.push(g || '');
    return rows.length;
  }
  baris(['LENSA PK · Hari ini · ' + tglPanjang_(hi)], 'judul');
  baris(['Data ITW/ITB ' + tglIndo_(D.periodeItw) + (D.periodeMon ? ' · Monitoring ' + tglIndo_(D.periodeMon) : '') +
    (D.periodeDbu ? ' · Data BU ' + tglIndo_(D.periodeDbu) : '') + ' · dihitung ' + sekarangStr_()], 'kecil');
  var umurItw = selisihHari_(D.periodeItw, hi);
  if (D.itwKedaluwarsa || umurItw > 7) {
    baris(['⚠ Data ITW/ITB berumur ' + umurItw + ' hari' + (D.itwKedaluwarsa ? ' (bulan lalu; status bulan ini diperkirakan)' : '') + '. Impor laporan terbaru agar daftar akurat.'], 'peringatan');
  }
  baris([]);
  baris(['', 'Target ITB ' + namaBulan_(blth)], 'bagian');
  baris(['', 'PK aktif', aktif]);
  baris(['', 'Sudah ITB', nItb + ' (' + persen_(nItb, aktif) + '%)']);
  baris(['', 'ITW', nItw + ' (' + persen_(nItw, aktif) + '%)']);
  baris(['', 'Target ITB ' + Pn_('target_itb_persen') + '%', target]);
  baris(['', 'Proyeksi akhir bulan', proyeksi, 'PK sudah ITB + PK yang bulan lalu ITB (perkiraan)']);
  baris(['', 'Kurang dari target', kurang, kurang ? 'perlu dikejar sebelum ' + tglSedang_(batasTgl) : 'target terlampaui bila kebiasaan bulan lalu berulang'], kurang ? 'tebal' : '');
  baris(['', 'Hari kerja s.d. ' + tglPendek_(batasTgl), hk]);
  baris(['', 'Tambahan per hari kerja', kuota ? kuota + ' PK' : '–'], 'tebal');
  if (D.cekItw) baris(['', 'Cek angka kantor', D.cekItw.indexOf('cocok') >= 0 ? 'Cocok dengan rekap pembina' : D.cekItw.indexOf('BEDA') >= 0 ? 'BEDA dengan rekap pembina' : 'Rekap pembina tidak ada di file', D.cekItw]);
  var kel = { Pasti: 0, Biasanya: 0, Ragu: 0, Macet: 0 }, perk = 0;
  R.forEach(function (r) { if (kel[r.kebiasaan_bayar] !== undefined) kel[r.kebiasaan_bayar]++; if (String(r.kebiasaan_sumber).indexOf('perkiraan') === 0) perk++; });
  baris(['', 'Kebiasaan bayar', 'Pasti ' + kel.Pasti + ' · Biasanya ' + kel.Biasanya + ' · Ragu ' + kel.Ragu + ' · Macet ' + kel.Macet,
    perk > aktif / 2 ? 'masih perkiraan; makin tepat setelah snapshot 3–6 bulan terkumpul' : 'dari riwayat snapshot']);
  baris([]);
  baris(['', 'Tahap: ' + tahap.judul, tahap.ket], 'bagian');
  baris([]);

  var kepTabel = baris(['✓', 'Kontak', 'PK', 'Status', 'Kirim', 'No. HP', 'Kanal', 'npp', 'id', 'Tercatat', 'id_log'], 'kepalaTabel');
  var awalTabel = rows.length + 1;
  var tautan = [];
  if (!kontak.length) {
    baris(['', 'Tidak ada kontak yang perlu dihubungi lewat WA/telepon hari ini.' + (sudahDihubungi ? ' (' + sudahDihubungi + ' PK sudah dihubungi dalam jeda.)' : '')], 'kecil');
  }
  kontak.forEach(function (x) {
    var p = x.p;
    var nPk = x.items.length;
    var belum = x.items.filter(function (i) { return i.r.koef <= 1; }).length;
    var telat = x.items.filter(function (i) { return i.r.koef >= 2; });
    var maksTelat = telat.reduce(function (m, i) { return Math.max(m, i.r.koef - 1); }, 0);
    var st = [];
    if (belum) st.push(belum + ' belum bulan ini');
    if (telat.length) st.push(telat.length + ' telat' + (maksTelat ? ' s.d. ' + maksTelat + ' bln' : ''));
    if (x.tunggakan) st.push('± ' + rupiahRingkas_(x.tunggakan));
    var namaPk = x.items.slice(0, 5).map(function (i) { return i.r.nama; });
    if (nPk > 5) namaPk.push('… dan ' + (nPk - 5) + ' lagi');
    var kanal = x.wa ? tahap.kanal : 'Telepon';
    var pesan = susunPesan_(p, x.items, tahap, D, batasTgl);
    var r = baris(['', p.nama + (nPk > 1 ? '\n' + nPk + ' PK' : ''), namaPk.join('\n'), st.join('\n'), x.wa ? 'Kirim WA' : '',
      hpTampil_(p.no_wa || p.no_hp_2), kanal, x.items.map(function (i) { return i.r.npp; }).join(','),
      p.id_pengurus + '|' + tahap.kode + '|' + blth, '', ''], 'kontak');
    tautan.push({ baris: r, url: urlWa_(x.wa, pesan) });
  });
  if (totalKontak > kontak.length) baris(['', '… ' + (totalKontak - kontak.length) + ' kontak lain menunggu (batas ' + kontak.length + ' per hari, atur di PENGATURAN).'], 'kecil');
  var akhirTabel = rows.length;

  // jadwal & janji
  baris([]);
  baris(['', 'Jadwal hari ini'], 'bagian');
  var jHari = D.jadwal.filter(function (o) { return keTanggal_(o.tanggal) === hi && o.status !== 'Batal' && o.status !== 'Selesai'; });
  jHari.sort(function (a, b) { return jamRapi_(a.jam_mulai) < jamRapi_(b.jam_mulai) ? -1 : 1; });
  if (!jHari.length) baris(['', 'Tidak ada agenda.'], 'kecil');
  jHari.slice(0, 12).forEach(function (o) {
    baris(['', jamRapi_(o.jam_mulai) || 'Sepanjang hari', (o.jenis ? o.jenis + ': ' : '') + o.judul, [o.lokasi, o.kecamatan].filter(String).join(', ')]);
  });
  var itbNow = {}, namaPk = {};
  R.forEach(function (r) { itbNow[r.npp] = r.itb === 'Y'; namaPk[r.npp] = r.nama; });
  var janji = D.log.filter(function (o) {
    var t = keTanggal_(o.tgl_tindak_lanjut);
    return t && t <= hi && (o.komitmen || o.status === 'Janji bayar') && !itbNow[String(o.npp)] && namaPk[String(o.npp)];
  });
  if (janji.length) {
    baris(['', 'Janji bayar jatuh tempo (belum terposting)'], 'bagian');
    janji.slice(0, 10).forEach(function (o) {
      baris(['', namaPk[String(o.npp)], o.komitmen || 'Janji bayar', 'jatuh tempo ' + tglIndo_(keTanggal_(o.tgl_tindak_lanjut))]);
    });
  }

  // perlu perhatian
  baris([]);
  baris(['', 'Perlu perhatian'], 'bagian');
  var hit = function (f) { return R.filter(f).length; };
  var macet = R.filter(function (r) { return r.status_bayar === 'Telat 2 bulan+'; });
  var tung = R.reduce(function (s, r) { return s + r.perkiraan_tunggakan; }, 0);
  var baruTh = R.filter(function (r) { return r._tkBaru; });
  var baruItw = baruTh.filter(function (r) { return r.itw === 'Y'; }).length;
  var bulanKontak = {}, bulanTerposting = 0;
  D.log.forEach(function (o) {
    var t = keTanggal_(o.tanggal);
    if (t && t.slice(0, 7) === blth && ['WA', 'Telepon', 'Kunjungan', 'Surat', 'Email'].indexOf(String(o.jenis)) >= 0) bulanKontak[String(o.npp)] = true;
  });
  Object.keys(bulanKontak).forEach(function (n) { if (itbNow[n]) bulanTerposting++; });
  var nKontak = Object.keys(bulanKontak).length;
  [
    ['Telat 2 bulan+', macet.length, '± ' + rupiahRingkas_(macet.reduce(function (s, r) { return s + r.perkiraan_tunggakan; }, 0)) + ' perkiraan tunggakan'],
    ['Telat 1 bulan', hit(function (r) { return r.status_bayar === 'Telat 1 bulan'; }), ''],
    ['Perkiraan tunggakan seluruh PK', rupiahRingkas_(tung), '(koef − 1) × iuran terakhir; bukan angka resmi'],
    ['PK baru ' + hi.slice(0, 4) + ' belum ITW', baruTh.length - baruItw, baruTh.length ? 'ITW PK baru ' + persen_(baruItw, baruTh.length) + '% dari ' + baruTh.length + ' PK' : ''],
    ['PK tanpa nomor WA', hit(function (r) { return r.flags.indexOf('Tanpa WA') >= 0; }), tanpaKontak ? tanpaKontak + ' di antaranya perlu dihubungi hari ini' : ''],
    ['Saldo IBR cukup, belum terposting', hit(function (r) { return r.flags.indexOf('IBR cukup') >= 0; }), 'koefisien ≤ 0 tetapi belum ITB bulan ini'],
    ['TINJAU menunggu keputusan', D.tinjauMenunggu, D.tinjauMenunggu ? 'buka tab TINJAU' : ''],
    ['Konversi pengingat ' + NAMA_BULAN[+blth.slice(5, 7) - 1], nKontak ? bulanTerposting + ' dari ' + nKontak + ' PK' : '–', nKontak ? persen_(bulanTerposting, nKontak) + '% sudah ITB setelah dihubungi' : 'belum ada kontak tercatat bulan ini']
  ].forEach(function (x) { baris(['', x[0], x[1], x[2]]); });
  if (modulAktif_('analisa')) baris(['', 'KPI migrasi piutang, churn, length of stay, dan rapor PK ada di tab ANALISA.'], 'kecil');

  // ----- tulis -----
  bersihkanHariIni_(sh);
  pastikanBaris_(sh, rows.length + 5);
  sh.getRange(1, 2, sh.getMaxRows(), HI_LEBAR - 1).setNumberFormat('@');
  sh.getRange(1, 1, rows.length, HI_LEBAR).setValues(rows);
  sh.getRange(1, 1, rows.length, HI_LEBAR).setVerticalAlignment('top').setWrap(true).setFontColor(WARNA.teks);
  gaya.forEach(function (g, i) {
    var r = i + 1;
    if (g === 'judul') sh.getRange(r, 1).setFontSize(14).setFontWeight('bold').setFontColor(WARNA.biru).setWrap(false);
    else if (g === 'kecil') sh.getRange(r, 1, 1, HI_LEBAR).setFontColor(WARNA.teksPudar).setFontSize(9);
    else if (g === 'peringatan') sh.getRange(r, 1).setFontColor(WARNA.merah).setFontWeight('bold').setWrap(false);

function tanganiCentang_(sh, row) {

function tanganiJadwal_(sh, range) {

function ulangJadwal_() {

    var n = {};
    Object.keys(o).forEach(function (k) { if (k.charAt(0) !== '_') n[k] = o[k]; });
    n.id_jadwal = next(); n.tanggal = berikut; n.status = 'Rencana'; n.hasil = ''; n.id_log = ''; n.id_kalender = '';
    n.catatan = 'lanjutan ' + o.id_jadwal;

    ubah.push(o);

  ubah.forEach(function (o) { ubahSel_('JADWAL', o, ['ulang']); });

  });

  var nilai = [['Kalender jadwal ' + namaBulan_(blth), '', '', '', '', '', ''], ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu']];
  var latar = [[null, null, null, null, null, null, null], [WARNA.latarAbu, WARNA.latarAbu, WARNA.latarAbu, WARNA.latarAbu, WARNA.latarAbu, WARNA.latarAbu, WARNA.latarAbu]];

    if (minggu.length === 7) { nilai.push(minggu); latar.push(lt); minggu = []; lt = []; }
  }

function salinKeKalender_() {

  t.data.forEach(function (o) {

      return;
    }
    if (o.status === 'Selesai' || tgl < tambahHari_(hi, -1)) return;
    var judul = (o.jenis && o.jenis !== 'Lainnya' ? o.jenis + ': ' : '') + o.judul;
    var jam = jamRapi_(o.jam_mulai), jamS = jamRapi_(o.jam_selesai);
    var mulai = jam ? tglJamKeDate_(tgl, jam) : null;
    var selesai = jam ? (jamS ? tglJamKeDate_(tgl, jamS) : new Date(mulai.getTime() + 3600000)) : null;
    var opsi = { description: (o.npp_list ? 'NPP: ' + o.npp_list + '\n' : '') + 'Dari LENSA PK (' + o.id_jadwal + ')', location: [o.lokasi, o.kecamatan].filter(String).join(', ') };
    var ev = null;
    if (id) { try { ev = cal.getEventById(id); } catch (e) { ev = null; } }
    if (!ev) {
      ev = jam ? cal.createEvent(judul, mulai, selesai, opsi) : cal.createAllDayEvent(judul, tglJamKeDate_(tgl, '12:00'), opsi);
      var mnt = menitPengingat_(o.pengingat);
      if (mnt !== null) ev.addPopupReminder(mnt);
      o.id_kalender = ev.getId();
      ubah.push(o);
      hasil.dibuat++;
      return;
    }
    var berubah = false;
    if (ev.getTitle() !== judul) { ev.setTitle(judul); berubah = true; }
    if (jam) {
      if (ev.isAllDayEvent() || ev.getStartTime().getTime() !== mulai.getTime() || ev.getEndTime().getTime() !== selesai.getTime()) { ev.setTime(mulai, selesai); berubah = true; }
    } else if (!ev.isAllDayEvent() || fmt_(ev.getAllDayStartDate(), 'yyyy-MM-dd') !== tgl) {
      ev.setAllDayDate(tglJamKeDate_(tgl, '12:00')); berubah = true;
    }
    if (berubah) hasil.diubah++;
  });
  ubah.forEach(function (o) { ubahSel_('JADWAL', o, ['id_kalender']); });
  return hasil;
}

var URUTAN_IMPOR = ['DATA_BU', 'MONITORING', 'ITW_ITB', 'KPI084', 'KPI085'];
var LABEL_IMPOR = { DATA_BU: 'Data BU', MONITORING: 'Monitoring', ITW_ITB: 'ITW/ITB', KPI084: 'KPI084', KPI085: 'KPI085' };

function hariKerjaTerakhir_(blth, libur) {
  var s = tanggalBulan_(blth, 31);
  for (var i = 0; i < 14 && !hariKerja_(s, libur); i++) s = tambahHari_(s, -1);
  return s;
}

/** Laporan yang dijadwalkan diimpor pada tanggal s: awal bulan semua, Senin ITW/ITB + Monitoring, Kamis ITW/ITB,
 *  masa sapu (sehari sebelum sapu s.d. batas aman) ITW/ITB tiap hari kerja, akhir bulan ITW/ITB + Monitoring. */
function laporanImpor_(s, libur) {
  if (!hariKerja_(s, libur)) return null;
  var blth = s.slice(0, 7), d = +s.slice(8, 10), h = hariMinggu_(s), set = {}, jenis = 'biasa';
  if (s === geserKeHariKerja_(blth + '-01', libur)) { URUTAN_IMPOR.forEach(function (k) { set[k] = true; }); jenis = 'awal'; }
  if (h === 1) { set.ITW_ITB = true; set.MONITORING = true; }
  if (h === 4) set.ITW_ITB = true;
  if (d >= Pn_('sapu_akhir_tgl') - 1 && d <= Pn_('batas_aman_posting')) { set.ITW_ITB = true; if (jenis === 'biasa') jenis = 'sapu'; }
  if (s === hariKerjaTerakhir_(blth, libur) && jenis !== 'awal') { set.ITW_ITB = true; set.MONITORING = true; jenis = 'akhir'; }
  var kode = URUTAN_IMPOR.filter(function (k) { return set[k]; });
  if (!kode.length) return null;
  var label = kode.map(function (k) { return k === 'KPI085' ? 'KPI085 periode 01 ' + NAMA_BULAN[+blth.slice(5, 7) - 1].slice(0, 3).toUpperCase() : LABEL_IMPOR[k]; });
  var judul = label.join(', ') + { awal: ' (awal bulan)', akhir: ' (akhir bulan)', sapu: ' (masa sapu)', biasa: '' }[jenis];
  return { kode: kode, judul: judul, jam: jenis === 'akhir' ? '14:00' : (jamRapi_(P_('pengingat_impor_jam')) || '08:00') };
}

/** Menyusun agenda "Impor" di JADWAL untuk 14 hari ke depan (dipanggil tiap pagi). Agenda impor yang terlewat
 *  dan yang tidak lagi sesuai jadwal dibatalkan (acaranya ikut terhapus dari Google Kalender). */
function buatPengingatImpor_() {
  var hi = hariIniStr_(), akhir = tambahHari_(hi, 13), libur = setLibur_(), aktif = P_('pengingat_impor') !== 'Tidak';
  var t = bacaTab_('JADWAL'), ada = {}, hasil = { baru: 0, ubah: 0, batal: 0 };
  t.data.forEach(function (o) {
    if (o.sumber !== 'Pengingat impor' || o.status === 'Batal') return;
    var tg = keTanggal_(o.tanggal);
    if (!tg) return;
    if (o.status === 'Rencana' && (tg < hi || (!aktif && tg >= hi))) {
      o.status = 'Batal'; o.hasil = tg < hi ? 'Terlewat' : 'Pengingat impor dimatikan';
      ubahSel_('JADWAL', o, ['status', 'hasil']); hasil.batal++;
      return;
    }
    ada[tg] = o;
  });
  if (!aktif) return hasil;
  var next = idBerikut_('J', t.data.map(function (o) { return o.id_jadwal; })), baru = [];
  for (var s = hi; s <= akhir; s = tambahHari_(s, 1)) {
    var L = laporanImpor_(s, libur), o = ada[s];
    if (o) {
      if (o.status !== 'Rencana') continue;
      if (!L) { o.status = 'Batal'; o.hasil = 'Tidak lagi dijadwalkan'; ubahSel_('JADWAL', o, ['status', 'hasil']); hasil.batal++; }
      else if (o.judul !== L.judul) { o.judul = L.judul; o.catatan = 'impor:' + L.kode.join(','); ubahSel_('JADWAL', o, ['judul', 'catatan']); hasil.ubah++; }
      continue;
    }
    if (!L) continue;
    baru.push({ id_jadwal: next(), tanggal: s, jam_mulai: L.jam, jam_selesai: '', jenis: 'Impor', judul: L.judul, npp_list: '', id_pengurus: '',
      lokasi: '', kecamatan: '', pengingat: 'Saat mulai', ulang: 'Tidak', status: 'Rencana', hasil: '', id_log: '', sumber: 'Pengingat impor',
      id_kalender: '', catatan: 'impor:' + L.kode.join(',') });
  }
  tambahBaris_('JADWAL', baru);
  hasil.baru = baru.length;
  return hasil;
}

/** Setelah impor: agenda impor hari ini ditandai Selesai bila semua laporannya sudah masuk hari ini,
 *  dan notifikasinya di Google Kalender dimatikan (judul diberi ✓). */
function tandaiImporSelesai_() {
  var hi = hariIniStr_();
  var rows = bacaTab_('JADWAL').data.filter(function (o) { return o.sumber === 'Pengingat impor' && o.status === 'Rencana' && keTanggal_(o.tanggal) === hi; });
  if (!rows.length) return 0;
  var sudah = {};
  bacaTab_('LOG_IMPOR').data.forEach(function (o) {
    if (String(o.pesan).indexOf('OK') === 0 && keTanggal_(o.waktu) === hi) sudah[String(o.jenis)] = true;
  });
  var n = 0;
  rows.forEach(function (o) {
    var kode = (String(o.catatan || '').match(/impor:([A-Z0-9_,]+)/) || ['', ''])[1].split(',').filter(String);
    if (!kode.length) return;
    var ok = kode.filter(function (k) { return sudah[NAMA_LAPORAN[k]]; }), belum = kode.filter(function (k) { return !sudah[NAMA_LAPORAN[k]]; });
    var lb = function (k) { return LABEL_IMPOR[k] || k; };
    if (!belum.length) {
      o.status = 'Selesai'; o.hasil = 'Semua laporan sudah diimpor';
      ubahSel_('JADWAL', o, ['status', 'hasil']); n++;
      if (o.id_kalender) {
        try {
          var ev = kalender_().getEventById(String(o.id_kalender));
          if (ev) { ev.removeAllReminders(); if (ev.getTitle().indexOf('✓') !== 0) ev.setTitle('✓ ' + ev.getTitle()); }
        } catch (e) { /* kalender tidak terjangkau: biarkan */ }
      }
    } else if (ok.length) {
      var h = 'Sudah: ' + ok.map(lb).join(', ') + ' · belum: ' + belum.map(lb).join(', ');
      if (o.hasil !== h) { o.hasil = h; ubahSel_('JADWAL', o, ['hasil']); }
    }
  });
  return n;
}

/* ------------------------------ cari ------------------------------ */

function cari_(q, maks) {
  var qn = normCari_(q);
  if (!qn) return [];
  var tok = qn.split(' ');
  var npp = rapikanNpp_(String(q).trim());
  var data = bacaTab_('STATUS_PK').data;
  var skor = {};
  try { bacaTab_('RAPOR').data.forEach(function (o) { skor[String(o.npp)] = o.skor; }); } catch (e) { /* modul analisa mati */ }
  data.forEach(function (o) { o.skor = skor[String(o.npp)] === undefined ? '' : skor[String(o.npp)]; });
  var ada = {};
  data.forEach(function (o) { ada[String(o.npp)] = true; });
  // PK nonaktif / di luar laporan ITW tetap bisa dicari dari master
  var alias = {};
  bacaTab_('ALIAS').data.forEach(function (o) { (alias[String(o.npp)] = alias[String(o.npp)] || []).push(String(o.alias)); });
  bacaTab_('PERUSAHAAN').data.forEach(function (o) {
    if (ada[String(o.npp)]) return;
    data.push({ npp: String(o.npp), nama: namaUtama_(o.nama_lapangan) || o.nama_perusahaan, status_bayar: o.status_kepesertaan, kebiasaan_bayar: '', grup: o.grup_manual || '', kelompok_saya: o.kelompok_saya || '',
      kontak_utama: '', kecamatan: o.kecamatan || '', kata_kunci: normCari_([o.nama_perusahaan, o.nama_lapangan, o.npp, o.kelompok_saya].concat(alias[String(o.npp)] || []).join(' ')) });
  });
  var hasil = [];
  data.forEach(function (o) {
    var kk = String(o.kata_kunci || ''), kata = kk.split(' '), skor = 0;
    if (npp && String(o.npp) === npp) skor = 100;
    else {
      for (var i = 0; i < tok.length; i++) {
        var t = tok[i], s = 0;
        for (var j = 0; j < kata.length; j++) {
          var w = kata[j];
          if (w === t) { s = Math.max(s, 3); break; }
          if (w.indexOf(t) === 0) s = Math.max(s, 2);
          else if (t.length >= 4 && w.indexOf(t) > 0) s = Math.max(s, 1);
          else if (t.length >= 5 && lev1_(t, w)) s = Math.max(s, 1);
        }
        if (!s) { skor = 0; break; }
        skor += s;
      }
      if (skor && normCari_(o.nama).indexOf(qn) === 0) skor += 5;
    }
    if (skor) hasil.push({ o: o, skor: skor });
  });
  hasil.sort(function (a, b) { return (b.skor - a.skor) || (String(a.o.nama) < String(b.o.nama) ? -1 : 1); });
  return hasil.slice(0, maks || 25).map(function (h) { h.o._alias = alias[String(h.o.npp)] || []; return h.o; });
}

function esc_(s) {
  return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

      (kontak ? '<div style="margin-top:3px">' + esc_(kontak) + (wa ? ' · <a href="' + urlWa_(wa) + '" target="_blank">WA</a>' : '') + '</div>' : '') +
      '</div>';
  });
  html += '</div>';
  ui.showModalDialog(HtmlService.createHtmlOutput(html).setWidth(520).setHeight(480), 'Hasil cari: ' + q);
}

function hapusPemicu_() {
