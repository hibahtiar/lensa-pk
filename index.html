/* ----------------------------------------------------------------------
 *  Model dasbor dari data LENSA (apiMuat + tab riwayat). Definisi mengikuti
 *  LENSA 1.14: status bayar, koefisien, kelas piutang (kelasPiutang_), target ITB.
 * ---------------------------------------------------------------------- */

var URUT_STATUS = ['Sudah ITB', 'Belum bulan ini', 'Telat 1 bulan', 'Telat 2 bulan+'];
var WARNA_STATUS2 = { 'Sudah ITB': '#1F7A56', 'Belum bulan ini': '#3F63B8', 'Telat 1 bulan': '#D99A2B', 'Telat 2 bulan+': '#B4442A' };
var URUT_KELAS = ['lancar', 'kurang_lancar', 'diragukan', 'macet'];
var WARNA_KELAS = { lancar: '#C9A227', kurang_lancar: '#C4551C', diragukan: '#A33319', macet: '#7E1A1A' };

function blthGeser(b, n) { var i = idxBln(b + '-01'); return blnDariIdx(i + n).split('-').reverse().join('-'); } // 'YYYY-MM'
function kontakUtama(p) { var k = p.kontak || []; return k.filter(function (x) { return x.utama; })[0] || k.filter(function (x) { return x.wa; })[0] || k[0] || null; }

function hitungDasbor(d) {
  var pk = d.pk || [], n = pk.length, h = d.hariIniData || {}, s = h.stats || {};
  var bulan = String(d.hariIni || '').slice(0, 7), lalu = blthGeser(bulan, -1);
  var hitung = function (f) { return pk.filter(f).length; };
  var jumlah = function (arr, k) { return arr.reduce(function (t, p) { return t + (+p[k] || 0); }, 0); };
  var per = {};
  URUT_STATUS.forEach(function (k) { per[k] = pk.filter(function (p) { return p.status === k; }); });
  var menunggak = per['Telat 2 bulan+'];
  // kelas piutang (koef − 1 = umur): naik satu kelas di akhir bulan bila belum bayar
  var kelas = {}; URUT_KELAS.forEach(function (k) { kelas[k] = []; });
  var naik = [];
  pk.forEach(function (p) {
    var ko = +p.koef || 0;
    if (p.status === 'Sudah ITB') return;
    var k = kelasPiutang_(ko);
    if (kelas[k]) kelas[k].push(p);
    if (kelasPiutang_(ko + 1) !== k) naik.push(p);
  });
  // kurva bayar: PK yang iuran bulan X terposting di bulan X, kumulatif per tanggal
  var aktif = {}; pk.forEach(function (p) { aktif[String(p.npp)] = true; });
  var kurva = function (b) {
    var hari = {};
    bacaTabAman('RIWAYAT_BAYAR').forEach(function (r) {
      var npp = String(r.npp), bp = keBlth_(r.blth_posting), tg = keTanggal_(r.tgl_terima);
      if (!aktif[npp] || bp !== b || !tg || tg.slice(0, 7) !== b) return;
      var dd = +tg.slice(8, 10);
      if (!hari[npp] || dd < hari[npp]) hari[npp] = dd;
    });
    var per = new Array(32).fill(0);
    Object.keys(hari).forEach(function (k) { per[hari[k]]++; });
    var kum = [], t = 0;
    for (var i = 1; i <= 31; i++) { t += per[i]; kum.push(t); }
    return { kum: kum, total: t, npp: Object.keys(hari) };
  };
  var kIni = kurva(bulan), kLalu = kurva(lalu);
  // tren 6 bulan dari snapshot ITW/ITB terakhir tiap bulan
  var snap = {};
  bacaTabAman('ITW_ITB').forEach(function (r) {
    var per = keTanggal_(r.periode); if (!per) return;
    var b = per.slice(0, 7);
    if (!snap[b] || per > snap[b].per) snap[b] = { per: per, n: 0, itb: 0, itw: 0 };
    if (snap[b].per === per) { snap[b].n++; if (String(r.itb).toUpperCase() === 'Y') snap[b].itb++; if (String(r.itw).toUpperCase() === 'Y') snap[b].itw++; }
  });
  var tren = Object.keys(snap).sort().slice(-6).map(function (b) { var x = snap[b]; return { bulan: b, itb: x.n ? x.itb / x.n : 0, itw: x.n ? x.itw / x.n : 0, n: x.n, per: x.per }; });
  // segmen & kecamatan
  var grup = function (kunciFn) {
    var g = {};
    pk.forEach(function (p) {
      var k = kunciFn(p) || '—';
      var x = g[k] = g[k] || { nama: k, pk: [], per: {}, tunggakan: 0, tk: 0 };
      x.pk.push(p); x.per[p.status] = (x.per[p.status] || 0) + 1; x.tunggakan += +p.tunggakan || 0; x.tk += +p.tk || 0;
    });
    return Object.keys(g).map(function (k) { return g[k]; }).sort(function (a, b) { return b.pk.length - a.pk.length; });
  };
  // efektivitas pesan: catatan WA 60 hari terakhir per ringkasan (pesan massal = nama templat)
  var batas = tambahHari(d.hariIni, -60), efek = {};
  bacaTabAman('LOG_INTERAKSI').forEach(function (o) {
    var tg = keTanggal_(o.tanggal), hp = String(o.hasil_posting || '');
    if (!tg || tg < batas || String(o.jenis) !== 'WA' || !hp || hp === 'Menunggu') return;
    var r = String(o.ringkasan || ''), k = r.replace(/^Pesan massal:\s*/, '').replace(/\s*\(.*$/, '').replace(/\[Monitor SPPG\]\s*/, 'Monitor SPPG · ').split(' · ').slice(0, 2).join(' · ').slice(0, 60) || 'Lainnya';
    var x = efek[k] = efek[k] || { nama: k, n: 0, ok: 0 };
    x.n++; if (/^Terposting/.test(hp)) x.ok++;
  });
  var efektivitas = Object.keys(efek).map(function (k) { return efek[k]; }).filter(function (x) { return x.n >= 3; }).sort(function (a, b) { return b.n - a.n; }).slice(0, 6);
  var kpiBln = bacaTabAman('KPI_BULANAN').filter(function (o) { return o.bulan; }).sort(function (a, b) { return String(a.bulan) < String(b.bulan) ? -1 : 1; });
  var kb = kpiBln[kpiBln.length - 1] || null;
  return {
    n: n, bulan: bulan, lalu: lalu, s: s, h: h, per: per, menunggak: menunggak,
    itb: per['Sudah ITB'], itw: pk.filter(function (p) { return String(p.itw).toUpperCase() === 'Y' || p.status === 'Sudah ITB' || p.status === 'Belum bulan ini'; }),
    tunggakan: jumlah(pk, 'tunggakan'), tkMenunggak: jumlah(menunggak, 'tk'), tk: jumlah(pk, 'tk'),
    kelas: kelas, naik: naik, kIni: kIni, kLalu: kLalu, tren: tren,
    segmen: grup(function (p) { return p.segmen; }), kecamatan: grup(function (p) { return p.kecamatan; }).filter(function (x) { return x.nama !== '—'; }),
    tanpaKec: pk.filter(function (p) { return !p.kecamatan; }).length,
    perhatian: pk.filter(function (p) { return +p.tunggakan > 0; }).sort(function (a, b) { return b.tunggakan - a.tunggakan; }),
    efektivitas: efektivitas, kpi: kb, pk: pk
  };
}

async function prosesBerkas(files) {
  if (!files || !files.length) return;
  if (hakLihat()) { kabar('Gagal: akses perangkat ini hanya untuk melihat.'); return; }
  kabar('Membaca ' + files.length + ' file… mesin LENSA menghitung ulang');
  await new Promise(function (ok) { setTimeout(ok, 30); });
  try {
    var hasil = await imporBerkas(files);
    await simpanSekarang();
    segarkanAplikasi();
    if (hasil.some(function (h) { return !h.ok; })) window.__lensaApp.layar('data');
    kabar(hasil.filter(function (h) { return h.ok && !h.info; }).length + ' dari ' + hasil.filter(function (h) { return !h.info; }).length + ' file berhasil diimpor.');

}

function pasangPeristiwa2() {
  pasangPeristiwaAkses();
  AKAR.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-a]');
    if (!el || el.tagName === 'A') return;
    var f = AKSI2[el.getAttribute('data-a')];
    if (f) { ev.preventDefault(); ev.stopPropagation(); f(el.getAttribute('data-v'), el); }
  });
  AKAR.addEventListener('keydown', function (ev) {
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('[role="button"][data-a]')) { ev.preventDefault(); ev.target.click(); }
  });
  $('#pilihBerkas').addEventListener('change', function (ev) { var f = Array.prototype.slice.call(ev.target.files); ev.target.value = ''; prosesBerkas(f); });
  $('#pilihCadangan').addEventListener('change', async function (ev) {
    var f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
    try {
      await pulihkanCadangan(f, function () { return layarPin({ pesan: 'Cadangan ini terkunci. Masukkan PIN saat cadangan dibuat.', batal: true }); });
      siapkanMesin(); segarkanAplikasi(); kabar('Cadangan dipulihkan.');
    } catch (e) { kabar('Gagal: ' + e.message); }
  });
}
/** Seret file laporan ke jendela mana pun (komputer). */
function pasangSeret() {
  ['dragover', 'drop'].forEach(function (t) {
    document.addEventListener(t, function (ev) {
      if (!ev.dataTransfer || Array.prototype.indexOf.call(ev.dataTransfer.types || [], 'Files') < 0) return;
      ev.preventDefault();
      if (t === 'drop' && ev.dataTransfer.files.length) prosesBerkas(Array.prototype.slice.call(ev.dataTransfer.files));
    });
  });
}

/** Isian formulir undangan disimpan di AKS.form (tetap ada saat layar digambar ulang); Untuk / Aplikasi / Peran mengubah isian. */
function pasangPeristiwaAkses() {
  AKAR.addEventListener('change', function (ev) {
    var t = ev.target;
    if (!t.closest) return;
    var cv = t.getAttribute('data-cv');
    if (cv) { // pemilih CV Mitra
      if (t.checked) AKS.lingkup[cv] = true; else delete AKS.lingkup[cv];
      var j = AKAR.querySelector('[data-jumlah-cv]'); if (j) j.textContent = teksJumlahCv();
      return;
    }
    if (!t.closest('#formUndang')) return;
    var k = t.getAttribute('data-f');
    if (!k) return;
    AKS.form[k] = t.value;
    if (k === 'untuk') { AKS.untuk = t.value; if (t.value === 'saya') delete AKS.form.pengguna; renderLayar2(); }
    if (k === 'app') { AKS.app = t.value; if (peranTersedia(t.value).indexOf(AKS.form.peran) < 0) AKS.form.peran = 'Pelaksana'; renderLayar2(); }
    if (k === 'peran') renderLayar2();
  });
  AKAR.addEventListener('input', function (ev) {
    var t = ev.target, k = t.getAttribute && t.getAttribute('data-f');
    if (k === 'cariCv') { AKS.form.cariCv = t.value; var d = AKAR.querySelector('#daftarCv'); if (d) d.innerHTML = daftarCvHtml(); return; }
    if (k === 'pengguna' && t.closest && t.closest('#formUndang')) AKS.form.pengguna = t.value;
  });
}

/* ---------- Perkiraan tunggakan: PK penyumbang terbesar → terkecil (grafik Pareto + daftar) ---------- */
function panelTunggakan() {
  var pks = S.data.pk.filter(function (x) { return +x.tunggakan > 0; }).sort(function (a, b) { return b.tunggakan - a.tunggakan; });
  var tot = pks.reduce(function (s, x) { return s + (+x.tunggakan || 0); }, 0);
  if (!pks.length) return { judul: 'Perkiraan tunggakan', isi: '<div class="kartu kosong">Tidak ada perkiraan tunggakan.</div>' };
  var kum = 0, n80 = 0;
  pks.forEach(function (x) { kum += +x.tunggakan; if (!n80 && kum >= tot * 0.8) n80 = pks.indexOf(x) + 1; });
  var top = pks.slice(0, 20), maks = +top[0].tunggakan, W = 640, H = 230, kiri = 46, bawah = 26, lb = (W - kiri - 10) / top.length;
  var Y = function (v) { return 10 + (H - bawah - 10) * (1 - v / maks); }, Yp = function (pc) { return 10 + (H - bawah - 10) * (1 - pc); };
  var svg = '<svg class="pareto" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="20 PK dengan perkiraan tunggakan terbesar">';
  [0, 0.5, 1].forEach(function (f) { svg += '<line x1="' + kiri + '" x2="' + (W - 10) + '" y1="' + Y(maks * f) + '" y2="' + Y(maks * f) + '" class="gr"/><text x="' + (kiri - 6) + '" y="' + (Y(maks * f) + 4) + '" text-anchor="end">' + rp(maks * f).replace('Rp ', '') + '</text>'; });
  kum = 0;
  var titik = [];
  top.forEach(function (x, i) {
    var xx = kiri + i * lb + 3, hh = H - bawah - Y(+x.tunggakan), k = st(x).k;
    kum += +x.tunggakan; titik.push((xx + (lb - 6) / 2).toFixed(1) + ',' + Yp(kum / tot).toFixed(1));
    svg += '<g data-a="pk" data-v="' + e(x.npp) + '" style="cursor:pointer"><title>' + e(x.nama) + ' · ' + rp(x.tunggakan) + '</title><rect x="' + xx.toFixed(1) + '" y="' + Y(+x.tunggakan).toFixed(1) + '" width="' + Math.max(2, lb - 6).toFixed(1) +
      '" height="' + Math.max(1, hh).toFixed(1) + '" rx="2" class="b-' + k + '"/><text x="' + (xx + (lb - 6) / 2).toFixed(1) + '" y="' + (H - 9) + '" text-anchor="middle">' + (i + 1) + '</text></g>';
  });
  svg += '<polyline points="' + titik.join(' ') + '" class="kum"/><text x="' + (W - 12) + '" y="' + (Yp(kum / tot) - 6).toFixed(1) + '" text-anchor="end" class="kum-l">' + Math.round(kum / tot * 100) + '% total</text></svg>';
  var perSt = {};
  pks.forEach(function (x) { var k = st(x); (perSt[k.k] = perSt[k.k] || { l: x.status, n: 0, v: 0 }); perSt[k.k].n++; perSt[k.k].v += +x.tunggakan; });
  var bar = '<div class="bar-status" style="margin-top:6px">' + Object.keys(perSt).map(function (k) { return '<i class="b-' + k + '" style="flex:' + perSt[k].v + '"></i>'; }).join('') + '</div>' +
    '<div class="kecil" style="margin-top:6px">' + Object.keys(perSt).map(function (k) { return e(perSt[k].l) + ': ' + perSt[k].n + ' PK · ' + rp(perSt[k].v) + ' (' + Math.round(perSt[k].v / tot * 100) + '%)'; }).join(' · ') + '</div>';
  kum = 0;
  var daftar = '<div class="daftar">' + pks.map(function (x, i) {
    kum += +x.tunggakan;
    var pc = x.tunggakan / tot * 100;
    return '<div class="item" data-a="pk" data-v="' + e(x.npp) + '"><span class="peringkat">' + (i + 1) + '</span><div class="tengah"><div class="t1">' + e(x.nama) + '</div>' +
      '<span class="qt-bar" style="margin:5px 0 3px"><i style="width:' + Math.max(1, x.tunggakan / maks * 100).toFixed(1) + '%"></i></span>' +
      '<div class="t2">' + e(x.status) + ' · koef ' + e(x.koef) + ' · ' + pc.toFixed(1).replace('.', ',') + '% · kumulatif ' + Math.round(kum / tot * 100) + '%</div></div>' +
      '<div class="kanan"><b>' + rp(x.tunggakan) + '</b></div></div>';
  }).join('') + '</div>';
  return { judul: 'Perkiraan tunggakan', sub: pks.length + ' PK · ' + rp(tot), isi:
    '<div class="kartu"><div class="kecil">Dari terbesar ke terkecil · (koefisien − 1) × iuran terakhir; bukan angka resmi</div><div class="total-besar">' + rp(tot) + '</div>' +
    '<div class="kecil"><b>' + n80 + ' PK</b> (' + Math.round(n80 / pks.length * 100) + '% PK) menyumbang 80% perkiraan tunggakan.</div>' + bar + '</div>' +
    '<div class="kartu"><div class="sec"><h3>20 penyumbang terbesar</h3></div>' + svg + '<div class="kecil">Batang = tunggakan per PK (warna = status), garis = persentase kumulatif. Klik batang untuk membuka PK.</div></div>' +
    '<div class="judul-bagian"><h2>Semua PK</h2><span class="ket">terbesar → terkecil</span></div>' + daftar,
    bawah: '<button class="btn" data-a="rinciantunggakan">Rincian gabungan 20 terbesar</button><button class="btn wa" data-a="blasttunggakan">' + IKON.kirim + ' Kirim berurutan</button>' };
}

/* Peringatan data ITW/ITB lama. Ambang mengikuti jadwal impor: 7 hari di awal bulan; sejak tanggal 20, satu hari kerja
   (Senin boleh data Jumat). Dihitung dari tanggal HP, karena aplikasi bisa dibuka berhari-hari setelah data dimuat. */
function itwLama(h) {
  if (!h || !h.periodeItw) return '';
  var hari = hariLokal(), a = tglObj(h.periodeItw), b = tglObj(hari);
  if (!a || !b) return '';
  var umur = Math.round((b - a) / 864e5), tgl = b.getDate(), dow = b.getDay();
  var batas = tgl >= 20 ? (dow === 1 ? 3 : dow === 0 ? 2 : 1) : 7;
  if (h.itwKedaluwarsa) return 'Data ITW/ITB masih dari bulan lalu; status bulan ini baru perkiraan. Impor laporan ITW/ITB terbaru.';
  if (umur <= batas) return '';
  return 'Data ITW/ITB berumur ' + umur + ' hari. ' + (tgl >= 20 ? 'Di 10 hari terakhir bulan, impor ITW/ITB setiap hari kerja agar daftar tidak menagih PK yang sudah bayar.'
    : 'Impor laporan terbaru agar daftar akurat.');
}
/* "Sudah terkirim?" muncul di kartu/baris yang tombol WA-nya baru diketuk, saat Anda kembali dari WhatsApp. */
function tanyaHtml(j, v, nama) {
  var q = S.tanyaWa;
  if (!q || !q.tampil || q.j !== j || q.v !== String(v)) return '';
  return '<div class="tanya-wa"><span>Sudah terkirim ke <b>' + e(nama || '') + '</b>?</span><button class="btn utama" data-a="waya">Ya, tandai</button><button class="btn" data-a="watidak">Belum</button></div>';
}
function sudahTercatatWa(q) {
  if (q.j === 'b') { var pb = panelBlastAktif(); return !pb || !!kemajuan(pb)[q.v]; }
  if (q.j === 'h') { var k = kartuHariIni()[q.v]; return !k || k.tercatat; }
  return statusDihubungi(q.v).hariIni;
}
function cekTanyaWa() {
  var q = S.tanyaWa;
  if (!q || q.tampil || document.visibilityState !== 'visible') return;
  if (Date.now() - q.t > 30 * 60000 || sudahTercatatWa(q)) { S.tanyaWa = null; return; }
  if (Date.now() - q.t < 1500) { setTimeout(cekTanyaWa, 1600); return; }
  q.tampil = true; render();
}
document.addEventListener('click', function (ev) {
  var a = ev.target.closest ? ev.target.closest('a[data-wa]') : null;
  if (!a) return;
  var p = a.getAttribute('data-wa').split(':');
  S.tanyaWa = { j: p[0], v: p.slice(1).join(':'), t: Date.now(), tampil: false };
  setTimeout(cekTanyaWa, 4000);
}, true);

  lepasorang: function (v, btn) {

      btn.classList.add('yakin'); btn.textContent = 'Lepas?';
      setTimeout(function () { if (document.body.contains(btn) && !btn.disabled) { btn.classList.remove('yakin'); btn.textContent = '✕'; } }, 4000);
      return;
    }
    btn.disabled = true; btn.textContent = '…';
    panggil('apiPkKontak', p.v, [], [v], false).then(function (h) {
      terapkanKontakPk(h.kontak); p.berubah = true; renderPanel(); toast((PK[v] ? PK[v].nama : 'PK') + ' dilepas');
    }).catch(function (er) { btn.disabled = false; btn.classList.remove('yakin'); btn.textContent = '✕'; toast(er.message, true); });
  },
  tambahkontak: function () { buka({ j: 'kontak', v: S.panel[S.panel.length - 1].v, id: '' }); },
  ubahkontak: function (v) { buka({ j: 'kontak', v: S.panel[S.panel.length - 1].v, id: v }); },
  pakaikontak: function (v) {
    var p = S.panel[S.panel.length - 1], c = semuaKontak()[v];
    if (!c) return;
    p.pakaiId = c.id;
    [['knama', c.nama], ['kwa', c.hp], ['kjab', c.jabatan], ['ksap', c.sapaan]].forEach(function (f) { var el = document.getElementById(f[0]); if (el) el.value = f[1] || ''; });
    var u = document.getElementById('kusul'); if (u) u.innerHTML = '<span class="kecil">Dipilih: <b>' + e(c.nama) + '</b> (' + e(c.pk.join(', ')) + '). Ketuk Simpan.</span>';
  },
  simpankontak: function (v, btn) {
    var p = S.panel[S.panel.length - 1], k = { id: p.id || p.pakaiId || '', nama: nilai('knama'), wa: nilai('kwa'), jabatan: nilai('kjab'), sapaan: nilai('ksap'), utama: nilai('kutama') };
    if (!k.nama) return toast('Nama kontak belum diisi', true);
    sibuk(btn, true);
    panggil('apiSimpanKontak', p.v, k).then(function (h) { perbaruiPk(p.v, { kontak: h.kontak }); tutup(); toast('Kontak disimpan'); }).catch(function (er) { sibuk(btn, false); toast(er.message, true); });
  },
  lepaskontak: function (v, btn) {
    var p = S.panel[S.panel.length - 1];
    if (!yakin(btn, 'Ketuk lagi untuk melepas')) return;
    sibuk(btn, true);
    panggil('apiLepasKontak', p.v, p.id).then(function () {
      var x = PK[p.v]; perbaruiPk(p.v, { kontak: x.kontak.filter(function (c) { return c.id !== p.id; }) }); tutup(); toast('Kontak dilepas');
    }).catch(function (er) { sibuk(btn, false); toast(er.message, true); });
  },
  catat: function () { buka({ j: 'catat', v: S.panel[S.panel.length - 1].v, jenis: 'Kunjungan' }); },
  jenislog: function (v) {
    var p = S.panel[S.panel.length - 1];
    p.jenis = v; p.ringkas = nilai('lringkas'); p.kontakId = nilai('lkontak'); p.janji = nilai('ljanji'); p.tgl = nilai('ltgl');
    renderPanel();
  },
  simpancatat: function (v, btn) {
    var p = S.panel[S.panel.length - 1], x = PK[p.v];
    var o = { npp: p.v, jenis: p.jenis || 'Kunjungan', idPengurus: nilai('lkontak'), ringkasan: nilai('lringkas'), komitmen: nilai('ljanji'), tglTindakLanjut: nilai('ltgl'),
      tanggal: hariLokal(), cid: idUnik() };
    if (!o.ringkasan) return toast('Isi ringkasan dulu', true);
    var pakai = nilai('llokasi'), geo = nilai('lgeotag');
    sibuk(btn, true);
    var lok = pakai || geo ? ambilLokasi().catch(function () { toast('Lokasi tidak terambil; catatan tetap disimpan', true); return null; }) : Promise.resolve(null);
    lok.then(function (l) {
      if (l) { o.lat = l.lat; o.lng = l.lng; }
      var label = o.jenis + ' · ' + (x ? x.nama : p.v), offline = false;
      return kirim('apiCatat', [o], label).then(function (hc) {
        if (hc.antre) { offline = true; terapkanLokal({ fn: 'apiCatat', args: [o] }); simpanCache(); }
        else if (hc.dihubungi) { S.data.dihubungi = hc.dihubungi; terapkanLokalSemua(); simpanCache(); }
        if (!(l && geo)) return offline;
        var ag = [p.v, l.lat, l.lng, l.akurasi, ''];
        return kirim('apiGeotag', ag, 'Titik lokasi ' + (x ? x.nama : p.v)).then(function (h) {
          if (h.antre) { offline = true; terapkanLokal({ fn: 'apiGeotag', args: ag }); indeks(); simpanCache(); }
          else perbaruiPk(p.v, { lat: h.lat, lng: h.lng, sumberGeotag: h.sumber, geotag: h.tanggal });
          return offline;
        });
      });
    }).then(function (offline) {
      delete S.riwayat[p.v]; tutup();
      toast(offline ? 'Tanpa sinyal — catatan tersimpan di HP, dikirim saat ada sinyal' : 'Interaksi tercatat');
    }).catch(function (er) { sibuk(btn, false); toast(er.message, true); });
  },
  jadwalbaru: function () { buka({ j: 'jadwalform' }); },

  kalhari: function (v) { S.kalPilih = v; render(); },
  kalgeser: function (v) {

    var d = new Date(+b.slice(0, 4), +b.slice(5, 7) - 1 + (+v), 1);

  },
  jadwalpk: function () { var p = S.panel[S.panel.length - 1]; buka({ j: 'jadwalform', npp: p.v }); },
  jenisjadwal: function (v) {

  simpanjadwal: function (v, btn) {

    var o = { jenis: p.jenis || 'Kunjungan', judul: nilai('jjudul'), tanggal: nilai('jtgl'), jam: nilai('jjam'), lokasi: nilai('jlokasi'), npp: p.npp || '',

    if (!o.judul || !o.tanggal) return toast('Judul dan tanggal wajib diisi', true);
    sibuk(btn, true);
    panggil('apiSimpanJadwal', o).then(function (h) {
      o.id = h.id; o.status = 'Rencana'; S.data.jadwal.push(o); simpanCache(); tutup(); toast('Agenda tersimpan ' + hariLabel(o.tanggal));
    }).catch(function (er) { sibuk(btn, false); toast(er.message, true); });
  },
  jadwalselesai: function (v, btn) {
    var p = S.panel[S.panel.length - 1], j = S.data.jadwal.filter(function (x) { return x.id === p.v; })[0];
    var o = { id: j.id, status: 'Selesai', hasil: nilai('hasil') }, pakai = nilai('pakaiLokasi');
    sibuk(btn, true);

      if (l) { o.lat = l.lat; o.lng = l.lng; }
      return panggil('apiSimpanJadwal', o);
    }).then(function () { j.status = 'Selesai'; j.hasil = o.hasil; simpanCache(); tutup(); toast('Agenda selesai dan tercatat'); }).catch(function (er) { sibuk(btn, false); toast(er.message, true); });
  },
  jadwalpindah: function (v, btn) {
    var p = S.panel[S.panel.length - 1], j = S.data.jadwal.filter(function (x) { return x.id === p.v; })[0], t = nilai('tglbaru');
    if (!t || t === j.tanggal) return toast('Pilih tanggal baru dulu', true);
    sibuk(btn, true);
    panggil('apiSimpanJadwal', { id: j.id, tanggal: t }).then(function () { j.tanggal = t; simpanCache(); tutup(); toast('Dipindah ke ' + hariLabel(t)); }).catch(function (er) { sibuk(btn, false); toast(er.message, true); });
  },
  jadwalbatal: function (v, btn) {
    var p = S.panel[S.panel.length - 1], j = S.data.jadwal.filter(function (x) { return x.id === p.v; })[0];
    if (!yakin(btn, 'Ketuk lagi')) return;

    panggil('apiSimpanJadwal', { id: j.id, status: 'Batal' }).then(function () { j.status = 'Batal'; S.data.jadwal = S.data.jadwal.filter(function (x) { return x !== j; }); simpanCache(); tutup(); toast('Agenda dibatalkan'); })
      .catch(function (er) { sibuk(btn, false); toast(er.message, true); });
  }
};

}

/* ---------- pas layar iPhone ----------
   Aplikasi berjalan di dalam bingkai (iframe) Apps Script. Di iPhone bingkai itu bisa lebih lebar dari layar, dan setelah
   keyboard muncul halaman LUAR (milik Google) bisa tertinggal tergeser ke kiri. Safari tidak mengizinkan bingkai menggulir
   halaman luar yang beda domain, jadi pergeseran itu tidak bisa dikembalikan dari dalam. Solusinya: ukur bagian bingkai
   yang benar-benar tampak di layar (IntersectionObserver melaporkan potongan oleh halaman luar), lalu paskan isi ke
   bagian itu lewat --kiri dan --kanan. Cadangan bila pengukuran tidak tersedia: selisih lebar bingkai dengan layar. */

    var lebih = iw - nyata;

    var layar = (sentuh && lebih > 1 && lebih < 160) ? lebih : 0;
    var kiri = TAMPAK.kiri, kanan = Math.max(TAMPAK.kanan, layar - kiri, 0);
    if (kiri + kanan > iw - 240) { kiri = 0; kanan = layar; } // tidak masuk akal: abaikan hasil ukur

document.addEventListener('click', function (ev) { if (ev.target.closest && ev.target.closest('nav.bawah, .atas')) setTimeout(kembaliKiri, 40); });

['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) { document.addEventListener(n, function (ev) { ev.preventDefault(); }, { passive: false }); });

/* Geser ke samping hanya untuk baris yang memang bisa digeser (tab, chip, tabel); di luar itu halaman tetap diam.
   Tarikan ke bawah di ujung atas / ke atas di ujung bawah dicegah agar tidak ada efek mantul (iPhone lama tanpa
   dukungan overscroll-behavior). Menggulir daftar hasil cari juga menutup keyboard. */
var GESER = null;
function bisaGeserMendatar(el) {
  for (; el && el !== document.body && el !== document.documentElement; el = el.parentElement) {
    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return true;

  }
  return false;
}
/* Wadah gulir tegak terdekat (panel, kolom teks panjang); null = halaman. */
function penggulirTegak(el) {
  for (; el && el !== document.body && el !== document.documentElement; el = el.parentElement) {
    if (el.classList && el.classList.contains('panel')) return el;
    var oy = getComputedStyle(el).overflowY;

  }
  return null;
}
function diUjung(sc, turun) {
  var de = document.documentElement;
  if (sc) {
    if (sc.scrollHeight <= sc.clientHeight + 1) return true;
    return turun ? sc.scrollTop <= 0 : sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 1;
  }
  if (S.panel.length) return true; // halaman di belakang kartu tidak ikut tergulir
  if (de.scrollHeight <= window.innerHeight + 1) return false; // halaman pendek: biarkan (aman bila bingkai dipipihkan)
  return turun ? window.scrollY <= 0 : window.scrollY + window.innerHeight >= de.scrollHeight - 1;
}
document.addEventListener('touchstart', function (ev) {

    GESER.arah = Math.abs(dx) > Math.abs(dy) ? (bisaGeserMendatar(GESER.el) ? 'x-ok' : 'x') : 'y';
    if (GESER.arah === 'y') {
