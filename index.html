/* ========================= MODUL ANALISA =========================
 * Terpisah dari modul inti. Menulis RAPOR, KPI_MIGRASI, KPI_BULANAN (kolom hitungan), dan ANALISA.
 * Bisa dimatikan lewat menu Analisa › Matikan modul Analisa; HARI_INI, STATUS_PK, GRUP tetap jalan.
 *
 * KPI Daerah 2026:
 *  - 2026.DRV.2.08.0 % Migrasi Penerimaan Iuran & Piutang, dihitung seperti KPI084/KPI085:
 *    basis = PK berpiutang di akhir bulan lalu (iuran bulan itu belum terposting), tanpa PK skala MI;
 *    kelas = umur piutang (koefisien − 1): 0 ITW, 1–3 lancar, 4–6 kurang lancar, 7–12 diragukan, > 12 macet;
 *    capaian bulanan = target ÷ (PK bermigrasi ÷ basis kelas), maks. 120%; rata-rata capaian sejak Juni;
 *    skor = Σ rata-rata × 0,5. Target: ITW→menunggak 5%, lancar→KL 10%, KL→diragukan 15%, diragukan→macet 5%.
 *  - 2026.DRV.2.8.1 Churn rate < 25%: (TK keluar − natural attrition) / (TK aktif 31 Des tahun lalu
 *    + akuisisi TK tahun ini). Bawaan menilai semua PK; tanpa PK non-ASN tetap ditampilkan.
 *  - 2026.DRV.2.8.2 Length of stay TK PU baru ≥ 7 bulan: Σ(masa iur × TK) / Σ TK.
 */

function hitungAnalisa_(D, R) {
  var rapor = hitungRapor_(D, R);
  tulisRapor_(rapor);
  var kpi = hitungKpi_(D, R);
  tulisAnalisa_(D, R, rapor, kpi);
  var risiko = susunRisiko_(D, R, kpi.mig);
  tulisRisiko_(D, R, risiko, kpi.mig);
  return { pesan: 'rapor ' + rapor.length + ' PK, KPI ' + kpi.bulan.length + ' bulan, ' + risiko.length + ' PK berisiko migrasi.' };
}

/* ------------------------ risiko migrasi bulan ini ------------------------ */

/**
 * PK binaan yang kelas piutangnya sudah naik dibanding akhir bulan lalu. Bila membayar minimal satu bulan iuran
 * sebelum akhir bulan, koefisien kembali dan PK tidak dihitung bermigrasi. Urut menurut dampak ke capaian.
 */
function susunRisiko_(D, R, mig) {
  var s = mig && mig.sementara;
  if (!s || !mig.risikoDaftar || !mig.risikoDaftar.length) return [];
  var perNpp = {};
  R.forEach(function (r) { perNpp[r.npp] = r; });
  var naik = {};
  KOMPONEN_MIGRASI.forEach(function (c) {
    var t = Pn_(c.target), b = angka_(s['pk_' + c.dari]), m = angka_(s['mig_' + c.dari]);
    var a1 = capaianMigrasi_(t, m, b), a0 = capaianMigrasi_(t, Math.max(0, m - 1), b);
    naik[c.dari] = a0 === null || a1 === null ? 0 : Math.round((a0 - a1) * 10000) / 10000;
  });
  return mig.risikoDaftar.map(function (x) {
    var r = perNpp[x.npp];
    if (!r || r.itb === 'Y') return null;
    return { npp: x.npp, nama: r.nama, dari: x.dari, ke: x.ke, iuran: r.iuran_terakhir, koef: r.koef, naik: naik[x.dari] || 0, r: r };
  }).filter(Boolean).sort(function (a, b) { return (b.naik - a.naik) || (a.iuran - b.iuran) || (a.nama < b.nama ? -1 : 1); });
}

function teksRisiko_(x, akhir) {
  return NAMA_KELAS[x.dari] + ' → ' + NAMA_KELAS[x.ke] + ' · bayar ≥ 1 bln' + (x.iuran ? ' (' + rupiahRingkas_(x.iuran) + ')' : '') + ' sebelum ' + tglPendek_(akhir);
}

function tulisRisiko_(D, R, daftar, mig) {
  var akhir = tanggalBulan_(D.bulanIni, hariDalamBulan_(D.bulanIni));
  // STATUS_PK: kolom risiko_migrasi (urutan baris sama dengan R)
  var peta = {};
  daftar.forEach(function (x) { peta[x.npp] = teksRisiko_(x, akhir); });
  var sh = lembar_('STATUS_PK'), kep = kepalaTab_(sh), c = kep.indexOf('risiko_migrasi');
  if (c >= 0 && R.length) {
    sh.getRange(2, c + 1, R.length, 1).setValues(R.map(function (r) { return [peta[r.npp] || '']; }));
    sh.getRange(2, c + 1, R.length, 1).setBackgrounds(R.map(function (r) { return [peta[r.npp] ? WARNA.latarKuning : null]; }));
  }
  // HARI_INI: bagian "Cegah migrasi piutang" di bawah
  var d = +D.hariIni.slice(8, 10), tahap = tahap_(d), batasTgl = tanggalBulan_(D.bulanIni, Pn_('batas_aman_posting'));
  var data = daftar.map(function (x) {
    var ku = x.r._ku, pesan = '';
    if (ku) pesan = susunPesan_(ku.p, [{ r: x.r, alasan: x.r.koef >= 2 ? 'telat' : 'belum' }], tahap, D, batasTgl);
    return { npp: x.npp, nama: x.nama, dari: x.dari, ke: x.ke, iuran: x.iuran, naik: x.naik, koef: x.koef,
      kontakId: ku ? String(ku.p.id_pengurus) : '', kontakNama: ku ? ku.p.nama : '', wa: ku ? ku.wa || '' : '', hp: ku ? hpTampil_(ku.p.no_wa || ku.p.no_hp_2) : '', pesan: pesan };
  });
  var hi = lembar_('HARI_INI'), awal = hi.getLastRow() + 2;
  if (data.length) {
    var rows = [['', 'Cegah migrasi piutang · ' + data.length + ' PK binaan', '', '', '', '', '', '', '', '', ''],
      ['', 'Kelas piutang PK ini sudah naik dibanding akhir bulan lalu. Bila membayar minimal 1 bulan iuran sebelum ' + tglSedang_(akhir) +
        ', tidak dihitung bermigrasi. Urut menurut dampak ke capaian KPI.', '', '', '', '', '', '', '', '', ''],
      ['', 'PK', 'Kelas', 'Bayar minimal', 'Kirim', 'No. HP', 'Kontak', 'npp', '', '', '']];
    data.forEach(function (x) {
      rows.push(['', x.nama, NAMA_KELAS[x.dari] + ' → ' + NAMA_KELAS[x.ke], '1 bln' + (x.iuran ? ' · ' + rupiahRingkas_(x.iuran) : ''), x.wa ? 'Kirim WA' : '',
        x.hp, x.kontakNama, x.npp, '', '', '']);
    });
    pastikanBaris_(hi, awal + rows.length + 2);
    hi.getRange(awal, 1, rows.length, HI_LEBAR).setValues(rows).setVerticalAlignment('top').setWrap(true).setFontColor(WARNA.teks);
    hi.getRange(awal, 2, 1, HI_LEBAR - 1).setFontWeight('bold').setBackground(WARNA.latarKuning);
    hi.getRange(awal + 1, 2, 1, HI_LEBAR - 1).setFontColor(WARNA.teksPudar).setFontSize(9);
    hi.getRange(awal + 2, 1, 1, HI_LEBAR).setFontWeight('bold').setBackground(WARNA.latarAbu);
    hi.getRange(awal + 3, 5, data.length, 1).setRichTextValues(data.map(function (x) {
      var b = SpreadsheetApp.newRichTextValue().setText(x.wa ? 'Kirim WA' : '');
      if (x.wa) b = b.setLinkUrl(urlWa_(x.wa, x.pesan));
      return [b.build()];
    }));
  }
  var s = mig.sementara || {};
  simpanAppData_('risiko', {
    dibuat: sekarangStr_(), bulan: D.bulanIni, akhir: akhir, daftar: data,
    komponen: KOMPONEN_MIGRASI.map(function (c) {
      return { dari: c.dari, judul: c.judul, target: Pn_(c.target), basis: angka_(s['pk_' + c.dari]), mig: angka_(s['mig_' + c.dari]),
        capaian: s['capaian_' + c.dari] === '' || s['capaian_' + c.dari] === undefined ? null : s['capaian_' + c.dari] };
    }),
    skorSementara: s.skor === '' || s.skor === undefined ? null : s.skor,
    skorBinaan: mig.binaan ? mig.binaan.skor : null, skorKantor: mig.kantor ? mig.kantor.skor : null
  });
}

/* ------------------------------ RAPOR ------------------------------ */

function nilaiUpah_(u, th, skala) {
  if (!u || !skala || skala === 'MI') return { f: null, flag: '', tertinggal: null };
  var umk = umkTahun_(th);
  if (!umk) return { f: null, flag: '', tertinggal: null };
  var tertinggal = null, terendah = umk.tahun;
  for (var y = umk.tahun; y >= umk.tahun - 8; y--) {
    var v = keAngka_(P_('umk_' + y), true);
    if (!v) break;
    terendah = y;
    if (u >= v * 0.995) { tertinggal = umk.tahun - y; break; }
  }
  var flag = '';
  if (tertinggal === null) { tertinggal = umk.tahun - terendah + 1; flag = '< UMK ' + terendah; }
  else if (tertinggal > 0) flag = '< UMK ' + umk.tahun + ' (setara ' + (umk.tahun - tertinggal) + ')';
  var kecil = skala === 'Mi' || skala === 'K';
  var f = kecil ? null : (tertinggal === 0 ? 1 : tertinggal === 1 ? 8 / 15 : 0);
  if (flag && kecil) flag += ' · info Mi/K';
  return { f: f, flag: flag, tertinggal: tertinggal, tahun: umk.tahun };
}

function hitungRapor_(D, R) {
  var bobot = { kepatuhan: Pn_('bobot_kepatuhan'), ketepatan: Pn_('bobot_ketepatan'), upah: Pn_('bobot_upah'),
    program: Pn_('bobot_program'), data: Pn_('bobot_data'), stabilitas: Pn_('bobot_stabilitas') };
  var ambH = Pn_('ambang_hijau'), ambK = Pn_('ambang_kuning');
  var tahunIni = +D.hariIni.slice(0, 4);
  var batasMikro = Pn_('batas_penjualan_mikro'), batasKecil = Pn_('batas_penjualan_kecil');
  var out = R.map(function (r) {
    var m = r._m, mon = r._mon, dbu = r._dbu, rs = r._rs, koef = r.koef, skala = r.skala;
    var program = String(mon.prog || m.program || '2P').toUpperCase();
    var tk = angka_(mon.tk_aktif), totalUpah = angka_(dbu.total_upah);
    var upahTk = totalUpah && tk ? totalUpah / tk : null;
    var thUpah = dbu.blth_iuran ? +String(keBlth_(dbu.blth_iuran)).slice(0, 4) : tahunIni;
    var upah = nilaiUpah_(upahTk, thUpah, skala);
    var progN = parseInt(program, 10) || 2;
    var wajib = { Mi: 2, K: 3, Mn: 4, B: 4 }[skala] || null;
    var upahSetahun = totalUpah * 12;
    var skalaAneh = (skala === 'Mi' && upahSetahun > batasMikro) || (skala === 'K' && upahSetahun > batasKecil);
    var progKurang = !!wajib && skala !== 'MI' && progN < wajib;
    var fProg = (!wajib || skala === 'MI') ? null : (progKurang ? 0 : skalaAneh ? 0.5 : 1);
    var unikP = {};
    rs.forEach(function (x) { unikP[x.id_pengurus] = true; });
    var dataPoin = (m.sumber_geotag === 'Lapangan' ? 1 : 0) + (Object.keys(unikP).length >= 2 ? 1 : 0) +
      (rs.some(function (x) { return x.peran === 'Keuangan'; }) ? 1 : 0) + (m.email_perusahaan ? 1 : 0) +
      (rs.some(function (x) { return x.pengendali === 'Ya'; }) ? 1 : 0);
    var tambah = angka_(mon.tk_tambah), kurang = angka_(mon.tk_kurang);
    var awal = tk - tambah + kurang;
    var laju = mon.npp && awal > 0 ? kurang / awal : null;
    var fStab = laju === null ? null : laju < 0.10 ? 1 : laju < 0.30 ? 0.5 : 0;
    var fKep = koef <= 1 ? 1 : koef === 2 ? 15 / 35 : koef <= 5 ? 5 / 35 : 0;
    var komp = [
      ['kepatuhan', fKep, koef >= 2 ? 'Telat ' + (koef - 1) + ' bln (koef ' + koef + ')' : ''],
      ['ketepatan', r._nBln ? r._kBln / r._nBln : null, 'Tepat bulan ' + r._kBln + '/' + r._nBln],
      ['upah', upah.f, 'Upah ' + upah.flag],
      ['program', fProg, progKurang ? 'Program ' + progN + 'P < wajib ' + wajib + 'P' : 'Skala tidak wajar'],
      ['data', dataPoin / 5, 'Data/kontak ' + dataPoin + '/5'],
      ['stabilitas', fStab, 'TK berkurang ' + Math.round((laju || 0) * 100) + '% tahun ini']
    ];
    var tot = 0, bt = 0, rugi = [];
    komp.forEach(function (c) {
      if (c[1] === null || c[1] === undefined) return;
      var b = bobot[c[0]];
      tot += c[1] * b; bt += b;
      if (c[1] < 1) rugi.push({ teks: c[2], hilang: (1 - c[1]) * b });
    });
    var skor = bt ? Math.round(tot / bt * 100) : 0;
    var warna = koef >= 3 ? 'Merah' : skor >= ambH ? 'Hijau' : skor >= ambK ? 'Kuning' : 'Merah';
    rugi.sort(function (a, b) { return b.hilang - a.hilang; });
    var peluang = [], flags = [];
    if (upah.tertinggal && upah.f !== null) peluang.push('Upah ke UMK ' + upah.tahun);
    if (progKurang) peluang.push('Program ' + progN + 'P → ' + wajib + 'P');
    if (skalaAneh) peluang.push('Tinjau skala (upah setahun ' + rupiahRingkas_(upahSetahun) + ')');
    if (upah.flag) flags.push(upah.f === null ? 'Upah < UMK (Mi/K)' : 'Upah < UMK');
    if (skalaAneh) flags.push('Skala tidak wajar');
    if (progKurang) flags.push('Program < wajib');
    if (laju !== null && laju >= 0.3) flags.push('TK turun ≥30%');
    return {
      npp: r.npp, nama: r.nama, segmen: r.segmen, skala: skala, status_bayar: r.status_bayar, skor: skor, warna: warna,
      alasan: rugi.slice(0, 3).map(function (x) { return x.teks; }).join('; '), peluang: peluang.join('; '), flags: flags.join(', '),
      upah_per_tk: upahTk ? Math.round(upahTk) : '', flag_upah: upah.flag, program: program,
      tk_keluar_persen: laju === null ? '' : laju, data_kontak: dataPoin + '/5', periode_data: r.periode_data
    };
  });
  var urutWarna = { Merah: 0, Kuning: 1, Hijau: 2 };
  out.sort(function (a, b) { return (urutWarna[a.warna] - urutWarna[b.warna]) || (a.skor - b.skor) || (a.nama < b.nama ? -1 : 1); });
  return out;
}

function tulisRapor_(rapor) {
  tulisTab_('RAPOR', rapor);
  var sh = lembar_('RAPOR'), kepala = kepalaTab_(sh);
  var maks = sh.getMaxRows() - 1;
  if (maks > 0) sh.getRange(2, 1, maks, kepala.length).setBackground(null);
  warnaiKolom_(sh, kepala, 'warna', rapor.map(function (r) { return r.warna; }), WARNA_RAPOR);
  warnaiKolom_(sh, kepala, 'status_bayar', rapor.map(function (r) { return r.status_bayar; }), WARNA_STATUS);
}

/* ------------------------------ KPI ------------------------------ */

var KELAS_PIUTANG = ['itw', 'lancar', 'kurang_lancar', 'diragukan', 'macet'];
var NAMA_KELAS = { itw: 'ITW', lancar: 'Lancar', kurang_lancar: 'Kurang lancar', diragukan: 'Diragukan', macet: 'Macet' };
var KOMPONEN_MIGRASI = [
  { dari: 'itw', ke: 'lancar', judul: 'ITW → menunggak (lancar)', target: 'kpi_mig_target_itw' },
  { dari: 'lancar', ke: 'kurang_lancar', judul: 'Lancar → kurang lancar', target: 'kpi_mig_target_l' },
  { dari: 'kurang_lancar', ke: 'diragukan', judul: 'Kurang lancar → diragukan', target: 'kpi_mig_target_kl' },
  { dari: 'diragukan', ke: 'macet', judul: 'Diragukan → macet', target: 'kpi_mig_target_d' }
];

/** Umur piutang = koefisien − 1 bulan (cocok dengan KPI085). */
function kelasPiutang_(koef) {
  if (koef <= 1) return 'itw';
  if (koef <= 4) return 'lancar';
  if (koef <= 7) return 'kurang_lancar';
  if (koef <= 13) return 'diragukan';
  return 'macet';
}

function kelasDariTeks_(s) {
  var n = norm_(s);
  if (!n) return '';
  if (n === 'itw') return 'itw';
  if (n.indexOf('kurang') === 0) return 'kurang_lancar';
  if (n.indexOf('lancar') === 0) return 'lancar';
  if (n.indexOf('ragu') >= 0) return 'diragukan';
  if (n.indexOf('macet') >= 0) return 'macet';
  return '';
}

function capaiTurun_(targetPersen, real) {
  if (real === null || real === undefined || real === '') return null;
  var cap = Pn_('kpi_batas_pencapaian') / 100;
  if (real <= 0) return cap;
  return Math.min((targetPersen / 100) / real, cap);
}

function capaiNaik_(target, real) {
  if (real === null || real === undefined || real === '' || !target) return null;
  return Math.min(real / target, Pn_('kpi_batas_pencapaian') / 100);
}

/** Capaian bulanan satu komponen migrasi seperti KPI084: target ÷ (migrasi ÷ basis), maks. 120%. */
function capaianMigrasi_(targetPersen, mig, basis) {
  if (basis === '' || basis === null || basis === undefined) return null;
  var cap = Pn_('kpi_batas_pencapaian') / 100;
  if (!angka_(basis) || !angka_(mig)) return cap;
  return Math.min((targetPersen / 100) / (angka_(mig) / angka_(basis)), cap);
}

function bolehLensa_(sumber) {
  var s = String(sumber || '').trim();
  return !s || s.indexOf('LENSA') === 0;
}

function adaHitungan_(o) {
  return KELAS_PIUTANG.every(function (k) { return o['pk_' + k] !== '' && o['pk_' + k] !== undefined && o['pk_' + k] !== null; });
}

/** Status per PK di akhir bulan lalu, dibangun ulang dari snapshot awal bulan ini. */
function rekonstruksiBulanLalu_(D, rows, periode) {
  var mulaiBulan = periode.slice(0, 7) + '-01', P = mIdx_(periode.slice(0, 7)) - 1;
  var mon = D.monPer[periode] || D.mon;
  var perPk = {}, kira = 0;
  rows.forEach(function (w) {
    var npp = String(w.npp);
    var mo = mon[npp] || D.mon[npp] || {};
    var keps = keBlth_(mo.keps_awal || (D.per[npp] || {}).keps_awal);
    if (keps && mIdx_(keps) > P) return;
    var koef = angka_(w.koef), bln = angka_(w.bln_belum_posting), tgl = keTanggal_(mo.tgl_terima), kp, bp2;
    if (!tgl || tgl < mulaiBulan) { kp = koef - 1; bp2 = bln - 1; }
    else {
      var iur = angka_(w.iuran_terakhir), nilai = angka_(mo.nilai_posting);
      var bulanBayar = iur > 0 ? Math.max(1, Math.round(nilai / iur)) : 1;
      var bpLama = mIdx_(keBlth_(w.blth_posting)) - bulanBayar;
      bp2 = P - bpLama;
      kp = bp2 - angka_(w.ibr_bulan);
      kira++;
    }
    perPk[npp] = { kelas: kelasPiutang_(kp), bln: bp2 };
  });
  return { perPk: perPk, kira: kira };
}

function statusDariSnapshot_(rows) {
  var perPk = {};
  rows.forEach(function (w) { perPk[String(w.npp)] = { kelas: kelasPiutang_(angka_(w.koef)), bln: angka_(w.bln_belum_posting) }; });
  return perPk;
}

/** Hitung migrasi binaan dari status akhir bulan lalu (lalu) dan sekarang (ini), dengan cara KPI085. */
function migrasiDariStatus_(lalu, ini, ikut) {
  var o = {}, risiko = [];
  KELAS_PIUTANG.forEach(function (k) { o['pk_' + k] = 0; });
  KOMPONEN_MIGRASI.forEach(function (k) { o['mig_' + k.dari] = 0; });
  Object.keys(lalu).forEach(function (npp) {
    var a = lalu[npp];
    if (!ikut(npp) || a.bln < 1) return; // hanya PK berpiutang di akhir bulan lalu
    o['pk_' + a.kelas]++;
    var b = ini[npp];
    if (b && b.bln >= 1 && KELAS_PIUTANG.indexOf(b.kelas) > KELAS_PIUTANG.indexOf(a.kelas)) {
      if (a.kelas !== 'macet') o['mig_' + a.kelas]++;
      risiko.push({ npp: npp, dari: a.kelas, ke: b.kelas });
    }
  });
  o._risiko = risiko;
  return o;
}

function hitungKpi_(D, R) {
  var mig = hitungKpiMigrasi_(D, R);
  var bul = hitungKpiBulanan_(D, R);
  return { mig: mig, churn: bul.churn, los: bul.los, bulan: bul.bulan };
}

function hitungKpiMigrasi_(D, R) {
  var t = bacaTab_('KPI_MIGRASI');
  var baris = {};
  t.data.forEach(function (o) {
    var b = keBlth_(o.bulan);
    if (!b) return;
    o.bulan = b;
    o.lingkup = String(o.lingkup || 'Binaan').trim() === 'Kantor' ? 'Kantor' : 'Binaan';
    baris[b + '|' + o.lingkup] = o;
  });
  function ambil(b, l) { return baris[b + '|' + l] || (baris[b + '|' + l] = { bulan: b, lingkup: l }); }
  function isi(o, h, sumber, catatan) {
    KELAS_PIUTANG.forEach(function (k) { o['pk_' + k] = h['pk_' + k]; });
    KOMPONEN_MIGRASI.forEach(function (k) { o['mig_' + k.dari] = h['mig_' + k.dari]; });
    o.sumber = sumber;
    o.catatan = catatan || '';
  }
  var kecualikanMi = String(P_('kpi_mig_kecualikan_mi')) !== 'Tidak';
  var mulai = keBlth_(P_('kpi_mig_mulai')) || (D.bulanIni.slice(0, 4) + '-06');
  var skala = function (npp) { return String((D.mon[npp] || {}).skala || (D.per[npp] || {}).skala || ''); };
  var ikut = function (npp) { return !(kecualikanMi && skala(npp) === 'MI'); };
  var bobot = Pn_('kpi_mig_bobot');

  // 1. resmi dari KPI085 (detil per PK)
  var detil = {};
  bacaTab_('MIGRASI_DETIL').data.forEach(function (o) { var b = keBlth_(o.bulan); if (b) (detil[b] = detil[b] || []).push(o); });
  Object.keys(detil).forEach(function (b) {
    var hb = {};
    KELAS_PIUTANG.forEach(function (k) { hb['pk_' + k] = 0; });
    KOMPONEN_MIGRASI.forEach(function (k) { hb['mig_' + k.dari] = 0; });
    detil[b].forEach(function (o) {
      var k = kelasDariTeks_(o.kelas_lalu);
      if (!k || o.binaan !== 'Ya') return;
      hb['pk_' + k]++;
      if (String(o.migrasi).toUpperCase().indexOf('Y') === 0 && k !== 'macet') hb['mig_' + k]++;
    });
    var ob = ambil(b, 'Binaan');
    if (String(ob.sumber || '') !== 'Manual') isi(ob, hb, 'Resmi KPI085', '');
  });

  // 2. perkiraan LENSA dari snapshot ITW/ITB (bulan tanpa KPI085)
  var perPeriode = {};
  D.itwSemua.forEach(function (o) { (perPeriode[o.periode] = perPeriode[o.periode] || []).push(o); });
  var akhir = {};
  Object.keys(perPeriode).forEach(function (p) { var b = p.slice(0, 7); if (!akhir[b] || p > akhir[b]) akhir[b] = p; });
  var risiko = null, sementara = null, rekKira = 0;
  for (var M = mIdx_(mulai); M <= D.M0; M++) {
    var b = blthDariIdx_(M), bl = blthDariIdx_(M - 1);
    if (detil[b] || !akhir[b]) continue;
    var ob2 = ambil(b, 'Binaan');
    if (!bolehLensa_(ob2.sumber)) continue;
    var lalu = null, ket = '';
    if (akhir[bl]) { lalu = statusDariSnapshot_(perPeriode[akhir[bl]]); ket = 'akhir bulan lalu dari ITW ' + tglIndo_(akhir[bl]); }
    else if (M === D.M0) {
      var awal = Object.keys(perPeriode).filter(function (p) { return p.slice(0, 7) === b; }).sort()[0];
      var rk = rekonstruksiBulanLalu_(D, perPeriode[awal], awal);
      lalu = rk.perPk; rekKira = rk.kira;
      ket = 'akhir bulan lalu dibangun ulang dari ITW ' + tglIndo_(awal) + ' (' + rk.kira + ' PK diperkirakan)';
    }
    if (!lalu) continue;
    var ini = statusDariSnapshot_(perPeriode[akhir[b]]);
    var h2 = migrasiDariStatus_(lalu, ini, ikut);
    var semen = M === D.M0;
    isi(ob2, h2, 'LENSA · ITW ' + tglIndo_(akhir[b]) + (semen ? ' (sementara)' : ''), (semen ? 'sementara; ' : '') + ket);
    if (semen) { risiko = h2._risiko; sementara = ob2; }
  }

  // 3. capaian bulanan, rata-rata, skor per lingkup
  var kunci = Object.keys(baris).sort(function (a, b) {
    var pa = a.split('|'), pb = b.split('|');
    return pa[0] < pb[0] ? -1 : pa[0] > pb[0] ? 1 : (pa[1] === 'Kantor' ? -1 : 1);
  });
  var riwayat = { Kantor: [], Binaan: [] };
  kunci.forEach(function (k) {
    var o = baris[k];
    KOMPONEN_MIGRASI.forEach(function (c) { o['capaian_' + c.dari] = ''; o['rata_' + c.dari] = ''; });
    o.skor = '';
    if (!adaHitungan_(o) || o.bulan < mulai) return;
    var cap = {};
    KOMPONEN_MIGRASI.forEach(function (c) {
      cap[c.dari] = capaianMigrasi_(Pn_(c.target), o['mig_' + c.dari], o['pk_' + c.dari]);
      o['capaian_' + c.dari] = cap[c.dari] === null ? '' : cap[c.dari];
    });
    var semen = String(o.catatan || '').indexOf('sementara') === 0;
    var hist = riwayat[o.lingkup].filter(function (x) { return x.bulan.slice(0, 4) === o.bulan.slice(0, 4); }).concat([{ bulan: o.bulan, cap: cap }]);
    var skor = 0;
    KOMPONEN_MIGRASI.forEach(function (c) {
      var v = hist.map(function (x) { return x.cap[c.dari]; }).filter(function (x) { return x !== null; });
      var r = v.length ? v.reduce(function (s, x) { return s + x; }, 0) / v.length : null;
      o['rata_' + c.dari] = r === null ? '' : r;
      skor += (r || 0) * bobot;
    });
    o.skor = Math.round(skor * 10000) / 10000;
    if (!semen) riwayat[o.lingkup].push({ bulan: o.bulan, cap: cap });
  });
  tulisTab_('KPI_MIGRASI', kunci.map(function (k) { return baris[k]; }));

  var terakhir = function (l, termasukSementara) {
    var r = kunci.map(function (k) { return baris[k]; }).filter(function (o) {
      return o.lingkup === l && o.skor !== '' && (termasukSementara || String(o.catatan || '').indexOf('sementara') !== 0);
    });
    return r.length ? r[r.length - 1] : null;
  };
  var nama = {};
  R.forEach(function (r) { nama[r.npp] = r.nama; });
  return { kantor: terakhir('Kantor', false), binaan: terakhir('Binaan', false), sementara: sementara, bobot: bobot, mulai: mulai,
    kecualikanMi: kecualikanMi, risiko: risiko ? risiko.length : null, risikoDaftar: risiko || [], rekKira: rekKira };
}

/** Churn rate dan length of stay (tab KPI_BULANAN). */
function hitungKpiBulanan_(D, R) {
  var t = bacaTab_('KPI_BULANAN');
  var baris = {};
  t.data.forEach(function (o) { var b = keBlth_(o.bulan); if (b) { o.bulan = b; baris[b] = o; } });
  function ambil(b) { return baris[b] || (baris[b] = { bulan: b }); }

  // length of stay TK PU baru (perkiraan dari PK baru tahun ini)
  var oIni = ambil(D.bulanIni);
  if (bolehLensa_(oIni.sumber_los)) {
    var st = 0, sm = 0;
    R.forEach(function (r) {
      if (!r._tkBaru || !r._kepsAwal) return;
      var tk = angka_(r.tk_aktif);
      if (!tk) return;
      var k = mIdx_(r._kepsAwal), bp = r._blthPosting ? mIdx_(r._blthPosting) : k - 1;
      var masa = Math.max(0, Math.min(bp, D.M0) - k + 1);
      st += tk; sm += tk * masa;
    });
    if (st) {
      oIni.los_pu = Math.round(sm / st * 100) / 100;
      oIni.tk_pu_baru = st;
      oIni.sumber_los = 'LENSA · perkiraan dari PK baru ' + D.bulanIni.slice(0, 4);
    }
  }

  var tanpaDinilai = String(P_('kpi_churn_kecualikan_non_asn')) === 'Ya';
  var bulan = Object.keys(baris).sort();
  bulan.forEach(function (b) {
    var o = baris[b];
    o.churn = ''; o.churn_tanpa_non_asn = ''; o.churn_non_asn = '';
    if (o.tk_keluar === '' || o.tk_keluar === undefined || o.tk_keluar === null) return;
    var aw = angka_(o.tk_awal), ak = angka_(o.tk_akuisisi), kl = angka_(o.tk_keluar), na = angka_(o.natural_attrition);
    var awN = angka_(o.tk_awal_non_asn), akN = angka_(o.tk_akuisisi_non_asn), klN = angka_(o.tk_keluar_non_asn);
    if (aw + ak > 0) o.churn = (kl - na) / (aw + ak);
    if (aw - awN + ak - akN > 0) o.churn_tanpa_non_asn = (kl - klN - na) / (aw - awN + ak - akN);
    if (awN + akN > 0) o.churn_non_asn = klN / (awN + akN);
  });
  tulisTab_('KPI_BULANAN', bulan.map(function (b) { return baris[b]; }));

  var tahun = D.bulanIni.slice(0, 4);
  var bChurn = bulan.filter(function (b) { return b.slice(0, 4) === tahun && baris[b].churn !== ''; }).pop();
  var oc = bChurn ? baris[bChurn] : {};
  var semua = bChurn ? oc.churn : null, tanpa = bChurn && oc.churn_tanpa_non_asn !== '' ? oc.churn_tanpa_non_asn : null;
  var dinilai = tanpaDinilai ? tanpa : semua;
  var capChurn = capaiTurun_(Pn_('kpi_churn_target'), dinilai);
  var bLos = bulan.filter(function (b) { return b.slice(0, 4) === tahun && baris[b].los_pu !== '' && baris[b].los_pu !== undefined; }).pop();
  var los = bLos ? angka_(baris[bLos].los_pu) : null;
  var capLos = capaiNaik_(Pn_('kpi_los_target_pu'), los);
  return {
    bulan: bulan,
    churn: { semua: semua, tanpa: tanpa, nonAsn: bChurn && oc.churn_non_asn !== '' ? oc.churn_non_asn : null, tanpaDinilai: tanpaDinilai,
      bulan: bChurn, sumber: oc.sumber_churn || '', natural: angka_(oc.natural_attrition),
      capSemua: capaiTurun_(Pn_('kpi_churn_target'), semua), capTanpa: capaiTurun_(Pn_('kpi_churn_target'), tanpa),
      capai: capChurn, bobot: Pn_('kpi_churn_bobot'), skor: capChurn === null ? null : capChurn * Pn_('kpi_churn_bobot') },
    los: { nilai: los, bulan: bLos, sumber: bLos ? baris[bLos].sumber_los : '', tk: bLos ? baris[bLos].tk_pu_baru : '', capai: capLos,
      bobot: Pn_('kpi_los_bobot_pu'), skor: capLos === null ? null : capLos * Pn_('kpi_los_bobot_pu') }
  };
}

/** Dipanggil saat impor Monitoring: komponen churn tahun berjalan per periode laporan. */
function simpanChurnDariMonitoring_(semua, lap, periode) {
  var th = lap.slice(0, 4);
  var per = {};
  try { bacaTab_('PERUSAHAAN').data.forEach(function (o) { per[String(o.npp)] = o; }); } catch (e) { /* diam */ }
  var x = { aw: 0, ak: 0, kl: 0, awN: 0, akN: 0, klN: 0 };
  semua.forEach(function (o) {
    if (o.blth_na && o.blth_na.slice(0, 4) !== th) return;
    var aw = o.tk_aktif - o.tk_tambah + o.tk_kurang;
    var m = per[o.npp];
    var na = m && (m.non_asn === 'Ya' || m.non_asn === 'Tidak') ? m.non_asn === 'Ya' : tebakNonAsn_(o.nama, o.skala, tebakSegmen_(o.nama, '', o.skala)) === 'Ya';
    x.aw += aw; x.ak += o.tk_tambah; x.kl += o.tk_kurang;
    if (na) { x.awN += aw; x.akN += o.tk_tambah; x.klN += o.tk_kurang; }
  });
  var t = bacaTab_('KPI_BULANAN'), o = null;
  t.data.forEach(function (r) { if (keBlth_(r.bulan) === lap) o = r; });
  var baru = !o;
  if (baru) o = { bulan: lap };
  if (!bolehLensa_(o.sumber_churn)) return null;
  o.tk_awal = x.aw; o.tk_akuisisi = x.ak; o.tk_keluar = x.kl;
  o.tk_awal_non_asn = x.awN; o.tk_akuisisi_non_asn = x.akN; o.tk_keluar_non_asn = x.klN;
  o.sumber_churn = 'LENSA · Monitoring ' + namaBulan_(lap) + ' cetak ' + tglIndo_(periode);
  if (baru) tambahBaris_('KPI_BULANAN', [o]);
  else ubahSel_('KPI_BULANAN', o, ['tk_awal', 'tk_akuisisi', 'tk_keluar', 'tk_awal_non_asn', 'tk_akuisisi_non_asn', 'tk_keluar_non_asn', 'sumber_churn']);
  return x.aw + x.ak > 0 ? x.kl / (x.aw + x.ak) : null;
}

/* ----------------------- impor KPI084 & KPI085 ----------------------- */

var BULAN_KPI = /^(jan|feb|mar|apr|mei|may|jun|jul|agu|ags|agt|aug|sep|okt|oct|nov|des|dec)[a-z]*$/;

function imporKpi084_(data, ctx) {
  var th = +ctx.periode.slice(0, 4), bc = +ctx.periode.slice(5, 7);
  var t = bacaTab_('KPI_MIGRASI'), ada = {};
  t.data.forEach(function (o) { var b = keBlth_(o.bulan); if (b) ada[b + '|' + o.lingkup] = o; });
  var baru = [], beda = [], bulanList = [];
  data.forEach(function (r) {
    var bn = BULAN_SINGKAT[norm_(r.bulan).slice(0, 3)];
    if (!bn) return;
    var b = (bn > bc ? th - 1 : th) + '-' + pad2_(bn);
    if (bulanList.indexOf(b) >= 0) return; // blok kedua (konsolidasi) sama isinya
    bulanList.push(b);
    var o = ada[b + '|Kantor'] || { bulan: b, lingkup: 'Kantor' };
    if (String(o.sumber || '') === 'Manual') return;
    KELAS_PIUTANG.forEach(function (k) { o['pk_' + k] = keAngka_(r['pk_' + k]) || 0; });
    KOMPONEN_MIGRASI.forEach(function (k) { o['mig_' + k.dari] = keAngka_(r['mig_' + k.dari]) || 0; });
    o.sumber = 'Resmi KPI084';
    o.catatan = '';
    o._lapor = r;
    if (!ada[b + '|Kantor']) { baru.push(o); ada[b + '|Kantor'] = o; }
  });
  var semua = Object.keys(ada).map(function (k) { return ada[k]; }).sort(function (a, b) {
    var x = keBlth_(a.bulan), y = keBlth_(b.bulan);
    return x < y ? -1 : x > y ? 1 : (a.lingkup === 'Kantor' ? -1 : 1);
  });
  tulisTab_('KPI_MIGRASI', semua);
  // hitung ulang capaian kantor untuk dibandingkan dengan angka laporan
  var mulai = keBlth_(P_('kpi_mig_mulai')) || (th + '-06');
  var kantor = semua.filter(function (o) { return o.lingkup === 'Kantor' && keBlth_(o.bulan) >= mulai; })
    .sort(function (a, b) { return keBlth_(a.bulan) < keBlth_(b.bulan) ? -1 : 1; });
  var hist = [], skorAkhir = null;
  kantor.forEach(function (o) {
    var cap = {};
    KOMPONEN_MIGRASI.forEach(function (c) { cap[c.dari] = capaianMigrasi_(Pn_(c.target), o['mig_' + c.dari], o['pk_' + c.dari]); });
    hist.push(cap);
    var skor = 0;
    KOMPONEN_MIGRASI.forEach(function (c) {
      var rata = hist.reduce(function (s, h) { return s + h[c.dari]; }, 0) / hist.length;
      skor += rata * Pn_('kpi_mig_bobot');
      var r = o._lapor;
      if (r) {
        var lc = keAngka_(r['cap_' + c.dari], true), lr = keAngka_(r['rata_' + c.dari], true);
        if (lc !== null && Math.abs(lc - cap[c.dari] * 100) > 0.011) beda.push(keBlth_(o.bulan) + ' capaian ' + c.dari);
        if (lr !== null && Math.abs(lr - rata * 100) > 0.011) beda.push(keBlth_(o.bulan) + ' rata ' + c.dari);
      }
    });
    if (o._lapor) {
      var ls = keAngka_(o._lapor.skor, true);
      if (ls !== null && Math.abs(ls - skor) > 0.011) beda.push(keBlth_(o.bulan) + ' skor ' + ls + '≠' + skorTampil_(skor));
    }
    skorAkhir = { bulan: keBlth_(o.bulan), skor: skor };
  });
  var dicek = data.some(function (r) { return keAngka_(r.skor, true) !== null; });
  var cek = 'Kantor ' + bulanList.map(function (b) { return NAMA_BULAN_PENDEK[+b.slice(5, 7) - 1]; }).join(', ') +
    (skorAkhir ? ' · skor ' + NAMA_BULAN_PENDEK[+skorAkhir.bulan.slice(5, 7) - 1] + ' ' + skorTampil_(skorAkhir.skor) : '') +
    (!dicek ? '' : beda.length ? ' · BEDA dengan hitungan LENSA: ' + beda.slice(0, 4).join('; ') : ' · capaian dan skor cocok dengan hitungan LENSA');
  return { periode: ctx.periode, aktif: '', baru: baru.length, berubah: bulanList.length - baru.length, cek: cek, pesan: '' };
}

/**
 * KPI084: setiap baris bulan dibaca menurut urutan isinya (nama bulan lalu 19 angka b..t),
 * karena ekspor Excel menaruh angka di kolom yang berbeda-beda tiap baris.
 */
function ambilKpi084_(grid) {
  var kunci = ['pk_itw', 'pk_lancar', 'pk_kurang_lancar', 'pk_diragukan', 'pk_macet', 'mig_itw', 'mig_lancar', 'mig_kurang_lancar', 'mig_diragukan',
    'cap_itw', 'cap_lancar', 'cap_kurang_lancar', 'cap_diragukan', 'rata_itw', 'rata_lancar', 'rata_kurang_lancar', 'rata_diragukan', 'bobot', 'skor'];
  var out = [], lihat = {};
  grid.forEach(function (row) {
    for (var c = 0; c < row.length; c++) {
      var x = norm_(row[c]);
      if (!/^[a-z]{3,9}$/.test(x) || !BULAN_SINGKAT[x.slice(0, 3)] || !BULAN_KPI.test(x)) continue;
      var angka = [];
      for (var d = c + 1; d < row.length && angka.length < kunci.length; d++) {
        var s = String(row[d] === undefined ? '' : row[d]).trim();
        if (!s) continue;
        var a = keAngka_(s, true);
        if (a === null) { angka = null; break; }
        angka.push(s);
      }
      if (!angka || angka.length < 9) continue;
      var b = x.slice(0, 3);
      if (lihat[b]) return; // blok kedua (konsolidasi) sama isinya
      lihat[b] = true;
      var o = { bulan: x };
      kunci.forEach(function (k, i) { o[k] = angka[i] === undefined ? '' : angka[i]; });
      out.push(o);
      return;
    }
  });
  return out;
}

function bulanDariJudul_(teks) {
  var m = norm_(teks).match(/(jan|feb|mar|apr|mei|may|jun|jul|agu|ags|agt|aug|sep|okt|oct|nov|des|dec)[a-z]*\s*(\d{2,4})\b/);
  return m ? tahun4_(m[2]) + '-' + pad2_(BULAN_SINGKAT[m[1]]) : '';
}

function imporKpi085_(data, ctx) {
  var an = ctx.an, peta = ctx.peta;
  var bulan = peta.kelas_ini !== undefined ? bulanDariJudul_(an.gabung[peta.kelas_ini]) : '';
  if (!bulan) {
    var m = String(an.judulTeks || '').match(/periode\s*:?\s*(\d{1,2}[\-\/\. ][a-z]{3}[a-z]*[\-\/\. ]\d{2,4})/i);
    var tp = m ? keTanggal_(m[1]) : '';
    if (tp) bulan = blthDariIdx_(mIdx_(tp.slice(0, 7)) - 1);
  }
  if (!bulan) throw new Error('Bulan migrasi tidak terbaca dari judul kolom PIUTANG maupun baris Periode.');
  var namaSaya = normCari_(P_('nama_petugas'));
  var binaanNpp = {};
  try { bacaTab_('PERUSAHAAN').data.forEach(function (o) { binaanNpp[String(o.npp)] = true; }); } catch (e) { /* diam */ }
  var cocokNama = namaSaya && data.some(function (r) { return normCari_(r.pembina) === namaSaya; });
  var rows = data.map(function (r) {
    var kl = kelasDariTeks_(r.kelas_lalu), ki = kelasDariTeks_(r.kelas_ini);
    return { bulan: bulan, npp: r.npp, pembina: String(r.pembina || '').trim(), nama: String(r.nama || '').trim(),
      kelas_lalu: kl ? NAMA_KELAS[kl] : String(r.kelas_lalu || ''), kelas_ini: ki ? NAMA_KELAS[ki] : '',
      migrasi: /^Y/i.test(String(r.migrasi).trim()) ? 'Ya' : 'Tidak',
      binaan: (cocokNama ? normCari_(r.pembina) === namaSaya : !!binaanNpp[r.npp]) ? 'Ya' : 'Tidak', id_impor: ctx.id };
  });
  // hanya baris binaan Anda yang disimpan; baris pembina lain hanya dihitung untuk cek total
  var simpan = rows.filter(function (o) { return o.binaan === 'Ya'; });
  if (!simpan.length) throw new Error('Tidak ada PK binaan Anda di file ini (nama pembina tidak cocok dengan PENGATURAN nama_petugas dan NPP tidak ada di PERUSAHAAN). Tidak diimpor.');
  var t = bacaTab_('MIGRASI_DETIL');
  var lama = t.data.filter(function (o) { return keBlth_(o.bulan) !== bulan && o.binaan === 'Ya'; });
  if (lama.length !== t.data.length) tulisTab_('MIGRASI_DETIL', lama.concat(simpan));
  else tambahBaris_('MIGRASI_DETIL', simpan);
  // cek terhadap KPI084 bulan yang sama
  var h = {};
  KELAS_PIUTANG.forEach(function (k) { h['pk_' + k] = 0; });
  KOMPONEN_MIGRASI.forEach(function (k) { h['mig_' + k.dari] = 0; });
  var nBin = 0, nBinMig = 0;
  rows.forEach(function (o) {
    var k = kelasDariTeks_(o.kelas_lalu);
    if (!k) return;
    h['pk_' + k]++;
    if (o.migrasi === 'Ya' && k !== 'macet') h['mig_' + k]++;
    if (o.binaan === 'Ya') { nBin++; if (o.migrasi === 'Ya') nBinMig++; }
  });
  var k84 = null;
  bacaTab_('KPI_MIGRASI').data.forEach(function (o) { if (keBlth_(o.bulan) === bulan && o.lingkup === 'Kantor' && String(o.sumber).indexOf('KPI084') >= 0) k84 = o; });
  var cek = 'Migrasi ' + namaBulan_(bulan) + ': binaan Anda ' + nBin + ' PK berpiutang, ' + nBinMig + ' bermigrasi (disimpan); ' + (rows.length - nBin) + ' baris pembina lain tidak disimpan';
  if (!cocokNama && namaSaya) cek += ' · nama pembina tidak cocok dengan PENGATURAN nama_petugas, binaan dipilih menurut NPP';
  if (k84) {
    var sama = KELAS_PIUTANG.every(function (k) { return angka_(k84['pk_' + k]) === h['pk_' + k]; }) &&
      KOMPONEN_MIGRASI.every(function (k) { return angka_(k84['mig_' + k.dari]) === h['mig_' + k.dari]; });
    cek += sama ? ' · cocok dengan KPI084' : ' · BEDA dengan KPI084 bulan yang sama';
  }
  return { periode: ctx.periode, aktif: nBin, baru: simpan.length, berubah: 0, cek: cek, pesan: '' };
}

function persenTampil_(v, d) {
  if (v === null || v === undefined || v === '') return '–';
  return (Math.round(v * Math.pow(10, 2 + (d === undefined ? 1 : d))) / Math.pow(10, d === undefined ? 1 : d)).toString().replace('.', ',') + '%';
}

function angkaTampil_(v, d) {
  if (v === null || v === undefined || v === '') return '–';
  var f = Math.pow(10, d === undefined ? 2 : d);
  return (Math.round(v * f) / f).toString().replace('.', ',');
}

function skorTampil_(v) {
  return v === null || v === undefined || v === '' ? '–' : (Math.round(v * 100) / 100).toFixed(2).replace('.', ',');
}

function tulisAnalisaGagal_(pesan) {

}

}

function tulisAnalisa_(D, R, rapor, kpi) {
  var sh = lembar_('ANALISA');
  var L = 8, rows = [], gaya = [], warnaSel = [];
  function baris(v, g) {
    var r = [];
    for (var i = 0; i < L; i++) r.push(v[i] === undefined || v[i] === null ? '' : v[i]);
    rows.push(r); gaya.push(g || '');
    return rows.length;
  }
  function warnai(r, c, v) { if (v !== null && v !== undefined && v !== '') warnaSel.push([r, c, v >= 1 ? WARNA.latarHijau : v >= 0.8 ? WARNA.latarKuning : WARNA.latarMerah]); }
  var cap = Pn_('kpi_batas_pencapaian'), th = D.bulanIni.slice(0, 4);
  var pendek = function (b) { return b ? NAMA_BULAN_PENDEK[+b.slice(5, 7) - 1] : '–'; };
  baris(['LENSA PK · Analisa'], 'judul');
  baris(['Data ITW/ITB ' + tglIndo_(D.periodeItw) + ' · dihitung ' + sekarangStr_() + ' · binaan = PK Anda; kantor = KPI084'], 'kecil');
  baris([]);

  // ---- migrasi piutang ----
  var m = kpi.mig, k = m.kantor, b = m.binaan, s = m.sementara;
  baris(['Migrasi piutang ' + th + ' (2026.DRV.2.08.0)'], 'bagian');
  baris(['Komponen', 'Target', 'Binaan ' + (s ? pendek(s.bulan) + ' (sementara)' : 'bulan ini'), 'Capaian', 'Rata-rata binaan' + (b ? ' s.d. ' + pendek(b.bulan) : ''),
    'Rata-rata kantor' + (k ? ' s.d. ' + pendek(k.bulan) : ''), 'Bobot', ''], 'kepala');
  KOMPONEN_MIGRASI.forEach(function (c) {
    var r = baris([c.judul, '≤ ' + angkaTampil_(Pn_(c.target), 1) + '%',
      s ? angka_(s['mig_' + c.dari]) + ' dari ' + angka_(s['pk_' + c.dari]) + ' PK' : '–',
      s ? persenTampil_(s['capaian_' + c.dari], 0) : '–',
      b ? persenTampil_(b['rata_' + c.dari], 0) : '–', k ? persenTampil_(k['rata_' + c.dari], 0) : '–', angkaTampil_(m.bobot, 1)]);
    if (s) warnai(r, 4, s['capaian_' + c.dari]);
    if (b) warnai(r, 5, b['rata_' + c.dari]);
    if (k) warnai(r, 6, k['rata_' + c.dari]);
  });
  baris(['Skor migrasi', '', '', s ? skorTampil_(s.skor) + ' bila bulan ini berakhir begini' : '', b ? skorTampil_(b.skor) : '–', k ? skorTampil_(k.skor) : '–',
    angkaTampil_(m.bobot * 4, 1)], 'tebal');
  [
    'Capaian = target ÷ (PK bermigrasi ÷ PK di kelas itu akhir bulan lalu), maks. ' + cap + '%; rata-rata capaian sejak ' + pendek(m.mulai) + '; skor = Σ rata-rata × ' + angkaTampil_(m.bobot, 1) + '. Sama dengan KPI084.',
    'Basis: PK yang masih berpiutang di akhir bulan lalu (iuran bulan itu belum terposting)' + (m.kecualikanMi ? ', tanpa PK skala MI' : '') + '. Umur piutang = koefisien − 1 bulan.',
    'Binaan per bulan diambil dari impor KPI085; bulan tanpa KPI085 diperkirakan dari snapshot ITW/ITB (lihat tab KPI_MIGRASI).'
  ].forEach(function (x) { baris([x], 'kecil'); });
  if (m.risiko !== null) baris([m.risiko + ' PK binaan sudah pindah kelas bulan ini. Bila membayar sebelum akhir bulan, mereka tidak dihitung bermigrasi.'], 'catatan');
  baris([]);

  // ---- churn & length of stay ----
  baris(['Sustainability index ' + th], 'bagian');
  baris(['Parameter', 'Realisasi', 'Target', 'Pencapaian', 'Bobot', 'Skor', 'Sumber'], 'kepala');
  var c = kpi.churn, l = kpi.los, sd = ' s.d. ' + pendek(c.bulan);
  var r1 = baris(['Churn rate · semua PK' + (c.tanpaDinilai ? '' : ' (dinilai)') + sd, persenTampil_(c.semua), '< ' + angkaTampil_(Pn_('kpi_churn_target'), 1) + '%',
    persenTampil_(c.capSemua, 0), c.tanpaDinilai ? '' : angkaTampil_(c.bobot, 1), c.tanpaDinilai ? '' : skorTampil_(c.skor), c.sumber || 'impor Monitoring']);
  warnai(r1, 4, c.capSemua);
  var r2 = baris(['Churn rate · tanpa PK non-ASN' + (c.tanpaDinilai ? ' (dinilai)' : '') + sd, persenTampil_(c.tanpa), '< ' + angkaTampil_(Pn_('kpi_churn_target'), 1) + '%',
    persenTampil_(c.capTanpa, 0), c.tanpaDinilai ? angkaTampil_(c.bobot, 1) : '', c.tanpaDinilai ? skorTampil_(c.skor) : '', 'pilih di menu Analisa']);
  warnai(r2, 4, c.capTanpa);
  baris(['Churn rate · PK non-ASN saja' + sd, persenTampil_(c.nonAsn), '', '', '', '', 'informasi']);
  var r3 = baris(['Length of stay TK PU baru', l.nilai === null ? '–' : angkaTampil_(l.nilai) + ' bln', '≥ ' + angkaTampil_(Pn_('kpi_los_target_pu'), 1) + ' bln',
    persenTampil_(l.capai, 0), angkaTampil_(l.bobot, 1), skorTampil_(l.skor), l.sumber || '–']);
  warnai(r3, 4, l.capai);
  [
    'Churn = (TK keluar − natural attrition) ÷ (TK aktif 31 Des tahun lalu + akuisisi TK tahun ini); pencapaian = target ÷ realisasi, maks. ' + cap + '%.',
    c.natural ? 'Natural attrition sudah diisi di KPI_BULANAN.' : 'Natural attrition (meninggal, pensiun) belum diisi di KPI_BULANAN, jadi churn LENSA sedikit lebih tinggi dari resmi.',
    'Non-ASN = kolom non_asn di PERUSAHAAN. Length of stay LENSA hanya perkiraan dari PK baru tahun ini; angka resmi KPI076 bisa diketik di KPI_BULANAN.'
  ].forEach(function (x) { baris([x], 'kecil'); });
  baris([]);

  // ---- rapor ----
  baris(['Rapor PK (tab RAPOR)'], 'bagian');
  var w = { Hijau: 0, Kuning: 0, Merah: 0 }, fl = {};
  rapor.forEach(function (r) {
    w[r.warna]++;
    String(r.flags).split(', ').filter(String).forEach(function (f) { fl[f] = (fl[f] || 0) + 1; });
  });
  baris(['Hijau ≥ ' + Pn_('ambang_hijau'), 'Kuning', 'Merah', 'Skor rata-rata'], 'kepala');
  baris([w.Hijau, w.Kuning, w.Merah, rapor.length ? Math.round(rapor.reduce(function (s2, r) { return s2 + r.skor; }, 0) / rapor.length) : '–']);
  baris([]);
  baris(['Peluang dan risiko', 'Jumlah PK', 'Keterangan'], 'kepala');
  [['Upah < UMK', 'menengah/besar, dinilai di rapor'], ['Upah < UMK (Mi/K)', 'info; upah Mi/K berdasarkan kesepakatan'],
    ['Skala tidak wajar', 'mikro dengan upah setahun > batas penjualan'], ['Program < wajib', 'Perpres 109/2013'], ['TK turun ≥30%', 'pengurangan TK tahun berjalan']]
    .forEach(function (x) { baris([x[0], fl[x[0]] || 0, x[1]]); });

  sh.getRange(1, 1, sh.getMaxRows(), sh.getMaxColumns()).clearDataValidations();
  sh.getRange(1, 1, sh.getMaxRows(), sh.getMaxColumns()).clear();
  if (sh.getMaxColumns() < L) sh.insertColumnsAfter(sh.getMaxColumns(), L - sh.getMaxColumns());
  pastikanBaris_(sh, rows.length + 2);
  sh.getRange(1, 1, sh.getMaxRows(), L).setNumberFormat('@');
  sh.getRange(1, 1, rows.length, L).setValues(rows).setVerticalAlignment('top').setWrap(true).setFontColor(WARNA.teks);
  gaya.forEach(function (g, i) {
    var r = i + 1;
    if (g === 'judul') sh.getRange(r, 1).setFontSize(14).setFontWeight('bold').setFontColor(WARNA.biru).setWrap(false);
    else if (g === 'kecil') sh.getRange(r, 1).setFontColor(WARNA.teksPudar).setFontSize(9).setWrap(false);
    else if (g === 'catatan') sh.getRange(r, 1).setFontWeight('bold').setFontColor(WARNA.merah).setWrap(false);
    else if (g === 'bagian') sh.getRange(r, 1, 1, L).setFontWeight('bold').setBackground(WARNA.latarBiru);
    else if (g === 'kepala') sh.getRange(r, 1, 1, L).setFontWeight('bold').setBackground(WARNA.latarAbu);
    else if (g === 'tebal') sh.getRange(r, 1, 1, L).setFontWeight('bold');
  });
  warnaSel.forEach(function (x) { sh.getRange(x[0], x[1]).setBackground(x[2]); });
  [240, 80, 150, 85, 120, 120, 55, 230].forEach(function (x, i) { sh.setColumnWidth(i + 1, x); });
}

/** Nilai yang boleh dikirim ke aplikasi: tanggal → teks, kolom bantu (_) dibuang. */
function bersihApi_(v) {
  if (v instanceof Date) return isNaN(v.getTime()) ? '' : fmt_(v, 'yyyy-MM-dd');
  if (Array.isArray(v)) return v.map(bersihApi_);
  if (v && typeof v === 'object') {
    var o = {};
    Object.keys(v).forEach(function (k) { if (k.charAt(0) !== '_') o[k] = bersihApi_(v[k]); });
    return o;
  }
  return v === undefined ? '' : v;
}

function teksApi_(v) { return v === null || v === undefined ? '' : String(v).trim(); }

function pecahKelompok_(s) {
  return String(s || '').split(/[,;]+/).map(function (x) { return x.replace(/\s+/g, ' ').trim(); }).filter(String);
}

function cariBaris_(nama, kunci, nilai) {
  var t = bacaTab_(nama);
  for (var i = 0; i < t.data.length; i++) if (String(t.data[i][kunci]) === String(nilai)) return t.data[i];
  return null;
}

function kunciApi_() {
  var lock = LockService.getDocumentLock();
  if (!lock.tryLock(20000)) throw new Error('Spreadsheet sedang dipakai proses lain. Coba lagi sebentar.');
  return lock;
}

function kontakPk_(peng, rel) {
  var kontak = {};
  rel.forEach(function (r) {
    if (r.aktif === 'Tidak') return;
    var p = peng[String(r.id_pengurus)];
    if (!p || p.status === 'Tidak aktif') return;
    (kontak[String(r.npp)] = kontak[String(r.npp)] || []).push({
      id: String(p.id_pengurus), idRelasi: String(r.id_relasi || ''), nama: teksApi_(p.nama), sapaan: teksApi_(p.sapaan),
      wa: hpSeluler_(p.no_wa), hp: hpTampil_(p.no_wa || p.no_hp_2), jabatan: teksApi_(p.jabatan_umum), peran: teksApi_(r.peran),
      utama: r.pic_utama === 'Ya', pengendali: r.pengendali === 'Ya', email: teksApi_(p.email)
    });
  });
  Object.keys(kontak).forEach(function (n) { kontak[n].sort(function (a, b) { return (b.utama - a.utama) || (b.pengendali - a.pengendali); }); });
  return kontak;
}

/** Sapaan di pesan WA yang sudah tersusun diganti tanpa menyusun ulang pesannya ({salam} masih utuh di pesan). */
function gantiSapaan_(pesan, lama, baru) {
  pesan = String(pesan || '');
  lama = lama || 'Bapak/Ibu'; baru = baru || 'Bapak/Ibu';
  if (lama === baru) return pesan;
  var pola = '{salam} ' + lama;
  if (pesan.indexOf(pola) >= 0) return pesan.split(pola).join('{salam} ' + baru);
  var i = pesan.indexOf(lama);
  return i < 0 ? pesan : pesan.slice(0, i) + baru + pesan.slice(i + lama.length);
}

/* ---------------- titik dari Google Maps (tempel teks / tautan) ---------------- */

function diIndonesia_(lat, lng) { return isFinite(lat) && isFinite(lng) && lat >= -11.5 && lat <= 6.5 && lng >= 94 && lng <= 141.5 && !(lat === 0 && lng === 0); }

/** Mencari pasangan koordinat di teks dengan beberapa pola berurutan; hanya titik di wilayah Indonesia yang diterima
 *  (pusat peta bawaan Google di Amerika, mis. 37.0625,-95.677068, otomatis diabaikan). */
function cariPola_(s, pola) {

    var re = new RegExp(pola[i].re.source, 'gi'), m;
    while ((m = re.exec(s))) {
      var lat = +m[pola[i].lat || 1], lng = +m[pola[i].lng || 2];
      if (diIndonesia_(lat, lng)) return { lat: lat, lng: lng };
      if (m[0] === '') re.lastIndex++;
    }
  }
  return null;
}
var POLA_TEKS_ = [
  { re: /!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/ },                                                   // pin tempat di tautan panjang
  { re: /[?&](?:q|query|ll|sll|daddr|destination|center|markers)=(?:loc:)?\s*(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/ },
  { re: /\/(?:search|place|dir)\/(?:[^\/?#]*\/)?(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/ },           // /maps/search/-7.15,+113.47
  { re: /@(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/ },
  { re: /(-?\d{1,2}\.\d{3,})\s*[,;]\s*(-?\d{1,3}\.\d{3,})/ }                                         // "-7.1573, 113.4745"
];
var POLA_HALAMAN_ = [
  { re: /!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/ },
  { re: /(?:markers|center)=(-?\d{1,2}\.\d+)(?:%2C|,)\s*(-?\d{1,3}\.\d+)/ },                         // gambar og:image (staticmap)
  { re: /\[null,null,(-?\d{1,2}\.\d{4,}),(-?\d{1,3}\.\d{4,})\]/ },                                     // data tempat
  { re: /\/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+),/ },
  { re: /APP_INITIALIZATION_STATE=\[\[\[-?\d+(?:\.\d+)?,(-?\d{1,3}\.\d+),(-?\d{1,2}\.\d+)\]/, lat: 2, lng: 1 }
];

/** Koordinat dari teks: "-7.15, 113.47", tautan Google Maps panjang, atau alamat tujuan tautan pendek. */
function koordinatDariTeks_(s) {
  s = String(s || '');
  return cariPola_(s, POLA_TEKS_) || cariPola_(uraiUrl_(s), POLA_TEKS_) || cariPola_(uraiUrl_(uraiUrl_(s)), POLA_TEKS_);
}

/** Nama tempat/alamat yang terbawa di tautan (q=…, /maps/place/NAMA/) — untuk perkiraan titik bila tautan tanpa koordinat. */
function namaTempatDariUrl_(u) {
  var out = [], s = String(u || '');
  [s, uraiUrl_(s)].forEach(function (x) {
    var re = /[?&](?:q|query|daddr|destination)=([^&#]+)/gi, m;
    while ((m = re.exec(x))) out.push(uraiUrl_(m[1]));
    m = x.match(/\/maps\/(?:place|search)\/([^\/?#@]+)/);
    if (m) out.push(uraiUrl_(m[1]));
  });
  return out.map(function (t) { return t.replace(/\s+/g, ' ').trim(); }).filter(function (t) {
    return t.length >= 3 && !/^place_id:/i.test(t) && !koordinatDariTeks_(t) && /[A-Za-z]/.test(t);
  });
}

/** Perkiraan titik dari nama/alamat tempat lewat Geocoder Google (layanan bawaan Apps Script, tanpa kunci API). */
function geokode_(teks) {
  try {
    var g = Maps.newGeocoder().setRegion('id').setLanguage('id').geocode(teks);
    var r = ((g && g.results) || []).filter(function (x) {
      var l = x.geometry && x.geometry.location; return l && diIndonesia_(+l.lat, +l.lng);
    })[0];
    if (!r) return null;
    return { lat: +r.geometry.location.lat, lng: +r.geometry.location.lng, perkiraan: true, alamat: String(r.formatted_address || teks),
      cari: teks, presisi: String(r.geometry.location_type || '') };
  } catch (e) { return null; }
}

/** Mengurai teks tempelan (koordinat / tautan Google Maps / tautan pendek maps.app.goo.gl).
 *  Hasil { lat, lng } = titik pasti; { lat, lng, perkiraan:true, alamat } = perkiraan dari nama tempat, perlu dicek. */
function apiUraiPeta(teks, npp) {
  teks = String(teks || '');
  var k = koordinatDariTeks_(teks);
  if (k) return k;
  var url = (teks.match(/https?:\/\/[^\s"'<>]+/) || [])[0], nama = [], html = '';
  var lain = teks.replace(/https?:\/\/[^\s"'<>]+/g, ' ').replace(/\s+/g, ' ').trim();
  if (lain.length >= 3 && /[A-Za-z]{3}/.test(lain)) nama.push(lain);
  if (!url && !nama.length) throw new Error('Koordinat tidak terbaca. Tempel angka seperti -7.157, 113.474 atau tautan dari Google Maps.');
  for (var i = 0; i < 6 && url; i++) {
    nama = nama.concat(namaTempatDariUrl_(url));
    var r;
    try { r = UrlFetchApp.fetch(url, { followRedirects: false, muteHttpExceptions: true, headers: { 'Accept-Language': 'id-ID,id;q=0.9' } }); }
    catch (e) { break; }
    var h = r.getHeaders() || {}, lok = String(h.Location || h.location || '');
    if (lok && lok.indexOf('http') !== 0) lok = (url.match(/^https?:\/\/[^\/]+/) || [''])[0] + (lok.charAt(0) === '/' ? '' : '/') + lok;
    k = koordinatDariTeks_(lok);
    if (k) return k;
    if (r.getResponseCode() === 200) {
      html = String(r.getContentText() || '').slice(0, 400000);
      k = cariPola_(html, POLA_HALAMAN_) || cariPola_(html.replace(/&amp;/g, '&'), POLA_HALAMAN_);
      if (k) return k;
      var og = html.match(/<meta[^>]+content="([^"]{3,200})"[^>]+property="og:title"/) || html.match(/property="og:title"[^>]+content="([^"]{3,200})"/);
      if (og && !/^Google Maps$/i.test(og[1])) nama.push(og[1].replace(/&#39;/g, "'").replace(/&amp;/g, '&').replace(/\s*·\s*/g, ', '));
      break;
    }
    url = lok;
  }
  // Tautan "Bagikan" dari sebuah TEMPAT sering tidak berisi koordinat — perkirakan dari nama/alamatnya.
  var m = npp ? cariBaris_('PERUSAHAAN', 'npp', teksApi_(npp)) : null, kab = m ? teksApi_(m.kabupaten) : '';
  var dicoba = {};
  for (var j = 0; j < nama.length; j++) {
    var cari = [nama[j]];
    if (kab && nama[j].toUpperCase().indexOf(kab.toUpperCase()) < 0) cari.push(nama[j] + ', ' + kab);
    for (var c = 0; c < cari.length; c++) {
      if (dicoba[cari[c]]) continue;
      dicoba[cari[c]] = true;
      var g = geokode_(cari[c]);
      if (g) return g;
    }
  }
  throw new Error('Tautan ini tidak memuat titik lokasi. Di Google Maps: tekan lama tepat di lokasi PK sampai muncul pin merah, ' +
    'lalu ketuk angka koordinat di kolom cari (atau Bagikan pin itu), salin, dan tempel di sini.');
}

/** Hitung ulang dari aplikasi (STATUS_PK, HARI_INI, analisa). */
function apiHitung() {
  var lock = LockService.getDocumentLock();
  if (!lock.tryLock(30000)) throw new Error('Spreadsheet sedang dipakai proses lain. Coba lagi sebentar.');
  try { return { ok: true, pesan: hitungUlang_().pesan }; } finally { lock.releaseLock(); }
}

/* HTML aplikasi HP (dibangun dari app.html) */

/* ================= JEMBATAN MONITOR SPPG (sejak 1.14) =================
 * Menyambungkan LENSA PK dengan aplikasi Monitor SPPG (Google Sheet "Monitor SPPG - Sinkron", file terpisah).
 * Prinsip: tiap skrip hanya MENULIS spreadsheet miliknya sendiri; yang lain hanya DIBACA.
 *   Monitor SPPG → LENSA : tab KE_LENSA di Sheet Monitor (laporan mentah binaan, catatan WA, PIC).
 *   LENSA → Monitor SPPG : tab SINKRON_SPPG di spreadsheet ini (laporan baris SPPG, catatan kontak SPPG, PIC SPPG).
 * Pemicu "jembatanSppg" berjalan tiap 5 menit. Laporan pembina lain tetap ditolak oleh jagaPembina_.
 * Bila PIC berbeda, yang terakhir diubah yang dipakai.
 */
var SPPG_TAB = 'SINKRON_SPPG';
var SPPG_SEL = 40000;          // isi per sel (batas Sheets 50.000 karakter)
var SPPG_JENIS_LAPORAN = { ITW_ITB: true, MONITORING: true, DATA_BU: true };
var SPPG_MAKS_BERKAS = 12;     // laporan dari Monitor yang diimpor per putaran (sisanya putaran berikutnya)
var _DARI_SPPG = false;        // true saat mengimpor laporan kiriman Monitor (tidak dikirim balik)

function sppgProp_() { return PropertiesService.getScriptProperties(); }
function sppgAktif_() { try { return !!sppgProp_().getProperty('SPPG_ID'); } catch (e) { return false; } }

function idDariAlamatSppg_(s) {
  s = String(s || '').trim();
  var m = s.match(/\/spreadsheets\/d\/([A-Za-z0-9_\-]{20,})/);
  if (m) return m[1];
  return /^[A-Za-z0-9_\-]{20,}$/.test(s) ? s : '';
}

/* ---------------- menu ---------------- */

function sambungMonitorSppg() {
  var ui = SpreadsheetApp.getUi();
  var r = ui.prompt('Sambungkan ke Monitor SPPG',
    'Tempel alamat (URL) Google Sheet "Monitor SPPG - Sinkron".\n(Sheet itu harus milik akun Google yang sama.)', ui.ButtonSet.OK_CANCEL);
  if (r.getSelectedButton() !== ui.Button.OK) return;
  var id = idDariAlamatSppg_(r.getResponseText());

  try { mon = SpreadsheetApp.openById(id); } catch (e) { return kabar_('Sheet itu tidak bisa dibuka: ' + e.message); }
  if (!mon.getSheetByName('DATA')) return kabar_('Itu bukan Sheet "Monitor SPPG - Sinkron" (tab DATA tidak ada).');
  if (id === ss_().getId()) return kabar_('Itu alamat spreadsheet LENSA PK sendiri. Tempel alamat Sheet Monitor SPPG.');
  var pr = sppgProp_();

    ['SPPG_MASUK', 'SPPG_LOG_MAKS', 'SPPG_DIUBAH', 'SPPG_GALAT', 'SPPG_TERAKHIR'].forEach(function (k) { pr.deleteProperty(k); });
    simpanStatusSppg_({});

    '\n\nSetiap 5 menit LENSA PK dan Monitor SPPG saling bertukar:\n• laporan ITW/ITB, Monitoring, Data Badan Usaha (hanya binaan ' + (P_('kode_pembina') || 'Anda') + ' yang masuk LENSA);\n' +
    '• catatan WA & janji bayar SPPG;\n• PIC SPPG (yang terakhir diubah yang dipakai).');

/** Tombol "Sinkron dengan Monitor SPPG" di aplikasi HP. */
function apiJembatanSppg() {

}

function ringkasJembatan_(h) {

function pasangPemicuSppg_() {

}
function hapusPemicuSppg_() {

}

function infoSppg_() { return { kode: String(P_('kode_pembina') || '').toUpperCase(), versi: VERSI, waktu: sekarangStr_() }; }

/* ---------------- kotak keluar (SINKRON_SPPG) ---------------- */

function siapkanTabSppg_() {
  var ss = ss_(), sh = ss.getSheetByName(SPPG_TAB);
  if (!sh) sh = ss.insertSheet(SPPG_TAB);
  if (sh.getLastRow() === 0) {
    sh.getRange(1, 1, 1, 6).setValues([['seq', 'waktu', 'jenis', 'id', 'bagian', 'isi (dibaca Monitor SPPG; jangan diubah)']]);
    try { sh.setFrozenRows(1); sh.hideSheet(); } catch (e) { /* diam */ }
  }
  return sh;
}

function potongSppg_(teks) {
  var out = [];
  for (var i = 0; i < teks.length; i += SPPG_SEL) out.push('~' + teks.slice(i, i + SPPG_SEL));
  return out;
}
function gabungSppg_(baris, kolomAwal) {
  var n = Number(baris[kolomAwal - 1]) || 0, s = '';
  for (var i = 0; i < n; i++) s += String(baris[kolomAwal + i] || '').replace(/^~/, '');
  return s;
}

/** events: [{ jenis, id, data }] → baris baru di SINKRON_SPPG. */
function tulisSppg_(events) {
  if (!events || !events.length) return 0;
  var sh = siapkanTabSppg_(), pr = sppgProp_();
  var seq = Number(pr.getProperty('SPPG_KELUAR') || 0), waktu = sekarangStr_();
  var rows = events.map(function (ev) {
    seq++;
    var bagian = potongSppg_(JSON.stringify(ev.data === undefined ? null : ev.data));
    return [seq, waktu, ev.jenis, String(ev.id), bagian.length].concat(bagian);
  });
  var lebar = rows.reduce(function (m, r) { return Math.max(m, r.length); }, 6);
  rows = rows.map(function (r) { while (r.length < lebar) r.push(''); return r; });
  var awal = sh.getLastRow() + 1;
  sh.getRange(awal, 1, rows.length, lebar).setValues(rows);
  pr.setProperty('SPPG_KELUAR', String(seq));
  rampingkanSppg_(sh);
  return rows.length;
}

/** Baris lebih dari 30 hari dibuang bila tab sudah lebih dari 3.000 baris. */
function rampingkanSppg_(sh) {
  var lr = sh.getLastRow();
  if (lr < 3000) return;
  var batas = fmt_(new Date(Date.now() - 30 * 86400000), 'yyyy-MM-dd');
  var w = sh.getRange(2, 2, lr - 1, 1).getValues(), n = 0;
  while (n < w.length && String(w[n][0]).slice(0, 10) < batas) n++;
  if (n) sh.deleteRows(2, n);
}

/* ---------------- status PIC (ScriptProperties, dipecah per 8.000 karakter) ---------------- */

function bacaStatusSppg_() {
  var pr = sppgProp_(), n = Number(pr.getProperty('SPPG_PIC_N') || 0), s = '';
  for (var i = 0; i < n; i++) s += pr.getProperty('SPPG_PIC_' + i) || '';
  try { return s ? JSON.parse(s) : {}; } catch (e) { return {}; }
}
function simpanStatusSppg_(o) {
  var pr = sppgProp_(), s = JSON.stringify(o || {}), lama = Number(pr.getProperty('SPPG_PIC_N') || 0), n = 0;
  for (var i = 0; i < s.length; i += 8000) pr.setProperty('SPPG_PIC_' + (n++), s.slice(i, i + 8000));
  for (var j = n; j < lama; j++) pr.deleteProperty('SPPG_PIC_' + j);
  pr.setProperty('SPPG_PIC_N', String(n));
}
function hashSppg_(s) {
  var h = 5381;
  s = String(s);
  for (var i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

/* ---------------- putaran tiap 5 menit ---------------- */

function jembatanSppg() {
  var pr = sppgProp_(), id = pr.getProperty('SPPG_ID');
  var h = { masuk: 0, laporan: 0, catatan: 0, pic: 0, keluar: 0, impor: [], galat: '' };
  if (!id) { hapusPemicuSppg_(); h.galat = 'Belum tersambung.'; return h; }
  var kunci = LockService.getScriptLock();
  if (!kunci.tryLock(2000)) { h.galat = 'Putaran sebelumnya masih berjalan.'; return h; }
  try {
    muatPengaturan_();
    var mon = SpreadsheetApp.openById(id);
    terimaDariSppg_(mon, h);
    var baruDipasang = pr.getProperty('SPPG_VERSI') !== VERSI; // versi skrip baru: periksa ulang semua PIC & catatan
    h.keluar += kirimPerubahanSppg_(h.masuk > 0 || baruDipasang);
    pr.setProperty('SPPG_VERSI', VERSI);
    pr.setProperty('SPPG_TERAKHIR', sekarangStr_());
    pr.deleteProperty('SPPG_GALAT');
  } catch (e) {
    h.galat = String(e && e.message || e);
    pr.setProperty('SPPG_GALAT', sekarangStr_() + ' · ' + h.galat.slice(0, 300));
    catatGalat_('jembatanSppg', h.galat, VERSI, 'pemicu');
  } finally {
    _DARI_SPPG = false;
    kunci.releaseLock();
  }
  return h;
}

/** Membaca KE_LENSA di Sheet Monitor sejak nomor terakhir yang sudah diproses. */
function terimaDariSppg_(mon, h) {
  var sh = mon.getSheetByName('KE_LENSA');
  if (!sh || sh.getLastRow() < 2) return;
  var pr = sppgProp_(), sejak = Number(pr.getProperty('SPPG_MASUK') || 0);
  var lr = sh.getLastRow(), seqKol = sh.getRange(2, 1, lr - 1, 1).getValues();
  var baru = [];
  seqKol.forEach(function (r, i) { var s = Number(r[0]) || 0; if (s > sejak) baru.push({ seq: s, baris: i + 2 }); });
  if (!baru.length) return;
  baru.sort(function (a, b) { return a.seq - b.seq; });
  var lc = sh.getLastColumn(), ev = [];
  baru.forEach(function (b) {
    var r = sh.getRange(b.baris, 1, 1, lc).getValues()[0], d = null;
    try { d = JSON.parse(gabungSppg_(r, 5)); } catch (e) { d = null; }
    ev.push({ seq: b.seq, jenis: String(r[2]), id: String(r[3]), data: d });
  });
  // laporan dibatasi per putaran; yang tersisa diproses putaran berikutnya (urutan tetap)
  var nBerkas = 0, potong = ev.length;
  for (var i = 0; i < ev.length; i++) { if (ev[i].jenis === 'berkas' && ++nBerkas > SPPG_MAKS_BERKAS) { potong = i; break; } }
  ev = ev.slice(0, potong);
  terimaBerkasSppg_(ev.filter(function (e) { return e.jenis === 'berkas' && e.data && e.data.grid; }), h);
  var adaNpp = nppDikenalLensa_();
  terimaPicSppg_(ev.filter(function (e) { return e.jenis === 'pic' && e.data; }), adaNpp, h);
  terimaCatatanSppg_(ev.filter(function (e) { return e.jenis === 'log' && e.data; }), adaNpp, h);
  h.masuk = ev.length;
  pr.setProperty('SPPG_MASUK', String(ev[ev.length - 1].seq));
}

function terimaBerkasSppg_(daftar, h) {
  if (!daftar.length) return;
  var lock = LockService.getDocumentLock();
  if (!lock.tryLock(60000)) throw new Error('LENSA PK sedang sibuk (impor/hitung lain). Laporan diproses putaran berikutnya.');
  var hasil = [];
  try {
    _DARI_SPPG = true;
    var antre = daftar.map(function (e) {
      var grid = e.data.grid.map(function (r) { return (r || []).map(function (x) { return x === null || x === undefined ? '' : String(x); }); });
      var an = null, galat = '';
      try { an = analisaGrid_(grid, e.data.nama); } catch (er) { galat = er.message; }
      return { nama: String(e.data.nama || 'laporan.csv'), grid: grid, an: an, galat: galat };
    });
    antre.sort(function (a, b) { return a.an && b.an ? (PRIORITAS_IMPOR[a.an.jenis] - PRIORITAS_IMPOR[b.an.jenis]) : 0; });
    antre.forEach(function (x) {
      if (!x.an) { hasil.push({ ok: false, ringkas: x.nama + ': GAGAL — ' + x.galat }); return; }
      hasil.push(imporGrid_(x.nama, x.grid, x.an));
    });
    var ok = hasil.filter(function (r) { return r.ok; }).length;
    if (ok) hitungUlang_();
  } finally {
    _DARI_SPPG = false;
    lock.releaseLock();
  }
  h.laporan = hasil.filter(function (r) { return r.ok; }).length;
  hasil.forEach(function (r) { h.impor.push((r.ok ? '✓ ' : '✗ ') + r.ringkas); });
  // hasil impor dikabarkan ke Monitor SPPG
  tulisSppg_(hasil.map(function (r) { return { jenis: 'impor', id: idWaktu_('H'), data: { ok: !!r.ok, ringkas: String(r.ringkas || '').slice(0, 400), waktu: sekarangStr_() } }; }));
}

function terimaPicSppg_(daftar, adaNpp, h) {
  if (!daftar.length) return;
  var st = bacaStatusSppg_(), ubah = false;
  daftar.forEach(function (e) {
    var d = e.data, u = Number(d.u) || 0, nama = teksApi_(d.nama);
    if (!nama) return;
    (d.npp || []).forEach(function (n) {
      n = String(n);
      if (!adaNpp[n]) return; // bukan binaan di LENSA
      var s = st[n];
      if (s && Number(s[1]) >= u) return; // di LENSA lebih baru
      apiSimpanKontak(n, { nama: nama, wa: teksApi_(d.wa), sapaan: teksApi_(d.sapaan), utama: true, catatan: 'Dari Monitor SPPG' });
      st[n] = ['?', u]; // nilai baru dibaca diam-diam di putaran deteksi (tidak dikirim balik)
      ubah = true;
      h.pic++;
    });
  });
  if (ubah) simpanStatusSppg_(st);
}

var SPPG_HASIL_KE_STATUS = { 'Terkirim': 'Terkirim', 'Dibalas': 'Dibalas', 'Janji bayar': 'Janji bayar', 'Sudah bayar': 'Selesai', 'Tidak ada respons': 'Terkirim', 'Nomor salah': 'Tidak aktif' };

function terimaCatatanSppg_(daftar, adaNpp, h) {
  if (!daftar.length) return;
  var lock = kunciApi_();
  try {
    var t = bacaTab_('LOG_INTERAKSI'), sudah = {};
    t.data.forEach(function (x) { var m = String(x.ringkasan || '').match(/\[ref:([^\]]+)\]/); if (m) sudah[m[1]] = true; });
    var hpKe = {};
    bacaTab_('PENGURUS').data.forEach(function (p) { [p.no_wa, p.no_hp_2].forEach(function (x) { var k = normHp_(x); if (k && !hpKe[k]) hpKe[k] = String(p.id_pengurus); }); });
    var next = idBerikut_('L', t.data.map(function (x) { return x.id_log; })), baru = [];
    daftar.forEach(function (e) {
      var d = e.data, ref = String(d.id || e.id);
      if (sudah[ref]) return;
      var npps = (d.npp || []).map(String).filter(function (n) { return adaNpp[n]; });
      if (!npps.length) return;
      sudah[ref] = true;
      var hasil = teksApi_(d.hasil) || 'Terkirim', janji = hasil === 'Janji bayar' && keTanggal_(d.janji);
      var ringkas = '[Monitor SPPG] ' + (teksApi_(d.templat) || 'Pesan WA') + ' · ' + hasil + (teksApi_(d.catatan) ? ' · ' + teksApi_(d.catatan) : '') +
        (teksApi_(d.pic) ? ' · PIC ' + teksApi_(d.pic) : '') + ' [ref:' + ref + ']';
      var tagih = /tagih|rincian|pengingat|ingat/i.test(teksApi_(d.templat));
      npps.forEach(function (n) {
        baru.push({ id_log: next(), tanggal: keTanggal_(d.tanggal) || hariIniStr_(), npp: n, id_pengurus: hpKe[normHp_(d.wa)] || '', jenis: 'WA', ringkasan: ringkas,
          komitmen: janji ? 'Janji bayar' : '', tgl_tindak_lanjut: janji || '', status: SPPG_HASIL_KE_STATUS[hasil] || 'Terkirim',
          hasil_posting: tagih ? 'Menunggu' : '', lat: '', lng: '', foto_url: '' });
      });
      h.catatan++;
    });
    tambahBaris_('LOG_INTERAKSI', baru);
  } finally { lock.releaseLock(); }
}

/* ---------------- deteksi perubahan di LENSA → Monitor ---------------- */

var SPPG_POLA = / SPPG |PEMENUHAN GIZI/;
function namaSppg_(s) { return SPPG_POLA.test(' ' + String(s || '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ') + ' '); }

/** NPP SPPG binaan di LENSA (segmen SPPG atau nama mengandung SPPG).
 *  PK baru yang belum ada di PERUSAHAAN (Data BU lama) tetap dikenali lewat STATUS_PK (laporan ITW/ITB terbaru). */
function nppSppgLensa_() {
  var out = {};
  bacaTab_('PERUSAHAAN').data.forEach(function (o) {
    if (o.segmen === 'SPPG' || namaSppg_(o.nama_perusahaan) || namaSppg_(o.nama_lapangan)) out[String(o.npp)] = true;
  });
  try { bacaTab_('STATUS_PK').data.forEach(function (o) { if (o.segmen === 'SPPG' || namaSppg_(o.nama)) out[String(o.npp)] = true; }); } catch (e) { /* belum dihitung */ }
  return out;
}

/** Semua NPP yang dikenal LENSA: master PERUSAHAAN + STATUS_PK (PK di laporan ITW/ITB terbaru). */

/* ----------------------------------------------------------------------
 *  Pembaca file Excel (.xlsx) sederhana tanpa pustaka luar.
 *  .xlsx = arsip zip berisi XML. Isi zip dibuka dengan DecompressionStream

function u16(b, i) { return b[i] | (b[i + 1] << 8); }

    off += 46 + pjNama + pjEkstra + pjKom;

    ada: function (nama) { return !!isi[nama]; },

      if (e.metode !== 8) throw new Error('Format kompresi Excel tidak didukung. Simpan ulang sebagai CSV.');

function uraiEntitas(s) {
  return String(s).replace(/&(#x[0-9a-f]+|#\d+|lt|gt|amp|quot|apos);/gi, function (m, e) {
    if (e.charAt(0) === '#') return String.fromCodePoint(e.charAt(1).toLowerCase() === 'x' ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10));
    return { lt: '<', gt: '>', amp: '&', quot: '"', apos: "'" }[e.toLowerCase()];

function atribut(teks, nama) {
  var m = teks.match(new RegExp('\\b' + nama + '="([^"]*)"'));

  var d = S.data, pk = (d && d.pk) || [], q = norm(UI.cari);
  var daftar = pk.filter(function (p) { return (!UI.saringStatus || p.status === UI.saringStatus) && (!q || norm([p.nama, p.npp, p.kecamatan, p.desa, (p.kontak || []).map(function (k) { return k.nama; }).join(' ')].join(' ')).indexOf(q) >= 0); });
  var chip = [''].concat(URUT_STATUS).map(function (k) { var nn = k ? pk.filter(function (p) { return p.status === k; }).length : pk.length; return '<button class="chip"' + (UI.saringStatus === k ? ' aria-pressed="true"' : '') + ' data-a="saring" data-v="' + e(k) + '">' + (k || 'Semua') + ' · ' + nn + '</button>'; }).join('');
  return '<div class="kepala"><div><h1>Perusahaan</h1><div class="sub">' + daftar.length + ' dari ' + pk.length + ' PK</div></div></div>' +
    '<div class="kartu"><input class="inp" type="search" data-in="cari" value="' + e(UI.cari) + '" placeholder="Cari nama, NPP, kecamatan, desa, atau PIC" aria-label="Cari perusahaan"><div class="chips">' + chip + '</div>' +
    '<div class="daftar">' + daftar.slice(0, 300).map(barisPk).join('') + '</div>' + (daftar.length > 300 ? '<div class="catatan">Menampilkan 300 pertama; persempit pencarian.</div>' : '') + '</div>';
}

/* ================= DATA ================= */
function layarData() {
  var d = S.data, log = (APP.impor || []).slice(0, 15);
  return '<div class="kepala"><div><h1>Data &amp; pengaturan</h1><div class="sub">Semua data hanya di perangkat ini. Tahap 1: baca & hitung; sinkron antar-perangkat menyusul (tahap 2).</div></div></div>' +
    '<div class="lepas" data-a="pilihBerkas">' + ikon('unggah') + '<b>Impor laporan atau pindahkan data LENSA PK</b><p>Laporan sistem: ITW/ITB, Monitoring, Data Badan Usaha, KPI084/085, Kartu Iuran (CSV/XLSX, boleh beberapa sekaligus) — hanya baris kode pembina ' + e(P_('kode_pembina') || 'HA187580') + ' yang disimpan.<br>Pindah data: di spreadsheet LENSA PK pilih <b>File › Download › Microsoft Excel (.xlsx)</b>, lalu pilih file itu di sini.</p><button class="btn utama">Pilih file</button></div>' +
    (log.length ? kartu('Hasil impor', '', '<div class="daftar-hasil">' + log.map(function (x) { return '<div class="' + (x.info ? 'info' : x.ok ? 'ok' : 'gagal') + '">' + e(x.waktu) + ' · ' + (x.info ? '' : x.ok ? '✓ ' : '✗ ') + e(x.ringkas) + '</div>'; }).join('') + '</div>') : '') +
    kartu('Cadangan', 'file .json berisi seluruh data perangkat ini', '<div class="aksi-baris"><button class="btn" data-a="unduhCadangan">' + ikon('unduh') + 'Unduh cadangan</button><button class="btn" data-a="pilihCadangan">' + ikon('unggah') + 'Pulihkan dari cadangan</button><button class="btn bahaya" data-a="hapusSemua">Hapus semua data di perangkat ini</button></div>');
}

/* ================= LACI (daftar PK / rincian PK) ================= */
function renderLaci() {
  var L = UI.laci, el = $('#laci');
  if (!L) { el.hidden = true; $('#laciLatar').hidden = true; return; }
  el.hidden = false; $('#laciLatar').hidden = false;
  var h = '<div class="laci-kepala">' + (L.kembali ? '<button class="btn polos" data-a="laciKembali">‹ Kembali</button>' : '') + '<div><h2>' + e(L.judul) + '</h2>' + (L.sub ? '<div class="sub">' + e(L.sub) + '</div>' : '') + '</div><button class="ikon-btn" data-a="tutupLaci" aria-label="Tutup">' + ikon('tutup') + '</button></div><div class="laci-isi">';
  if (L.jenis === 'daftar') {
    var tot = L.daftar.reduce(function (t, p) { return t + (+p.tunggakan || 0); }, 0);
    h += '<div class="sub">' + L.daftar.length + ' PK' + (tot ? ' · tunggakan ' + rp(tot) : '') + '</div><div class="daftar">' + L.daftar.slice(0, 400).map(barisPk).join('') + '</div>';
  } else {
    var p = L.p, r = rincian(p), k = kontakUtama(p), ss = st(p);
    h += '<div class="kartu"><div class="kv"><span>Status</span><b style="color:' + warnaStrip(ss.k) + '">' + e(p.status) + '</b><span>Koefisien</span><b>' + e(p.koef) + '</b><span>Iuran terakhir</span><b>' + rp(p.iuran) + '</b><span>Posting terakhir</span><b>' + e(p.blthPosting || '–') + '</b><span>Tenaga kerja</span><b>' + e(p.tk || '–') + '</b><span>Segmen · skala</span><b>' + e([p.segmen, p.skala].filter(Boolean).join(' · ') || '–') + '</b><span>Kode iuran</span><b>' + e(kodeIuran(p) || '–') + '</b></div>' +
      (p.aksi ? '<div class="catatan">Saran LENSA: ' + e(p.aksi) + '</div>' : '') + '</div>';
    h += '<div class="kartu"><h3>Kontak</h3>' + ((p.kontak || []).length ? (p.kontak || []).map(function (x) {
      return '<div class="baris-kontak"><span><b>' + e(x.nama) + '</b>' + (x.utama ? ' <span class="pil">utama</span>' : '') + '<br><span class="sub">' + e([x.jabatan, x.hp].filter(Boolean).join(' · ')) + '</span></span>' +
        (x.wa ? '<span class="aksi-baris"><a class="btn kecil" target="_blank" rel="noopener" href="' + e(urlWa(x.wa, templat('sapa', { sapaan: x.sapaan || 'Bapak/Ibu', pk: p.namaResmi }))) + '">' + ikon('wa') + 'Sapa</a>' +
          (r ? '<a class="btn kecil wa" target="_blank" rel="noopener" href="' + e(urlWa(x.wa, pesanRincian(x, [{ p: p, r: r }]))) + '">' + ikon('wa') + 'Tagihan</a>' : '') + '</span>' : '<span class="sub">tanpa WA</span>') + '</div>';
    }).join('') : '<div class="kosong">Belum ada kontak. Kontak terisi dari Data Badan Usaha atau data LENSA yang dipindah.</div>') + '</div>';
    if (r) h += '<div class="kartu"><h3>Rincian tunggakan · Rp ' + ang(r.totalTagihan) + '</h3>' + tabelRincian(r) + '<img class="gambar-rinci" alt="Rincian tagihan ' + e(p.npp) + '" src="' + gambarRincian(p, r) + '"><div class="aksi-baris"><button class="btn" data-a="unduhRinci" data-v="' + e(p.npp) + '">' + ikon('unduh') + 'Unduh gambar</button></div></div>';
    else h += '<div class="kartu kosong">Tidak ada tagihan: iuran sudah terbayar sampai bulan ini.</div>';
  }
  el.innerHTML = h + '</div>';
}

/* ================= AKSI ================= */
var AKSI = {
  tab: function (v) { UI.tab = v; UI.laci = null; render(); window.scrollTo(0, 0); },
  daftar: function (v) { var x = KLIK[v]; if (!x) return; UI.laci = { jenis: 'daftar', judul: x.judul, sub: x.sub, daftar: x.daftar }; renderLaci(); },
  pk: function (v) {
    var p = (S.data.pk || []).filter(function (x) { return String(x.npp) === String(v); })[0]; if (!p) return;
    UI.laci = { jenis: 'pk', judul: p.nama, sub: 'NPP ' + p.npp + ' / ' + (p.div || '000') + (p.kecamatan ? ' · ' + p.kecamatan : ''), p: p, kembali: UI.laci && UI.laci.jenis === 'daftar' ? UI.laci : null };
    renderLaci();
  },
  laciKembali: function () { UI.laci = UI.laci && UI.laci.kembali; renderLaci(); },
  tutupLaci: function () { UI.laci = null; renderLaci(); },
  saring: function (v) { UI.saringStatus = v; render(); },
  pilihBerkas: function () { $('#pilihBerkas').click(); },
  pilihCadangan: function () { $('#pilihCadangan').click(); },
  unduhCadangan: function () { unduhCadangan(); kabar('Cadangan diunduh. Simpan di tempat aman: berisi data PK dan kontak.', 4000); },
  hapusSemua: async function () { if (!confirm('Hapus semua data LENSA di perangkat ini? Spreadsheet LENSA PK tidak ikut terhapus.')) return; await hapusSemua(); S.data = null; render(); kabar('Data di perangkat ini dihapus.'); },
  unduhRinci: function (v) {
    var img = $('#laci img.gambar-rinci'); if (!img) return;
    var b = atob(img.src.split(',')[1]), u = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    unduhBlob(new Blob([u], { type: 'image/png' }), 'rincian_tagihan_' + v + '.png');
  }
};

async function prosesBerkas(files) {
  if (!files || !files.length) return;
  kabar('Membaca ' + files.length + ' file… mesin LENSA menghitung ulang', 6000);
  await new Promise(function (ok) { setTimeout(ok, 30); });
  try {
    var hasil = await imporBerkas(files);
    muatDataLensa();
    UI.tab = hasil.some(function (h) { return !h.ok; }) ? 'data' : UI.tab;
    render();
    kabar(hasil.filter(function (h) { return h.ok && !h.info; }).length + ' dari ' + hasil.filter(function (h) { return !h.info; }).length + ' file berhasil.', 4000);
  } catch (e) { kabar('Gagal: ' + e.message, 6000); }
}

function pasangPeristiwa() {
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-a]');
    if (!el || el.tagName === 'A') return;
    var f = AKSI[el.getAttribute('data-a')];
    if (f) { ev.preventDefault(); f(el.getAttribute('data-v'), el); }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && UI.laci) { UI.laci = null; renderLaci(); return; }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('[role="button"][data-a]')) { ev.preventDefault(); ev.target.click(); }
  });
  document.addEventListener('input', function (ev) {
    if (ev.target.getAttribute('data-in') === 'cari') {
      UI.cari = ev.target.value; var pos = ev.target.selectionStart; render();
      var i = $('[data-in="cari"]'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (x) { /* diam */ } }
    }
  });
  $('#laciLatar').addEventListener('click', function () { UI.laci = null; renderLaci(); });
  $('#pilihBerkas').addEventListener('change', function (ev) { var f = Array.prototype.slice.call(ev.target.files); ev.target.value = ''; prosesBerkas(f); });
  $('#pilihCadangan').addEventListener('change', async function (ev) {
    var f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
    try { await pulihkanCadangan(f); muatDataLensa(); render(); kabar('Cadangan dipulihkan.'); } catch (e) { kabar('Gagal: ' + e.message, 5000); }
  });
  ['dragover', 'drop'].forEach(function (t) {
    document.addEventListener(t, function (ev) {
      ev.preventDefault();
      if (t === 'drop' && ev.dataTransfer && ev.dataTransfer.files.length) prosesBerkas(Array.prototype.slice.call(ev.dataTransfer.files));
    });
  });
}

/* === 99-mulai.js === */
/* ---------------- mulai ---------------- */
async function mulai() {
  pasangPeristiwa();
  var ada = await muatPerangkat();
  GAS.setelahUbah = function () { /* simpan dilakukan setelah tiap proses selesai */ };
  if (ada) { try { muatDataLensa(); } catch (e) { kabar('Data di perangkat tidak terbaca: ' + e.message, 6000); } }
  render();
  daftarkanPwa();
}
function daftarkanPwa() {
  if (location.protocol !== 'https:') return;
  try {
    var m = document.createElement('link'); m.rel = 'manifest'; m.href = 'manifest.webmanifest'; document.head.appendChild(m);
    var a = document.createElement('link'); a.rel = 'apple-touch-icon'; a.href = 'ikon-192.png'; document.head.appendChild(a);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { /* diam */ });
  } catch (e) { /* diam */ }
}
window.LensaPK = { GAS: GAS, S: S, UI: UI, muatDataLensa: muatDataLensa, hitungDasbor: hitungDasbor, imporBerkas: imporBerkas, simpanSekarang: simpanSekarang };
mulai();

})();
</script>
