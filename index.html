<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; worker-src 'self'; manifest-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0E5A5F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="ikon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="ikon-192.png">
<link rel="apple-touch-icon" href="ikon-192.png">
<title>LENSA PK · BPJS Ketenagakerjaan KC Pamekasan</title>
<style>
:root{--biru:#1F3E8C;--biru2:#2B4FA8;--biruL:#E8ECF7;--teks:#1B2430;--pudar:#5B6470;--garis:#E2E5EA;--latar:#F4F5F7;--putih:#fff;
--hijau:#2F8A5B;--hijauL:#E3F2E9;--belum:#3F63B8;--belumL:#E8ECF7;--kuning:#A86B12;--kuningL:#FCF1DC;--merah:#BD3B33;--merahL:#F9E1DF;--wa:#1E9E55;
--r:12px;--bayang:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* Tampilan statis: halaman tidak boleh bergeser ke kanan-kiri (iPhone di dalam bingkai Apps Script). */
html{overflow-x:hidden;overscroll-behavior:none}
body{overflow-x:clip;overscroll-behavior:none} /* clip, bukan hidden: hidden membuat header lepas saat digulir. overscroll none: tanpa efek mantul di ujung atas/bawah */
/* Sentuhan: tanpa kilatan abu, tanpa menu tekan-lama di tombol/tautan, teks tombol tidak ikut terseleksi. */
a,button,.chip,.btn,.kartu,.item{-webkit-tap-highlight-color:transparent}
a.btn,button,.btn,.chip,.ikon-btn,nav.bawah,.tab-h,.aksi-bawah{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body{overflow-wrap:break-word}
html body{position:relative;padding-left:var(--kiri,0px);padding-right:var(--kanan,0px);box-sizing:border-box}
/* --kiri/--kanan: bagian bingkai Apps Script yang tidak tampak di layar iPhone (bingkai lebih lebar dari layar, atau
   halaman luar tergeser setelah keyboard). Isi dipaskan ke bagian yang tampak saja. */
.bawah,.aksi-bawah,.panel{left:var(--kiri,0px)!important;right:var(--kanan,0px)!important}
.toast{left:calc(var(--kiri,0px) + (100% - var(--kiri,0px) - var(--kanan,0px)) / 2)!important}
.menu-pop{right:calc(10px + var(--kanan,0px))!important}
html,body{margin:0;padding:0;background:var(--latar);color:var(--teks);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
a{color:var(--biru)}
.app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:84px;position:relative}
.app.memilih{padding-bottom:150px}
.atas{position:sticky;top:0;z-index:20;background:var(--biru);color:#fff;padding:10px 14px 10px 16px;display:flex;align-items:center;gap:8px}
.atas h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
.atas .sub{font-size:12px;opacity:.85;margin-top:1px}
.atas .isi{flex:1;min-width:0}
.ikon-btn{background:transparent;border:0;color:inherit;width:40px;height:40px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ikon-btn:active{background:rgba(255,255,255,.18)}
.ikon-btn svg,.btn svg{width:20px;height:20px;flex:none}
.muat-bar{height:3px;background:linear-gradient(90deg,transparent,#9AAAD3,transparent);background-size:200% 100%;animation:geser 1.1s linear infinite}
@keyframes geser{from{background-position:200% 0}to{background-position:-200% 0}}
main{padding:12px 12px 0}
.bawah{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--garis);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.bawah .dalam{display:flex;max-width:640px;width:100%}
.bawah button{flex:1;background:none;border:0;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--pudar);font-size:12px;cursor:pointer}
.bawah button svg{width:24px;height:24px}
.bawah button.aktif{color:var(--biru);font-weight:600}
.kartu{background:#fff;border-radius:var(--r);box-shadow:var(--bayang);padding:14px;margin-bottom:12px}
.judul-bagian{display:flex;align-items:baseline;justify-content:space-between;margin:18px 4px 8px}
.judul-bagian h2{font-size:15px;margin:0;font-weight:700}
.judul-bagian .ket{font-size:12px;color:var(--pudar)}
.kecil{font-size:12.5px;color:var(--pudar)}
.peringatan{background:var(--kuningL);color:#6B4A0C;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.angka-besar{font-size:30px;font-weight:700;line-height:1.1}
.bar{height:8px;background:var(--latar);border-radius:4px;overflow:hidden;display:flex;margin:10px 0 6px}
.bar i{display:block;height:100%}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.grid3 div{background:var(--latar);border-radius:10px;padding:8px 10px}
.grid3 b{display:block;font-size:17px}
.grid3 span{font-size:11.5px;color:var(--pudar)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.s-sudah{background:var(--hijauL);color:var(--hijau)}.s-belum{background:var(--belumL);color:var(--belum)}
.s-telat1{background:var(--kuningL);color:var(--kuning)}.s-telat2{background:var(--merahL);color:var(--merah)}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block;flex:none}
.d-sudah{background:var(--hijau)}.d-belum{background:var(--belum)}.d-telat1{background:#D99A2B}.d-telat2{background:var(--merah)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--garis);background:#fff;border-radius:10px;padding:9px 12px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--teks);min-height:40px}
.btn:active{filter:brightness(.95)}
.btn.utama{background:var(--biru);border-color:var(--biru);color:#fff}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.tipis{border:0;background:var(--biruL);color:var(--biru)}
.btn.bahaya{color:var(--merah)}
.btn[disabled]{opacity:.5;pointer-events:none}
.baris-btn{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.denda-lalu{display:flex;align-items:center;gap:8px;margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--kuningL);color:#5E430D}
.denda-lalu>div{flex:1;min-width:0}.denda-lalu .kecil{display:block;color:#7A5A1A}
.denda-lalu .btn{min-height:34px;padding:4px 12px;background:#fff}
.baris-btn .btn{flex:1}
.kontak .kepala{display:flex;align-items:flex-start;gap:10px}
.kontak .nama{font-weight:700}
.kontak ul{margin:6px 0 0;padding:0;list-style:none}
.kontak li{display:flex;align-items:center;gap:7px;font-size:13.5px;padding:6px 0;min-height:32px;box-sizing:border-box;cursor:pointer}
.kontak li span.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cek{width:40px;height:40px;border-radius:50%;border:2px solid #D3D9E2;background:linear-gradient(180deg,#fff,#F6F8FA);display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;
  color:#C3CAD4;box-shadow:inset 0 1px 2px rgba(16,24,40,.06);transition:background .2s,border-color .2s,box-shadow .2s,transform .12s;padding:0}
.cek svg{width:20px;height:20px;opacity:.55;transition:opacity .2s}
.cek:active{transform:scale(.9)}
.cek.on{background:linear-gradient(145deg,#3DCB80,#1E9B55);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(30,155,85,.35)}
.cek.on svg{opacity:1;animation:cekpop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes cekpop{0%{transform:scale(.3)}100%{transform:scale(1)}}
@media (hover:hover){.cek:not(.on):hover{border-color:#9FD9B8;color:#5FBF8B}}
.selesai{opacity:.55}
.kartu.kontak.selesai{opacity:1;background:#FAFBFC}.kartu.kontak.selesai .kepala>div:first-child,.kartu.kontak.selesai ul,.kartu.kontak.selesai .baris-btn{opacity:.55}
.tahap{background:var(--biruL);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.daftar{background:#fff;border-radius:var(--r);box-shadow:var(--bayang);overflow:hidden;margin-bottom:12px}
.item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--garis);cursor:pointer;min-height:56px}
.item:last-child{border-bottom:0}
.item:active{background:#F8F9FB}
.item .tengah{flex:1;min-width:0}
.item .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t2{font-size:12.5px;color:var(--pudar);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .kanan{text-align:right;flex:none}
.item .kanan .rp{font-size:12px;color:var(--pudar);margin-top:2px}
.strip{width:4px;align-self:stretch;border-radius:2px;flex:none}
.cari{position:sticky;top:60px;z-index:15;background:var(--latar);padding:2px 0 8px}
.kotak-cari{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--garis);border-radius:12px;padding:0 10px}
.kotak-cari input{border:0;outline:0;flex:1;padding:11px 0;background:transparent;min-width:0}
.kotak-cari svg{width:20px;height:20px;flex:none;color:var(--pudar)}
.chips{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--garis);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--biru);border-color:var(--biru);color:#fff}
.seg{display:flex;background:#E7E9EE;border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 4px;font-size:13px;cursor:pointer;color:var(--pudar)}
.seg button.on{background:#fff;color:var(--teks);font-weight:600;box-shadow:var(--bayang)}
.panel{position:fixed;inset:0;z-index:50;background:var(--latar);overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;-webkit-overflow-scrolling:touch}
.panel.baru{animation:masuk .16s ease-out}
.panel .dalam{max-width:640px;margin:0 auto;padding-bottom:110px;min-height:100%}
@keyframes masuk{from{transform:translateY(12px);opacity:.4}to{transform:none;opacity:1}}
.panel .atas{position:sticky}
.isi-panel{padding:12px}
.kepala-pk h2{font-size:19px;margin:0 0 2px;line-height:1.25}
.metrik{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.metrik div{background:var(--latar);border-radius:10px;padding:8px 10px;min-width:0}
.metrik b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.metrik span{font-size:11.5px;color:var(--pudar)}
.risiko{background:var(--kuningL);border-left:4px solid #D99A2B;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px}
.sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--pudar);margin:0 0 8px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:5px 10px;font-size:14px}
.kv .k{color:var(--pudar)}
.kv .v{min-width:0;overflow-wrap:anywhere}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--biruL);color:var(--biru);border-radius:999px;padding:3px 6px 3px 10px;font-size:13px;margin:0 6px 6px 0}
.tag button{border:0;background:transparent;color:inherit;width:22px;height:22px;border-radius:11px;cursor:pointer;font-size:15px;line-height:1}
.kontak-baris{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--garis)}
.kontak-baris:last-child{border-bottom:0}
.kontak-baris .tengah{flex:1;min-width:0}
.bulat{width:40px;height:40px;border-radius:20px;border:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex:none}
.bulat svg{width:20px;height:20px}
.bulat.wa{background:#E2F5EA;color:var(--wa)}.bulat.tel{background:var(--biruL);color:var(--biru)}.bulat.ubah{background:var(--latar);color:var(--pudar)}
.aksi-bawah{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--garis);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.aksi-bawah .dalam{max-width:640px;margin:0 auto;display:flex;gap:8px}
.aksi-bawah .btn{flex:1}
label.f{display:block;font-size:13px;color:var(--pudar);margin:12px 0 4px}
.inp{width:100%;border:1px solid #CDD2DA;border-radius:10px;padding:10px 12px;background:#fff;outline:0;box-sizing:border-box;min-width:0;max-width:100%}
/* iPhone: kolom tanggal/jam punya lebar bawaan sendiri dan teks di tengah; samakan dengan kolom lain. */
.inp[type=date],.inp[type=time]{-webkit-appearance:none;appearance:none;display:block;min-height:44px;line-height:1.2}
.inp::-webkit-date-and-time-value{text-align:left;margin:0}
.inp:focus{border-color:var(--biru);box-shadow:0 0 0 3px rgba(31,62,140,.12)}
textarea.inp{min-height:84px;resize:vertical}
.pilihan{display:flex;gap:6px;flex-wrap:wrap}
.cekbaris{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px}
.cekbaris input{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1B2430;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:90;max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.toast.galat{background:var(--merah)}
.kosong{text-align:center;color:var(--pudar);padding:28px 16px;font-size:14px}
.muat-penuh{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;color:var(--pudar);gap:14px;text-align:center;padding:20px}
.putar{width:34px;height:34px;border:3px solid var(--biruL);border-top-color:var(--biru);border-radius:50%;animation:putar .8s linear infinite}
@keyframes putar{to{transform:rotate(360deg)}}
.tile{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile button{background:#fff;border:0;border-radius:12px;box-shadow:var(--bayang);padding:11px 12px;text-align:left;cursor:pointer}
.tile b{display:block;font-size:19px}
.tile span{font-size:12.5px;color:var(--pudar)}
.grup-bar{height:6px;border-radius:3px;overflow:hidden;display:flex;background:var(--latar);margin-top:6px;width:100%}
.item.grup-k{display:block;padding:12px 14px}
.gk-atas{display:flex;gap:10px;align-items:flex-start}.gk-atas .tengah{flex:1;min-width:0}
.gk-pic{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--pudar);margin-top:2px;min-width:0}
.gk-pic span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gk-pic svg{width:14px;height:14px;flex:none}
.gk-kanan{flex:none;text-align:right;line-height:1.2}.gk-rp{display:block;font-size:14.5px;color:var(--merah);white-space:nowrap}.gk-kanan small{font-size:11px;color:var(--pudar)}
.gk-anggota{font-size:12px;color:var(--pudar);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:7px}
.gk-dll{color:var(--pudar);opacity:.8}.peringatan-usul{background:var(--kuningL);color:var(--kuning);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px;line-height:1.45}
.gk-plus{display:inline-block;font-weight:600;color:var(--biru);background:var(--biruL);border-radius:6px;padding:0 6px;margin-right:6px;font-size:11.5px}
.gk-bawah{display:flex;flex-wrap:wrap;align-items:center;gap:3px 12px;margin-top:8px;font-size:12.5px;color:var(--pudar)}
.gk-bawah b{color:var(--teks);font-weight:600}.gk-status{display:inline-flex;flex-wrap:wrap;gap:3px 10px;margin-left:auto}
.gk-st{display:inline-flex;align-items:center;gap:4px}.gk-st i{width:8px;height:8px;border-radius:50%;flex:none}
.grup-k .grup-bar{height:5px;margin-top:8px}
.deret-grup{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0 4px 8px;font-size:13px;color:var(--pudar)}.deret-grup b{color:var(--teks);font-size:15px}
.grup-bar i{display:block;height:100%}
.menu-pop{position:fixed;top:56px;right:10px;z-index:70;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(16,24,40,.18);min-width:220px;overflow:hidden}
.menu-pop button,.menu-pop a{display:block;width:100%;text-align:left;padding:13px 16px;border:0;background:#fff;cursor:pointer;font-size:14.5px;text-decoration:none;color:var(--teks)}
.menu-pop button:active{background:var(--latar)}
.tirai{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.18)}
.lainnya{display:block;width:100%;padding:12px;border:0;background:#fff;color:var(--biru);font-weight:600;cursor:pointer}
.komp{padding:10px 12px;border-bottom:1px solid var(--garis);font-size:13px;background:#FBFBFC}
.komp b{font-size:13.5px}
.mini-cek{width:24px;height:24px;border-radius:6px;border:2px solid #B8BFCA;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.mini-cek.on{background:var(--biru);border-color:var(--biru)}
.mini-cek svg{width:16px;height:16px}
.peta-link{font-size:13px}
.tbl-wrap{overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
table.rinci{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
table.rinci th,table.rinci td{border-bottom:1px solid var(--garis);padding:6px 4px;text-align:right;white-space:nowrap}
table.rinci th{font-size:11.5px;color:var(--pudar);font-weight:600}
table.rinci td:first-child,table.rinci th:first-child{text-align:left}
table.rinci tr.tot td{font-weight:700;border-top:2px solid var(--teks)}
.gambar-rinci{width:100%;border:1px solid var(--garis);border-radius:8px;display:block;margin-top:8px;background:#fff}
.total-besar{font-size:26px;font-weight:700;line-height:1.15}
.hari-label{font-size:12.5px;font-weight:700;color:var(--pudar);margin:14px 4px 6px;text-transform:uppercase;letter-spacing:.4px}
/* jadwal: kalender & warna jenis agenda */
.jadwal-atas{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.jadwal-atas .btn.utama{margin-left:auto}
.kal-kepala{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.kal-kepala b{font-size:17px;min-width:150px;text-align:center}
.kal-kepala .btn{min-height:36px;padding:4px 12px}
.kal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:#fff;border-radius:var(--r);box-shadow:var(--bayang);padding:8px}
.kal-h{font-size:11.5px;font-weight:700;color:var(--pudar);text-align:center;padding:2px 0 4px}
.kal-sel{min-height:56px;border:1px solid var(--garis);border-radius:8px;padding:3px 4px;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-width:0}
.kal-sel.kosong{border:0;cursor:default}
.kal-sel.libur{background:#FAFAFB}
.kal-sel.hari-ini .kal-t{background:var(--biru);color:#fff}
.kal-sel.dipilih{outline:2px solid var(--biru);outline-offset:-1px}
.kal-t{font-size:12px;font-weight:700;width:22px;height:22px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center}
.kal-ag{display:flex;align-items:center;gap:4px;min-width:0;font-size:11.5px;line-height:1.25;border-radius:5px;padding:1px 4px;background:color-mix(in srgb,var(--w) 14%,#fff);color:#1B2430;cursor:pointer}

/* Warna LENSA PK (aplikasi master): hijau-petrol tua + aksen emas — beda dari Monitor SPPG (biru #1F3E8C). */
:root{--biru:#0E5A5F;--biru2:#157A80;--biruL:#E1F0F0;--biruTua:#0A4347;--emas:#C9972B;--emasL:#F7EBCF;--garis2:#C9CED8;
  --huruf:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif}
html,body{font-family:var(--huruf)}
.inp:focus{box-shadow:0 0 0 3px rgba(14,90,95,.15)}
.target{background:linear-gradient(135deg,#0E5A5F,#1A8088);box-shadow:0 6px 18px rgba(14,90,95,.25)}
.kartu-templat.on{box-shadow:0 0 0 2px rgba(14,90,95,.18)}
.blast-baris.berikut{background:#EEF7F7}
.penanda button{border-color:#A9CDCF;background:#F1F8F8}
.merek-master{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:6px;background:var(--emas);color:#2B1E05;font-size:10.5px;font-weight:800;letter-spacing:.8px;vertical-align:4px}
nav.bawah .hanya-lebar,.merek-lebar,.status-lebar,.tutup-semua{display:none}
.menu-app{display:flex!important;align-items:center;gap:10px}.menu-app .ikon-app{width:24px;height:24px;border-radius:6px;flex:none}
.layar2{display:block}
nav.bawah button span{white-space:nowrap}

/* ---------- komputer/tablet (≥ 760 px): sama dengan Monitor SPPG. Menu kiri 232 px (≥1100) atau 86 px ikon (760–1099) ---------- */
:root{--sisi:232px}
@media (min-width:760px) and (max-width:1099px){:root{--sisi:86px}}
@media (min-width:760px){
  html body{padding-left:var(--sisi)!important;padding-right:0!important}
  /* isi di tengah, lebar maks 1320 px seperti Monitor */
  .app{max-width:1320px;margin:0 auto;padding:0 32px 48px;box-sizing:content-box}
  .app.memilih{padding-bottom:110px}
  main{padding:0}
  /* kepala halaman: judul besar di atas isi (bukan bilah berwarna) */
  .app>.atas{position:static;background:transparent;color:var(--teks);padding:26px 0 18px;gap:8px;align-items:flex-end}
  .app>.atas h1{font-size:26px;font-weight:700;letter-spacing:-.3px}
  .app>.atas .sub{font-size:15px;color:var(--pudar);opacity:1;margin-top:4px}
  .app>.atas .ikon-btn{width:auto;min-width:40px;height:40px;border-radius:10px;border:1px solid var(--garis2);background:#fff;color:var(--teks)}

      if (keAngka(x) !== null) angka++;
      if (/^[A-Z]{2}\d{6}$/i.test(x)) adaNpp = true;
      else if (/^\d{7,8}$/.test(x) && !/^(19|20)\d{2}(0[1-9]|1[0-2])([0-2]\d|3[01])$/.test(x)) adaNpp = true;
      else if (/^\d{1,2}[\-\/]\d{4}$/.test(x)) adaBlth = true;
      else if (/^\d{1,2}[\-\/]\d{1,2}[\-\/]\d{2,4}$/.test(x)) adaTgl = true;
    }
    return adaNpp || (adaBlth && adaTgl) || (adaBulan && angka >= 8);
  }

  function barisJudulKelompok(row) {
    var isi = row.filter(function (x) { return String(x || '').trim() !== ''; });
    if (isi.length < 2) return false;
    for (var i = 0; i < isi.length; i++) if (String(isi[i]).indexOf(':') >= 0) return false;
    return true;
  }

  function analisaGrid(grid, namaFile) {
    var semua = aliasSemua();
    var terbaik = -1, skorTerbaik = 0;
    var batas = Math.min(grid.length, 80);
    for (var r = 0; r < batas; r++) {
      var skor = 0;
      for (var c = 0; c < grid[r].length; c++) {
        var h = norm(grid[r][c]);
        if (h && semua[h]) skor++;
      }
      if (skor > skorTerbaik) { skorTerbaik = skor; terbaik = r; }
    }
    if (skorTerbaik < 3) {
      // judul kolom tidak dikenali: pakai baris tepat di atas data pertama, lalu andalkan urutan kolom
      terbaik = -2;
      for (var rr = 0; rr < batas; rr++) if (barisData(grid[rr])) { terbaik = rr - 1; break; }
      if (terbaik === -2) throw new Error('Judul kolom laporan tidak ditemukan dan tidak ada baris NPP. Pastikan file adalah hasil ekspor laporan sistem (CSV/XLSX).');
    }

    var mulai = -1;
    for (var r2 = terbaik + 1; r2 < grid.length; r2++) {
      if (barisData(grid[r2])) { mulai = r2; break; }
    }
    if (mulai < 0) throw new Error('Tidak ada baris data (NPP) di bawah judul kolom.');

    var atas = terbaik < 0 ? mulai : terbaik;
    for (var k = 1; k <= 4 && terbaik >= 0 && terbaik - k >= 0; k++) {
      if (barisJudulKelompok(grid[terbaik - k])) atas = terbaik - k;
      else break;
    }
    var lebar = 0;
    for (var r3 = atas; r3 < Math.min(grid.length, mulai + 5); r3++) lebar = Math.max(lebar, grid[r3].length);
    var bagian = [], gabung = [];
    for (var c2 = 0; c2 < lebar; c2++) {
      var p = [];
      for (var r4 = atas; r4 < mulai; r4++) {
        var t = norm(grid[r4][c2]);
        if (t) p.push(t);
      }
      bagian.push(p);
      gabung.push(p.join(' '));
    }
    var dataPertama = grid[mulai], lebarData = 0;
    for (var c3 = 0; c3 < dataPertama.length; c3++) if (String(dataPertama[c3]).trim() !== '') lebarData = c3 + 1;

    // teks di luar tabel (judul atas dan catatan bawah) untuk tanggal cetak, periode, pembina
    var luar = grid.slice(0, atas).map(function (x) { return x.join(' '); });
    for (var r5 = mulai; r5 < grid.length; r5++) {
      if (!barisData(grid[r5])) luar.push(grid[r5].join(' '));
    }
    var an = {
      kepala: terbaik, atas: atas, mulai: mulai, lebar: lebar, lebarData: lebarData,
      bagian: bagian, gabung: gabung, judulTeks: luar.join('\n'), namaFile: namaFile || ''
    };
    an.jenis = tebakJenis(gabung.join(' | '), namaFile);
    return an;
  }

  /** Aturan pengenal jenis laporan. Jenis yang tidak dipakai aplikasi ini: ditolak dengan pesannya (CFG.tolak) atau dilewati. */
  var ATURAN_JUDUL = [
    ['LENSA_STATUS', function (t) { return /kontak utama/.test(t) && /(status bayar|segmen)/.test(t); }],
    ['KPI084', function (t) { return /pkbu itw/.test(t) && /menunggak/.test(t); }],
    ['KPI085', function (t) { return /migrasi/.test(t) && /piutang/.test(t) && /pembina/.test(t); }],
    ['ITW_ITB', function (t) { return / koef/.test(t) && / itb /.test(t); }],
    ['ITW_ITB', function (t) { return /kecukupan ibr/.test(t) && /(blm posting|belum posting|penilaian)/.test(t); }],
    ['KARTU_IURAN', function (t) { return /blth iuran/.test(t) && /(tanggal|tgl) bayar/.test(t); }],
    ['IBR', function (t) { return (/jatuh tempo/.test(t) && /dibayar dimuka/.test(t)) || (/kode transaksi/.test(t) && / ijt /.test(t)); }],
    ['MONITORING', function (t) { return /(penambahan|pengurangan)/.test(t) && /aktif/.test(t); }],
    ['DATA_BU', function (t) { return /(nama ilo|kode ilo|rate jkk)/.test(t); }]
  ];
  var ATURAN_FILE = [
    ['KPI084', /kpi\s*_?084/], ['KPI085', /kpi\s*_?085/], ['LENSA_STATUS', /status.?pk/], ['ITW_ITB', /itw|itb/], ['KARTU_IURAN', /kartu/],
    ['MONITORING', /monitor/], ['DATA_BU', /badan.?usaha|dbu|data.?bu/], ['IBR', /ibr|belum.?rinci/]
  ];
  function dipakai(j) { return CFG.jenis.indexOf(j) >= 0; }
  function tebakJenis(teks, namaFile) {
    var t = ' ' + teks + ' ', i;
    for (i = 0; i < ATURAN_JUDUL.length; i++) {
      var a = ATURAN_JUDUL[i];
      if (!a[1](t)) continue;
      if (dipakai(a[0])) return a[0];
      if (CFG.tolak[a[0]]) throw new Error(CFG.tolak[a[0]]);
    }
    var f = String(namaFile || '').toLowerCase();
    for (i = 0; i < ATURAN_FILE.length; i++) if (dipakai(ATURAN_FILE[i][0]) && ATURAN_FILE[i][1].test(f)) return ATURAN_FILE[i][0];
    throw new Error('Jenis laporan tidak dikenali dari judul kolom maupun nama file.');
  }

  function cariKolom(an, alias, dipakai) {
    var m = String(alias).match(/^(.*?)(\*)?(?:#(\d+))?$/);
    var a = norm(m[1]), awalan = !!m[2], ke = m[3] ? +m[3] : 1, berurut = !!m[3];
    if (!a) return -1;
    var cocok = [], c;
    var sama = function (c) { return an.gabung[c] === a || an.bagian[c].indexOf(a) >= 0; };
    var memuat = function (c) { return (' ' + an.gabung[c] + ' ').indexOf(' ' + a + ' ') >= 0; };
    if (awalan) {
      for (c = 0; c < an.lebar; c++) {
        if (an.gabung[c].indexOf(a) === 0 || an.bagian[c].some(function (p) { return p.indexOf(a) === 0; })) cocok.push(c);
      }
      return cocok.length >= ke ? cocok[ke - 1] : -1;
    }
    // #n: kolom ke-n (urut kiri ke kanan) yang judulnya sama atau memuat alias
    if (berurut) {
      for (c = 0; c < an.lebar; c++) if (sama(c) || memuat(c)) cocok.push(c);
      return cocok.length >= ke ? cocok[ke - 1] : -1;
    }
    for (c = 0; c < an.lebar; c++) {
      if (dipakai[c]) continue;
      if (sama(c)) cocok.push(c);
    }
    if (!cocok.length) {
      for (c = 0; c < an.lebar; c++) {
        if (dipakai[c]) continue;
        if (memuat(c)) cocok.push(c);
      }
      cocok.sort(function (x, y) { return x - y; });
    }
    return cocok.length >= ke ? cocok[ke - 1] : -1;
  }

  function cocokTipe(tipe, x) {
    switch (tipe) {
      case 'bulat': return /^-?(\d{1,3}(,\d{3})+|\d+)$/.test(x);
      case 'angka': return keAngka(x) !== null;
      case 'desimal': var a = keAngka(x, true); return a !== null && a < 100;
      case 'digit': return /^[\d\s\-\+\(\)\/]{3,}$/.test(x) || rusakExcel(x);
      case 'ilo': return /^\d{3,5}$/.test(x);
      case 'blth': return !!keBlth(x) && !keTanggal(x) && !/^\d+$/.test(x);
      case 'tgl': return !!keTanggal(x);
      case 'teks': return /[A-Za-z]{2,}/.test(x) && !keBlth(x) && x.indexOf('@') < 0 && !/^(ya|tidak)$/i.test(x);
      case 'email': return x.indexOf('@') > 0;
      case 'npp': return !!rapikanNpp(x);
      case 'div': return /^\d{1,3}$/.test(x);
      case 'kode': return /^[A-Z]\d{2}$/i.test(x);
      case 'pembina': return /^[A-Z]{2}\d{6}/i.test(x) || (/[A-Za-z]{3,}/.test(x) && !keBlth(x));
      case 'yt': return /^(Y|T)$/i.test(x);
      case 'yatidak': return /^(YA|TIDAK|Y|T)$/i.test(x);
      case 'skala': return /^(B|Mn|K|Mi|MI|M)$/.test(x);
      case 'prog': return /^\dP$/i.test(x);
      case 'sipp': return /^(-|sipp|prs|sipp\/prs)$/i.test(x);
      case 'kelas': return !!kelasDariTeks(x);
    }
    return true;
  }

  function barisContoh(an, grid) {
    var out = [];
    for (var r = an.mulai; r < grid.length && out.length < 150; r++) if (barisData(grid[r])) out.push(grid[r]);
    return out;
  }

  function skorPeta(jenis, peta, contoh) {
    var def = pemetaan(jenis), wajib = {};
    def.forEach(function (d) { if (d.wajib) wajib[d.kolom] = true; });
    var total = 0, ok = true, buruk = [];
    Object.keys(peta).forEach(function (k) {
      var tipe = TIPE_KOLOM[k];
      if (!tipe) return;
      var isi = 0, pas = 0;
      contoh.forEach(function (row) {
        var x = String(row[peta[k]] === undefined ? '' : row[peta[k]]).trim();
        if (!x) return;
        isi++;
        if (cocokTipe(tipe, x)) pas++;
      });
      total += pas - (isi - pas);
      if (wajib[k] && (!isi || pas / isi < 0.8)) { ok = false; buruk.push(k); }
    });
    return { total: total, ok: ok, buruk: buruk };
  }

  function petakanIsi(jenis, contoh) {
    var urut = URUTAN_KOLOM[jenis];
    if (!urut || !contoh.length) return null;
    var lebar = 0;
    contoh.forEach(function (r) { lebar = Math.max(lebar, r.length); });
    var slot = [];
    for (var c = 0; c < lebar; c++) {
      if (contoh.some(function (r) { return String(r[c] === undefined ? '' : r[c]).trim() !== ''; })) slot.push(c);
    }
    var def = pemetaan(jenis), wajib = {};
    def.forEach(function (d) { if (d.wajib) wajib[d.kolom] = true; });
    var nilai = {};
    function skor(i, j) {
      var key = i + '|' + j;
      if (nilai[key] !== undefined) return nilai[key];
      var tipe = TIPE_KOLOM[urut[i]], isi = 0, pas = 0;
      contoh.forEach(function (r) {
        var x = String(r[slot[j]] === undefined ? '' : r[slot[j]]).trim();
        if (!x) return;
        isi++;
        if (!tipe || cocokTipe(tipe, x)) pas++;
      });
      return (nilai[key] = isi ? pas / isi : 0);
    }
    var n = urut.length, m = slot.length, NEG = -1e9;
    var dp = [], dari = [];
    for (var i = 0; i <= n; i++) { dp.push([]); dari.push([]); for (var j = 0; j <= m; j++) { dp[i].push(NEG); dari[i].push(''); } }
    dp[0][0] = 0;
    for (i = 0; i <= n; i++) {
      for (j = 0; j <= m; j++) {
        var v = dp[i][j];
        if (v === NEG) continue;
        if (i < n && j < m) { var a = v + skor(i, j); if (a > dp[i + 1][j + 1]) { dp[i + 1][j + 1] = a; dari[i + 1][j + 1] = 'p'; } }
        if (i < n) { var b = v - (wajib[urut[i]] ? 3 : SERING_KOSONG[urut[i]] ? 0.1 : 0.4); if (b > dp[i + 1][j]) { dp[i + 1][j] = b; dari[i + 1][j] = 'k'; } }
        if (j < m) { var d = v - 0.6; if (d > dp[i][j + 1]) { dp[i][j + 1] = d; dari[i][j + 1] = 's'; } }
      }
    }
    var peta = {};
    i = n; j = m;
    while (i > 0 || j > 0) {
      var arah = dari[i][j];
      if (arah === 'p') { peta[urut[i - 1]] = slot[j - 1]; i--; j--; }
      else if (arah === 'k') i--;
      else j--;
    }
    delete peta.no;
    return peta;
  }

  function petakanKolom(an, grid) {
    var contoh = grid ? barisContoh(an, grid) : [];
    var judul = null, galatJudul = null;
    try { judul = petakanJudul(an); } catch (e) { galatJudul = e; }
    if (!contoh.length || an.jenis === 'KPI084' || !URUTAN_KOLOM[an.jenis]) {
      if (galatJudul) throw galatJudul;
      return judul;
    }
    var sJudul = judul ? skorPeta(an.jenis, judul, contoh) : null;
    var isi = petakanIsi(an.jenis, contoh);
    var sIsi = isi ? skorPeta(an.jenis, isi, contoh) : null;
    if (sJudul && sJudul.ok && (!sIsi || !sIsi.ok || sIsi.total <= sJudul.total * 1.05)) return judul;
    if (sIsi && sIsi.ok) {
      an.posisi = false;
      an.menurutIsi = true;
      return isi;
    }
    if (galatJudul) throw galatJudul;
    throw new Error('Isi kolom tidak sesuai dengan laporan ' + NAMA_LAPORAN[an.jenis] + ' (kolom bermasalah: ' + ((sJudul && sJudul.buruk) || []).join(', ') +
      ').' + (CFG.saranPemetaan ? ' Kirim baris judul kolom file ini ke pengembang, atau sesuaikan tab PEMETAAN.' : ''));
  }

  function petakanJudul(an) {
    var def = pemetaan(an.jenis);
    var peta = {}, dipakai = {};
    def.forEach(function (d) {
      var c = -1;
      for (var i = 0; i < d.alias.length && c < 0; i++) c = cariKolom(an, d.alias[i], dipakai);
      if (c >= 0) { peta[d.kolom] = c; dipakai[c] = true; }
    });
    var kurang = def.filter(function (d) { return d.wajib && peta[d.kolom] === undefined; }).map(function (d) { return d.kolom; });
    if (kurang.length) {
      var urut = URUTAN_KOLOM[an.jenis];
      if (urut && (an.lebarData === urut.length || an.lebar === urut.length)) {
        peta = {};
        urut.forEach(function (k, i) { peta[k] = i; });
        kurang = [];
        an.posisi = true;
      }
    }
    if (kurang.length) {
      var judul = an.gabung.filter(String).join(' | ');
      throw new Error('Kolom wajib tidak ditemukan: ' + kurang.join(', ') + '. Judul kolom di file: ' + judul +
        '.' + (CFG.saranPemetaan ? ' Tambahkan judul yang sesuai di tab PEMETAAN (kolom judul_di_laporan).' : ''));
    }
    return peta;
  }

  /**
   * Baris kelompok "Pembina : AB123456 - NAMA" (laporan se-KC: satu kelompok per pembina, judul kolom berulang)
   * → kode pembina untuk baris-baris di bawahnya. 3C: untuk IBR; 3C.1: untuk semua jenis laporan ber-NPP.
   */
  var POLA_PEMBINA = /pembina\s*:?\s*([A-Z]{2}\d{6})/i;
  function ambilBaris(an, peta, grid) {
    var out = [], prev = null, pembinaGrup = '';
    for (var r0 = 0; r0 < an.mulai; r0++) { var m0 = (grid[r0] || []).join(' ').match(POLA_PEMBINA); if (m0) pembinaGrup = m0[1].toUpperCase(); }
    for (var r = an.mulai; r < grid.length; r++) {
      var row = grid[r];
      if (peta.npp !== undefined && !rapikanNpp(row[peta.npp])) {
        var mP = row.join(' ').match(POLA_PEMBINA);
        if (mP) pembinaGrup = mP[1].toUpperCase();
        if (an.jenis === 'IBR') continue; // judul kelompok, judul kolom berulang, jumlah
      }
      var o = {};
      Object.keys(peta).forEach(function (k) {
        var x = row[peta[k]];
        o[k] = x === undefined || x === null ? '' : String(x).trim();
      });
      if (an.jenis === 'KARTU_IURAN') {
        if (!/^\d/.test(o.blth_iuran) || !keBlth(o.blth_iuran)) continue;
        out.push(o);
        continue;
      }
      if (an.jenis === 'KPI084') {
        var bl = norm(o.bulan);
        if (!BULAN_SINGKAT[bl.slice(0, 3)] || !/^[a-z]+$/.test(bl)) continue;
        if (out.some(function (x) { return norm(x.bulan) === bl; })) break; // blok kedua (konsolidasi)
        out.push(o);
        continue;
      }
      var npp = rapikanNpp(o.npp);
      if (npp) {
        o.npp = npp;
        o.div = rapikanDiv(o.div);
        if (!o.pembina && pembinaGrup) o.pembina = pembinaGrup;
        out.push(o);
        prev = o;
        continue;
      }
      var isi = row.filter(function (x) { return String(x || '').trim() !== ''; });
      if (!isi.length) { prev = null; continue; }
      var adaTitikDua = isi.some(function (x) { return String(x).indexOf(':') >= 0 || /^-/.test(String(x).trim()); });
      if (prev && an.jenis === 'DATA_BU' && !adaTitikDua) {
        ['nama', 'nama_ilo', 'alamat', 'pic_nama', 'pic_jabatan'].forEach(function (k) {
          if (o[k]) prev[k] = (prev[k] ? prev[k] + ' ' : '') + o[k];
        });
        if (o.pic_email) prev.pic_email = (prev.pic_email || '') + o.pic_email;
      } else {
        prev = null;
      }
    }
    return out;
  }

  function tentukanPeriode(an) {
    var t = an.judulTeks || '', m, cetak = '';
    m = t.match(/(?:tanggal cetak|tgl\.? cetak|tanggal|tgl)\s*:?\s*(\d{1,2}[\-\/\.]\d{1,2}[\-\/\.]\d{2,4})/i);
    if (m) cetak = keTanggal(m[1]);
    if (!cetak) {
      m = t.match(/periode\s*:?\s*(\d{1,2}[\-\/\. ][a-z]{3}[a-z]*[\-\/\. ]\d{2,4})/i);
      if (m) cetak = keTanggal(m[1]);
    }
    if (!cetak) {
      var f = an.namaFile || '';
      m = f.match(/((?:19|20)\d{2})[\-_\.]?(0[1-9]|1[0-2])[\-_\.]?([0-2]\d|3[01])/);
      if (m) cetak = ymd(m[1], m[2], m[3]);
      else if ((m = f.match(/([0-2]\d|3[01])[\-_\.](0[1-9]|1[0-2])[\-_\.]((?:19|20)\d{2})/))) cetak = ymd(m[3], m[2], m[1]);
    }
    var dariJudul = !!cetak;
    var kini = CFG.hariIni();
    if (!cetak || cetak > kini) cetak = kini;
    var lap = '';
    m = t.match(/periode\s*:?\s*(\d{1,2}[\-\/]\d{4})(?!\d)/i);
    if (m) lap = keBlth(m[1]);
    var pembina = '', namaPembina = '';
    m = t.match(/pembina\s*:?\s*([A-Z]{2}\d{6})(?:\s*-\s*([A-Za-z][A-Za-z .,'\-]+))?/i);
    if (m) { pembina = m[1].toUpperCase(); namaPembina = m[2] ? judulKata(m[2].replace(/\s{2,}.*$/, '')) : ''; }
    return { tanggal: cetak, dariJudul: dariJudul, laporan: lap, pembina: pembina, namaPembina: namaPembina };
  }

  function cekPosisi(jenis, data) {
    var uji = {
      ITW_ITB: function (o) { return keBlth(o.periode_nilai) && keYT(o.itw) && keYT(o.itb); },
      MONITORING: function (o) { return (!o.blth_posting || keBlth(o.blth_posting)) && (!o.tgl_terima || keTanggal(o.tgl_terima)) && /^(B|Mn|K|Mi|MI|)$/.test(String(o.skala).trim()); },
      DATA_BU: function (o) { return keAngka(o.total_upah) !== null && (!o.blth_iuran || keBlth(o.blth_iuran)); },
      KARTU_IURAN: function (o) { return keTanggal(o.tgl_bayar) && keAngka(o.total_iuran) !== null; },
      KPI084: function (o) { return keAngka(o.pk_itw) !== null && keAngka(o.mig_itw) !== null; },
      KPI085: function (o) { return kelasDariTeks(o.kelas_lalu) && /^(YA|TIDAK|Y|T)$/i.test(String(o.migrasi).trim()); }
    }[jenis];
    if (!uji) return;
    var cocok = data.filter(uji).length;
    if (cocok < data.length * 0.9) {
      throw new Error('Judul kolom tidak dikenali dan isi kolom tidak sesuai urutan ' + NAMA_LAPORAN[jenis] + ' (' + cocok + ' dari ' + data.length +
        ' baris cocok).' + (CFG.saranPemetaan ? ' Tambahkan judul kolom yang dipakai file ini di tab PEMETAAN.' : ''));
    }
  }

  function ambilKpi084(grid) {
    var kunci = ['pk_itw', 'pk_lancar', 'pk_kurang_lancar', 'pk_diragukan', 'pk_macet', 'mig_itw', 'mig_lancar', 'mig_kurang_lancar', 'mig_diragukan',
      'cap_itw', 'cap_lancar', 'cap_kurang_lancar', 'cap_diragukan', 'rata_itw', 'rata_lancar', 'rata_kurang_lancar', 'rata_diragukan', 'bobot', 'skor'];
    var out = [], lihat = {};
    grid.forEach(function (row) {
      for (var c = 0; c < row.length; c++) {
        var x = norm(row[c]);

rgin:12px 0 4px}\n.kolom>.label:first-child{margin-top:0}\n.inp{width:100%;font:inherit;font-size:15px;border:1px solid var(--garis);border-radius:10px;padding:9px 12px;background:#fff;color:inherit}\n.inp:disabled{background:var(--latar);color:#36404E}\ntextarea.isi{min-height:260px;resize:vertical;font-size:14.5px;line-height:1.5}\n.dua{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.penanda{display:flex;flex-wrap:wrap;gap:6px}\n.penanda button{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;border:1px dashed #B8C6CF;background:#F7FAFB;color:var(--gelap);border-radius:8px;padding:5px 8px;min-height:32px;cursor:pointer}\n.penanda button:hover{border-style:solid;border-color:var(--utama2)}\n.kepala-kecil{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}\n.kepala-kecil .label{margin:0}\n.pratinjau{white-space:pre-wrap;word-break:break-word;background:#E7F6E9;border:1px solid #CBE7CF;border-radius:12px 12px 12px 2px;padding:12px 14px;font-size:14px;line-height:1.5;max-height:560px;overflow:auto}\n.peringatan{margin:10px 0;padding-left:18px;font-size:13px;color:#8A6110}\n.bawah{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--garis)}\n.isi-lebar{flex:1}\n@media (max-width:600px){.daftar{grid-template-columns:1fr}.dua{grid-template-columns:1fr}.bawah .btn{flex:1 1 auto}}\n";

var _SS = null;
/** Spreadsheet LENSA PK. Di aplikasi HP dan pemicu otomatis dibuka lewat ID yang disimpan saat spreadsheet pernah dibuka. */
function ss_() {
  if (_SS) return _SS;
  var a = null;
  try { a = SpreadsheetApp.getActiveSpreadsheet(); } catch (e) { a = null; }
  var prop = null;
  try { prop = PropertiesService.getScriptProperties(); } catch (e) { prop = null; }
  if (a) {
    try { if (prop && prop.getProperty('ID_SS') !== a.getId()) prop.setProperty('ID_SS', a.getId()); } catch (e) { /* diam */ }
    return (_SS = a);
  }
  var id = prop ? prop.getProperty('ID_SS') : '';
  if (!id) throw new Error('Spreadsheet LENSA PK belum dikenali. Buka spreadsheet LENSA PK sekali di laptop, lalu muat ulang aplikasi.');
  return (_SS = SpreadsheetApp.openById(id));
}

function ui_() {
  try { return SpreadsheetApp.getUi(); } catch (e) { return null; }
}

function kabar_(pesan, judul) {
  var ui = ui_();
  if (ui) ui.alert(judul || 'LENSA PK', pesan, ui.ButtonSet.OK);
  else Logger.log(pesan);
}

function toast_(pesan) {
  try { ss_().toast(pesan, 'LENSA PK', 6); } catch (e) { /* diam */ }
}

function kolomSkema_(nama) {
  var s = SKEMA[nama];
  if (!s || !s.kolom) return [];
  return s.kolom.split(/\s+/).map(function (x) {
    var p = x.split(':');
    return { nama: p[0], tipe: p[1] || 't' };
  });
}

function tipeKolom_(nama) {
  var t = {};
  kolomSkema_(nama).forEach(function (k) { t[k.nama] = k.tipe; });
  return t;
}

function lembar_(nama) {
  var sh = ss_().getSheetByName(nama);
  if (!sh) throw new Error('Tab ' + nama + ' belum ada. Jalankan menu LENSA PK › Siapkan / perbaiki database.');
  return sh;
}

/** Membaca satu tab menjadi daftar objek berdasarkan judul kolom di baris 1. */
function bacaTab_(nama) {
  var sh = lembar_(nama);
  var lr = sh.getLastRow(), lc = sh.getLastColumn();
  if (lr < 1 || lc < 1) return { kepala: [], data: [] };
  var v = sh.getRange(1, 1, lr, lc).getValues();
  var kepala = v[0].map(function (h) { return String(h).trim(); });
  var data = [];
  for (var i = 1; i < v.length; i++) {
    var baris = v[i], kosong = true, o = {};
    for (var j = 0; j < kepala.length; j++) {
      if (!kepala[j]) continue;
      var x = baris[j];
      if (x !== '' && x !== null && x !== undefined) kosong = false;
      o[kepala[j]] = (x === null || x === undefined) ? '' : x;
    }
    if (!kosong) { o._baris = i + 1; data.push(o); }
  }
  return { kepala: kepala, data: data };
}

function kepalaTab_(sh) {
  var lc = Math.max(sh.getLastColumn(), 1);
  return sh.getRange(1, 1, 1, lc).getValues()[0].map(function (h) { return String(h).trim(); });
}

function nilaiTulis_(v, tipe) {
  if (v === undefined || v === null) return '';
  if (tipe === 'd') {
    if (v instanceof Date) return v;
    if (v === '') return '';
    var s = keTanggal_(v);
    return s ? tglKeDate_(s) : String(v);
  }
  if (tipe === 'n' || tipe === 'r' || tipe === 'p') {
    if (v === '' || typeof v === 'number') return v;
    var a = keAngka_(v, true);
    return a === null ? '' : a;
  }
  if (v instanceof Date) return fmt_(v, 'yyyy-MM-dd');
  if (tipe === 't' && typeof v === 'number') return String(v);
  return v;
}

function barisDariObjek_(kepala, tipe, o) {
  return kepala.map(function (h) { return h ? nilaiTulis_(o[h], tipe[h]) : ''; });
}

function pastikanBaris_(sh, n) {
  var maks = sh.getMaxRows();
  if (maks < n) sh.insertRowsAfter(maks, n - maks + 50);
}

/** Menulis ulang seluruh baris data sebuah tab. Kolom tambahan buatan petugas tetap dipertahankan. */
function tulisTab_(nama, data) {
  var sh = lembar_(nama);
  var kepala = kepalaTab_(sh), tipe = tipeKolom_(nama), lc = kepala.length;
  var rows = data.map(function (o) { return barisDariObjek_(kepala, tipe, o); });
  var lr = sh.getLastRow();
  if (lr > 1) sh.getRange(2, 1, lr - 1, lc).clearContent();
  if (rows.length) {
    pastikanBaris_(sh, rows.length + 1);
    sh.getRange(2, 1, rows.length, lc).setValues(rows);
  }
}

function tambahBaris_(nama, data) {
  if (!data || !data.length) return;
  var sh = lembar_(nama);
  var kepala = kepalaTab_(sh), tipe = tipeKolom_(nama);
  var rows = data.map(function (o) { return barisDariObjek_(kepala, tipe, o); });
  var awal = sh.getLastRow() + 1;
  pastikanBaris_(sh, awal + rows.length - 1);
  sh.getRange(awal, 1, rows.length, kepala.length).setValues(rows);
}

/** Mengubah beberapa sel pada baris tertentu (o._baris) tanpa menulis ulang tab. */
function ubahSel_(nama, o, kolom) {
  var sh = lembar_(nama);
  var kepala = kepalaTab_(sh), tipe = tipeKolom_(nama);
  kolom.forEach(function (k) {
    var c = kepala.indexOf(k);
    if (c >= 0 && o._baris) sh.getRange(o._baris, c + 1).setValue(nilaiTulis_(o[k], tipe[k]));
  });
}

/* ------------------------- teks & angka ------------------------- */

function pad2_(n) { n = String(n); return n.length < 2 ? '0' + n : n; }
function pad4_(n) { n = String(n); while (n.length < 4) n = '0' + n; return n; }

function norm_(s) {
  return String(s === null || s === undefined ? '' : s).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}

/** Nama lapangan boleh lebih dari satu, dipisah koma / titik koma ("UNIRA, UNI"). Yang pertama = nama tampilan; semuanya ikut dicari. */
function daftarNamaLapangan_(s) {
  return String(s === null || s === undefined ? '' : s).split(/[,;]+/).map(function (x) { return x.replace(/\s+/g, ' ').trim(); }).filter(Boolean);
}
function namaUtama_(s) { return daftarNamaLapangan_(s)[0] || ''; }

function normCari_(s) {
  return String(s === null || s === undefined ? '' : s).toLowerCase()
    .replace(/[^a-z0-9]+/g, ' ')
    .replace(/\b(pt|cv|ud|pr|tbk|persero)\b/g, ' ')
    .replace(/\s+/g, ' ').trim();
}

function judulKata_(s) {
  return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim()
    .replace(/(^|[\s\-\.\(\/'])([a-z])/g, function (m, a, b) { return a + b.toUpperCase(); });
}

function keAngka_(v, desimal) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  var s = String(v).trim().replace(/\s/g, '').replace(/^rp\.?/i, '');
  if (!s || s === '-' || s === '--') return null;
  var neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s.charAt(0) === '-') { neg = true; s = s.slice(1); }
  var titik = s.indexOf('.') >= 0, koma = s.indexOf(',') >= 0;
  if (titik && koma) {
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/,/g, '');
  } else if (koma) {
    if (/^\d{1,3}(,\d{3})+$/.test(s) && !desimal) s = s.replace(/,/g, '');
    else if (/^\d{1,3}(,\d{3}){2,}$/.test(s)) s = s.replace(/,/g, '');
    else s = s.replace(',', '.');
  } else if (titik) {
    if (/^\d{1,3}(\.\d{3})+$/.test(s) && !desimal) s = s.replace(/\./g, '');
    else if (/^\d{1,3}(\.\d{3}){2,}$/.test(s)) s = s.replace(/\./g, '');
  }
  if (!/^\d*\.?\d+$/.test(s)) return null;
  var n = parseFloat(s);
  return neg ? -n : n;
}

function bulat_(v) {
  var a = keAngka_(v);
  return a === null ? null : Math.round(a);
}

function tahun4_(y) { y = String(y); return y.length === 2 ? (+y > 50 ? '19' : '20') + y : y; }

function ymd_(y, m, d) {
  y = +y; m = +m; d = +d;
  if (!y || m < 1 || m > 12 || d < 1 || d > 31) return '';
  return y + '-' + pad2_(m) + '-' + pad2_(d);
}

/** Tanggal apa pun → 'YYYY-MM-DD' ('' bila tidak terbaca). */
function keTanggal_(v) {
  if (v === null || v === undefined || v === '') return '';
  if (v instanceof Date) return isNaN(v.getTime()) ? '' : fmt_(v, 'yyyy-MM-dd');
  if (typeof v === 'number') {
    if (v > 20000 && v < 80000) {
      var d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000);
      return ymd_(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
    }
    return '';
  }
  var s = String(v).trim().toLowerCase().replace(/[t\s]+\d{1,2}[:.]\d{2}([:.]\d{2})?.*$/, '');
  var m;
  if ((m = s.match(/^(\d{4})[\-\/\.](\d{1,2})[\-\/\.](\d{1,2})$/))) return ymd_(m[1], m[2], m[3]);
  if ((m = s.match(/^(\d{1,2})[\-\/\.](\d{1,2})[\-\/\.](\d{2}|\d{4})$/))) return ymd_(tahun4_(m[3]), m[2], m[1]);
  if ((m = s.match(/^(\d{1,2})[\-\/\. ]([a-z]{3})[a-z]*[\-\/\. ](\d{2}|\d{4})$/))) {
    var b = BULAN_SINGKAT[m[2]];
    if (b) return ymd_(tahun4_(m[3]), b, m[1]);
  }
  return '';
}

/** Bulan-tahun apa pun → 'YYYY-MM' ('' bila tidak terbaca). */
function keBlth_(v) {
  if (v === null || v === undefined || v === '') return '';
  if (v instanceof Date) return isNaN(v.getTime()) ? '' : fmt_(v, 'yyyy-MM');
  var s = String(v).trim().toLowerCase();
  var m, bln;
  if ((m = s.match(/^(\d{1,2})[\-\/\.](\d{4})$/))) bln = [m[2], m[1]];
  else if ((m = s.match(/^(\d{4})[\-\/\.](\d{1,2})$/))) bln = [m[1], m[2]];
  else if ((m = s.match(/^([a-z]{3})[a-z]*[\-\/\. ](\d{2}|\d{4})$/)) && BULAN_SINGKAT[m[1]]) bln = [tahun4_(m[2]), BULAN_SINGKAT[m[1]]];
  else if ((m = s.match(/^((?:19|20)\d{2})(0[1-9]|1[0-2])$/))) bln = [m[1], m[2]];
  else if ((m = s.match(/^(0[1-9]|1[0-2])((?:19|20)\d{2})$/))) bln = [m[2], m[1]];
  if (bln) {
    var bb = +bln[1];
    return (bb >= 1 && bb <= 12) ? bln[0] + '-' + pad2_(bb) : '';
  }
  var t = keTanggal_(v);
  return t ? t.slice(0, 7) : '';
}

function keYT_(v) {
  var s = String(v === null || v === undefined ? '' : v).trim().toUpperCase();
  if (/^(Y|YA|YES|TRUE|1)$/.test(s)) return 'Y';
  if (/^(T|TIDAK|N|NO|FALSE|0)$/.test(s)) return 'T';
  return '';
}

function rapikanNpp_(v) {
  var s = String(v === null || v === undefined ? '' : v).trim().toUpperCase().replace(/^'/, '').replace(/\s/g, '');
  if (/^\d+\.0+$/.test(s)) s = s.replace(/\.0+$/, '');
  if (/^\d{7}$/.test(s)) s = '0' + s;
  return /^[A-Z]{2}\d{6}$|^\d{8}$/.test(s) ? s : '';
}

function rapikanDiv_(v) {
  var s = String(v === null || v === undefined ? '' : v).trim().replace(/^'/, '').replace(/\.0+$/, '');
  if (!s) return '000';
  return /^\d{1,3}$/.test(s) ? ('000' + s).slice(-3) : s;
}

/** Angka yang diubah Excel ke notasi ilmiah (6.28233E+12): digit aslinya sudah hilang. */
function rusakExcel_(v) { return /^\s*\d+(\.\d+)?e\+?\d+\s*$/i.test(String(v === null || v === undefined ? '' : v)); }

function normHp_(v) {
  if (rusakExcel_(v)) return '';
  var s = String(v === null || v === undefined ? '' : v).replace(/\.0+$/, '').replace(/[^\d]/g, '');
  if (!s) return '';
  if (s.indexOf('62') === 0) return s;
  if (s.charAt(0) === '0') return '62' + s.slice(1);
  if (s.charAt(0) === '8') return '62' + s;
  return s;
}

function hpSeluler_(v) {
  var n = normHp_(v);
  return /^628\d{7,11}$/.test(n) ? n : '';
}

function hpTampil_(v) {
  var n = normHp_(v);
  return n.indexOf('62') === 0 ? '0' + n.slice(2) : n;
}

function lev1_(a, b) {
  if (a === b) return true;
  if (a.length === b.length) {
    var beda = [];
    for (var k = 0; k < a.length && beda.length < 3; k++) if (a.charAt(k) !== b.charAt(k)) beda.push(k);
    if (beda.length === 2 && beda[1] === beda[0] + 1 && a.charAt(beda[0]) === b.charAt(beda[1]) && a.charAt(beda[1]) === b.charAt(beda[0])) return true;
  }
  var la = a.length, lb = b.length;
  if (Math.abs(la - lb) > 1) return false;
  var i = 0, j = 0, beda = 0;
  while (i < la && j < lb) {
    if (a.charAt(i) === b.charAt(j)) { i++; j++; continue; }
    if (++beda > 1) return false;
    if (la > lb) i++;
    else if (lb > la) j++;
    else { i++; j++; }
  }
  return beda + (la - i) + (lb - j) <= 1;
}

function rupiah_(n) {
  n = Math.round(n || 0);
  return 'Rp ' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function rupiahRingkas_(n) {
  n = n || 0;
  if (n >= 1e9) return 'Rp ' + (Math.round(n / 1e8) / 10).toString().replace('.', ',') + ' M';
  if (n >= 1e6) return 'Rp ' + (Math.round(n / 1e5) / 10).toString().replace('.', ',') + ' jt';
  return rupiah_(n);
}

function persen_(a, b) { return b ? Math.round(a / b * 100) : 0; }

/* ---------------------------- tanggal ---------------------------- */

function fmt_(d, pola) { return Utilities.formatDate(d, TZ, pola); }
function hariIniStr_() { return _HARI_INI_UJI || fmt_(new Date(), 'yyyy-MM-dd'); }
function sekarangStr_() { return fmt_(new Date(), 'yyyy-MM-dd HH:mm'); }
function jamStr_() { return fmt_(new Date(), 'HH:mm'); }

function tglKeDate_(s) {
  var p = String(s).split('-');
  return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]) - 7 * 3600000);
}

function tglJamKeDate_(s, jam) {
  var p = String(s).split('-'), j = String(jam || '00:00').split(/[:.]/);
  return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2], +j[0] || 0, +j[1] || 0) - 7 * 3600000);
}

function jamRapi_(v) {
  if (v instanceof Date) return fmt_(v, 'HH:mm');
  var m = String(v || '').trim().match(/^(\d{1,2})[:.](\d{2})/);
  return m ? pad2_(m[1]) + ':' + m[2] : '';
}

function mIdx_(blth) {
  if (!blth) return null;
  var p = String(blth).split('-');
  if (p.length < 2) return null;
  return (+p[0]) * 12 + (+p[1]) - 1;
}

function blthDariIdx_(i) { return Math.floor(i / 12) + '-' + pad2_(i % 12 + 1); }

function hariDalamBulan_(blth) {
  var p = blth.split('-');
  return new Date(Date.UTC(+p[0], +p[1], 0)).getUTCDate();
}

function hariMinggu_(s) {
  var p = s.split('-');
  return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay();
}

function tambahHari_(s, n) {
  var p = s.split('-');
  var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n));
  return ymd_(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
}

function tambahBulan_(s, n) {
  var p = s.split('-');
  var i = (+p[0]) * 12 + (+p[1]) - 1 + n;
  var blth = blthDariIdx_(i);
  return blth + '-' + pad2_(Math.min(+p[2], hariDalamBulan_(blth)));
}

function selisihHari_(a, b) {
  var pa = a.split('-'), pb = b.split('-');
  return Math.round((Date.UTC(+pb[0], +pb[1] - 1, +pb[2]) - Date.UTC(+pa[0], +pa[1] - 1, +pa[2])) / 86400000);
}

function namaBulan_(blth) {
  var p = String(blth).split('-');
  return NAMA_BULAN[+p[1] - 1] + ' ' + p[0];
}

function tglPanjang_(s) {
  var p = s.split('-');
  return NAMA_HARI[hariMinggu_(s)] + ', ' + (+p[2]) + ' ' + NAMA_BULAN[+p[1] - 1] + ' ' + p[0];
}

/** Salam sesuai jam WIB: pagi (<11), siang (<15), sore (<18), malam. */
function salamWaktu_(d) {
  var j = +Utilities.formatDate(d || new Date(), TZ, 'HH');
  return j < 11 ? 'Selamat pagi' : j < 15 ? 'Selamat siang' : j < 18 ? 'Selamat sore' : 'Selamat malam';
}
function isiSalam_(t, d) { return String(t || '').replace(/\{salam\}/g, salamWaktu_(d)); }

/** Tautan WhatsApp. Memakai api.whatsapp.com/send (bukan wa.me) agar emoji di pesan tetap utuh saat dibuka. */
function urlWa_(no, pesan) {
  return no ? 'https://api.whatsapp.com/send?phone=' + no + (pesan ? '&text=' + encodeURIComponent(isiSalam_(pesan)) : '') : '';
}

function tglSedang_(s) {
  var p = s.split('-');
  return (+p[2]) + ' ' + NAMA_BULAN[+p[1] - 1] + ' ' + p[0];
}

function tglPendek_(s) {
  if (!s) return '';
  var p = s.split('-');
  return (+p[2]) + ' ' + NAMA_BULAN_PENDEK[+p[1] - 1];
}

function tglIndo_(s) {
  if (!s) return '';
  var p = s.split('-');
  return p[2] + '-' + p[1] + '-' + p[0];
}

function setLibur_() {
  var set = {};
  String(P_('libur') || '').split(/[,;\n]+/).forEach(function (x) {
    var t = keTanggal_(x.trim());
    if (t) set[t] = true;
  });

}

function hariKerja_(s, libur) {
  var h = hariMinggu_(s);
  return h !== 0 && h !== 6 && !(libur || {})[s];
}

function jumlahHariKerja_(dari, sampai, libur) {
  var n = 0, s = dari;
  for (var i = 0; i < 400 && s <= sampai; i++) {
    if (hariKerja_(s, libur)) n++;
    s = tambahHari_(s, 1);
  }
  return n;
}

function geserKeHariKerja_(s, libur) {
  for (var i = 0; i < 14 && !hariKerja_(s, libur); i++) s = tambahHari_(s, 1);
  return s;
}

function tanggalBulan_(blth, hari) {
  return blth + '-' + pad2_(Math.min(Math.max(1, Math.round(hari)), hariDalamBulan_(blth)));
}

/* -------------------------- pengaturan -------------------------- */

var _PGT = null;

function muatPengaturan_() {
  _PGT = {};
  DEF_PENGATURAN.forEach(function (d) { _PGT[d[0]] = d[1]; });
  try {
    bacaTab_('PENGATURAN').data.forEach(function (o) {
      var k = String(o.kunci || '').trim();
      if (k) _PGT[k] = (o.nilai === null || o.nilai === undefined) ? '' : String(o.nilai);
    });
  } catch (e) { /* tab belum ada */ }
  return _PGT;
}

function P_(k) {
  if (!_PGT) muatPengaturan_();
  var v = _PGT[k];
  return v === undefined || v === null ? '' : v;
}

function Pn_(k) {
  var a = keAngka_(P_(k), true);
  if (a !== null) return a;
  for (var i = 0; i < DEF_PENGATURAN.length; i++) if (DEF_PENGATURAN[i][0] === k) return keAngka_(DEF_PENGATURAN[i][1], true) || 0;
  return 0;
}

function setPengaturan_(k, v, ket) {
  var t = bacaTab_('PENGATURAN');
  for (var i = 0; i < t.data.length; i++) {
    if (String(t.data[i].kunci).trim() === k) {
      t.data[i].nilai = String(v);
      ubahSel_('PENGATURAN', t.data[i], ['nilai']);
      if (_PGT) _PGT[k] = String(v);
      return;
    }
  }
  tambahBaris_('PENGATURAN', [{ kunci: k, nilai: String(v), keterangan: ket || '' }]);
  if (_PGT) _PGT[k] = String(v);
}

function umkTahun_(th) {
  for (var y = th; y >= th - 10; y--) {
    var v = keAngka_(P_('umk_' + y), true);
    if (v) return { tahun: y, nilai: v };
  }
  return null;
}

/* ------------------------------ ID ------------------------------ */

function idBerikut_(awalan, daftar) {
  var maks = 0, re = new RegExp('^' + awalan + '(\\d+)$');
  daftar.forEach(function (x) {
    var m = String(x || '').match(re);
    if (m) maks = Math.max(maks, +m[1]);
  });
  return function () { maks++; return awalan + pad4_(maks); };
}

var _urutId = 0;
function idWaktu_(awalan) {
  _urutId++;
  return awalan + fmt_(new Date(), 'yyMMddHHmmss') + pad2_(_urutId % 100);
}


/* ---------------- APP_DATA: data siap pakai untuk aplikasi HP ---------------- */

function simpanAppData_(kunci, obj) {
  var t = bacaTab_('APP_DATA');
  var rows = t.data.filter(function (o) { return String(o.kunci) !== kunci; })
    .map(function (o) { return { kunci: o.kunci, bagian: o.bagian, isi: o.isi, dibuat: o.dibuat }; });
  if (obj !== null && obj !== undefined) {
    var s = JSON.stringify(obj), n = 0, waktu = sekarangStr_();
    for (var i = 0; i < s.length; i += 32000) rows.push({ kunci: kunci, bagian: ++n, isi: s.slice(i, i + 32000), dibuat: waktu }); // 1.25: < 32.767 (batas Excel) agar cadangan .xlsx utuh
  }
  tulisTab_('APP_DATA', rows);
}

function bacaAppData_(kunci) {
  try {
    var b = bacaTab_('APP_DATA').data.filter(function (o) { return String(o.kunci) === kunci; })
      .sort(function (a, c) { return angka_(a.bagian) - angka_(c.bagian); });
    if (!b.length) return null;
    return JSON.parse(b.map(function (o) { return String(o.isi); }).join(''));
  } catch (e) { return null; }
}

function siapkanDatabase() {

  isiAwal_();

  kabar_('Database siap: ' + URUTAN_TAB.length + ' tab.\n\nLangkah berikutnya: menu LENSA PK › Impor laporan dari komputer. ' +
    'Urutan pertama kali: Data Badan Usaha, lalu Monitoring, lalu ITW/ITB.');
}

/** Lokal Indonesia: tanggal diketik 10/11/2026 dibaca 10 November, angka 1.234.567. */
function aturLokal_(ss) {
  ['id_ID', 'in_ID'].some(function (l) {
    try {
      ss.setSpreadsheetLocale(l);
      return /^(id|in)/.test(String(ss.getSpreadsheetLocale()));
    } catch (e) { return false; }
  });
}

function siapkanTab_(ss, nama, idx) {
  var sk = SKEMA[nama];
  var sh = ss.getSheetByName(nama);
  if (!sh) sh = ss.insertSheet(nama, Math.min(idx, ss.getSheets().length));
  sh.setTabColor(WARNA_TAB[sk.jenis]);
  if (sk.bebas) {
    var lb = sk.lebar || 11;
    if (sh.getMaxColumns() < lb) sh.insertColumnsAfter(sh.getMaxColumns(), lb - sh.getMaxColumns());
    return sh;
  }
  var kol = kolomSkema_(nama);
  var lc = sh.getLastColumn();
  var kepala = lc ? sh.getRange(1, 1, 1, lc).getValues()[0].map(function (h) { return String(h).trim(); }) : [];
  // tab yang selalu dihitung ulang: susunan kolom mengikuti skema terbaru
  if (sk.regenerasi && kepala.join('|') !== kol.map(function (k) { return k.nama; }).join('|')) {
    sh.getRange(1, 1, sh.getMaxRows(), sh.getMaxColumns()).clear();
    kepala = [];
  }
  var terisi = kepala.filter(function (h) { return h; }).length;
  var baru;
  if (!terisi) baru = kol.map(function (k) { return k.nama; });
  else {
    var ada = {};
    kepala.forEach(function (h) { ada[h] = true; });
    baru = kepala.concat(kol.filter(function (k) { return !ada[k.nama]; }).map(function (k) { return k.nama; }));
    while (baru.length && !baru[baru.length - 1]) baru.pop();
  }
  if (sh.getMaxColumns() < baru.length) sh.insertColumnsAfter(sh.getMaxColumns(), baru.length - sh.getMaxColumns());
  var batasKanan = Math.max(baru.length, sh.getLastColumn());
  if (sh.getMaxColumns() > batasKanan && batasKanan > 0) sh.deleteColumns(batasKanan + 1, sh.getMaxColumns() - batasKanan);
  if (sh.getMaxRows() < 200) sh.insertRowsAfter(sh.getMaxRows(), 200 - sh.getMaxRows());
  sh.getRange(1, 1, 1, baru.length).setValues([baru]).setFontWeight('bold')
    .setBackground(WARNA.latarBiru).setFontColor(WARNA.teks);
  sh.setFrozenRows(1);

  var maksR = sh.getMaxRows();
  var tipe = tipeKolom_(nama);
  baru.forEach(function (h, i) {
    var c = i + 1, t = tipe[h];
    if (!t) return;
    var rg = sh.getRange(2, c, maksR - 1, 1);
    if (t === 't') rg.setNumberFormat('@');
    else if (t === 'r') rg.setNumberFormat('#,##0');
    else if (t === 'p') rg.setNumberFormat('0.00%');
    else if (t === 'd') {
      rg.setNumberFormat('dd/mm/yyyy');
      rg.setDataValidation(SpreadsheetApp.newDataValidation().requireDate().setAllowInvalid(true).build());
    }
    var daftar = PILIHAN[nama + '.' + h];
    if (daftar) {
      rg.setDataValidation(SpreadsheetApp.newDataValidation().requireValueInList(daftar, true)
        .setAllowInvalid(h !== 'keputusan').build());
    }
    var cat = CATATAN_KOLOM[nama + '.' + h];
    if (cat) sh.getRange(1, c).setNote(cat);
    sh.setColumnWidth(c, LEBAR_KOLOM[h] || (h.length > 14 ? 130 : 110));
  });
  if (nama === 'TEMPLAT_WA' || nama === 'REDAKSI') {
    var cIsi = baru.indexOf('isi') + 1;
    if (cIsi > 0) sh.getRange(2, cIsi, maksR - 1, 1).setWrap(true).setVerticalAlignment('top');
  }
  if (nama === 'TINJAU') {
    var cData = baru.indexOf('data') + 1;
    if (cData > 0) sh.hideColumns(cData);
  }
  return sh;
}

function isiAwal_() {
  // PENGATURAN: tambahkan kunci yang belum ada
  var ada = {};
  bacaTab_('PENGATURAN').data.forEach(function (o) { ada[String(o.kunci).trim()] = true; });
  var baru = DEF_PENGATURAN.filter(function (d) { return !ada[d[0]]; })
    .map(function (d) { return { kunci: d[0], nilai: d[1], keterangan: d[2] }; });
  tambahBaris_('PENGATURAN', baru);
  var tp = bacaTab_('PENGATURAN');
  tp.data.forEach(function (o) {
    if (String(o.kunci).trim() !== 'kode_pembina' || String(o.nilai).trim()) return;
    o.nilai = DEF_PENGATURAN.filter(function (d) { return d[0] === 'kode_pembina'; })[0][1];
    o.keterangan = DEF_PENGATURAN.filter(function (d) { return d[0] === 'kode_pembina'; })[0][2];
    ubahSel_('PENGATURAN', o, ['nilai', 'keterangan']);
  });
  if (tp.data.some(function (o) { return KUNCI_USANG.indexOf(String(o.kunci).trim()) >= 0; })) {
    tulisTab_('PENGATURAN', tp.data.filter(function (o) { return KUNCI_USANG.indexOf(String(o.kunci).trim()) < 0; }));
  }

  // PEMETAAN: tambahkan pasangan laporan + kolom yang belum ada
  var adaP = {};
  bacaTab_('PEMETAAN').data.forEach(function (o) { adaP[o.laporan + '|' + o.kolom_lensa] = true; });
  var bp = [];
  JENIS_LENSA.forEach(function (lap) {
    DEF_PEMETAAN[lap].forEach(function (d) {
      if (!adaP[lap + '|' + d[0]]) bp.push({ laporan: lap, kolom_lensa: d[0], judul_di_laporan: d[1], wajib: d[2] });
    });
  });
  tambahBaris_('PEMETAAN', bp);

  // TEMPLAT_WA: isi awal hanya bila tab masih kosong
  if (!bacaTab_('TEMPLAT_WA').data.length) {
    var kini = sekarangStr_();
    tambahBaris_('TEMPLAT_WA', DEF_TEMPLAT_WA.map(function (d) {
      return { id_templat: d[0], nama: d[1], keperluan: d[2], sasaran: d[3], isi: d[4], aktif: 'Ya', dipakai: 0, terakhir_dipakai: '', diperbarui: kini };
    }));
  }

  // REDAKSI (1.22): pustaka bawaan + peralihan templat lama, hanya bila tab masih kosong
  if (!bacaTab_('REDAKSI').data.length) isiRedaksiAwal_();

  // WILAYAH
  if (!bacaTab_('WILAYAH').data.length) {
    tambahBaris_('WILAYAH', DEF_WILAYAH.map(function (k) { return { kabupaten: 'Pamekasan', kecamatan: k, lat_tengah: '', lng_tengah: '' }; }));
  }
}

function pastikanSiap_() {
  var ss = ss_();
  var kurang = URUTAN_TAB.filter(function (n) { return !ss.getSheetByName(n); });
  if (kurang.length || versiDb_() !== VERSI) siapkanDatabaseDiam_();
}

function versiDb_() {
  try { return PropertiesService.getScriptProperties().getProperty('VERSI_DB') || ''; } catch (e) { return VERSI; }
}

/** Membandingkan nomor versi sebagai angka per bagian ('1.12' lebih baru dari '1.3'). Sebelum 1.13 dibandingkan
 *  sebagai teks, sehingga naik ke 1.11/1.12 sempat menebak ulang semua tanda non-ASN. */
function versiKurang_(a, b) {
  var x = String(a || '0').split('.'), y = String(b || '0').split('.');
  for (var i = 0; i < Math.max(x.length, y.length); i++) {
    var p = +x[i] || 0, q = +y[i] || 0;
    if (p !== q) return p < q;
  }
  return false;
}

/** Penyesuaian data sekali jalan saat skrip diperbarui. */
function pindahDataVersi_() {
  var lama = versiDb_();
  if (lama === VERSI) return;
  // 1.3: aturan non-ASN baru (skala MI, aparat/BPD/kader/RT RW/relawan SPPG/tenaga pendukung) → tebak ulang semua
  if (!lama || versiKurang_(lama, '1.3')) {
    var t = bacaTab_('PERUSAHAAN');
    if (t.data.length && t.kepala.indexOf('non_asn') >= 0) {
      t.data.forEach(function (o) { o.non_asn = tebakNonAsn_(o.nama_perusahaan, o.skala, o.segmen); });
      tulisTab_('PERUSAHAAN', t.data);
    }
  }
  // 1.5: templat WA baru (salam, emoji). Templat yang masih bawaan lama diganti; yang sudah diubah pengguna dibiarkan.
  if (!lama || versiKurang_(lama, '1.5')) perbaruiTemplat_();
  // 1.6: agenda pengingat impor laporan langsung dibuat (selanjutnya tiap pagi)
  if (lama && versiKurang_(lama, '1.6')) { try { buatPengingatImpor_(); } catch (e) { /* diam */ } }
  try { PropertiesService.getScriptProperties().setProperty('VERSI_DB', VERSI); } catch (e) { /* diam */ }
}

function perbaruiTemplat_() {
  var rapi = function (t) { return String(t === null || t === undefined ? '' : t).replace(/\r\n/g, '\n').replace(/\s+$/, '').trim(); };
  var t = bacaTab_('PENGATURAN');
  t.data.forEach(function (o) {
    var k = String(o.kunci || '').trim(), def = DEF_PENGATURAN.filter(function (d) { return d[0] === k; })[0];
    if (!def || !TEMPLAT_LAMA[k]) return;
    var kol = [];
    if (!rapi(o.nilai) || rapi(o.nilai) === rapi(TEMPLAT_LAMA[k])) { o.nilai = def[1]; kol.push('nilai'); }
    if (String(o.keterangan || '') !== def[2]) { o.keterangan = def[2]; kol.push('keterangan'); }
    if (kol.length) ubahSel_('PENGATURAN', o, kol);
  });
  muatPengaturan_();
}

function sembunyikanSistem_(ss) {
  var a = ss.getSheetByName('APP_DATA');
  try { if (a && !a.isSheetHidden()) a.hideSheet(); } catch (e) { /* diam */ }
}

/** Versi 1.0 memakai REKAP_SKOR; sejak 1.1 isinya dipecah ke STATUS_PK (inti) dan RAPOR (analisa). */
function pindahVersiLama_(ss) {
  var lama = ss.getSheetByName('REKAP_SKOR');
  if (lama && ss.getSheets().length > 1) ss.deleteSheet(lama);
  // 1.1 → 1.2: kolom migrasi di KPI_BULANAN pindah ke KPI_MIGRASI (dihitung ulang dengan cara KPI084)
  var kb = ss.getSheetByName('KPI_BULANAN');
  if (kb && kb.getLastColumn() > 0) {
    var kep = kb.getRange(1, 1, 1, kb.getLastColumn()).getValues()[0].map(function (h) { return String(h).trim(); });
    ['pk_itw', 'pk_lancar', 'pk_kurang_lancar', 'pk_diragukan', 'pk_macet', 'sumber_migrasi', 'mig_itw_piutang', 'mig_l_kl', 'mig_kl_d', 'mig_d_m']
      .map(function (k) { return kep.indexOf(k) + 1; }).filter(function (c) { return c > 0; })
      .sort(function (a, b) { return b - a; }).forEach(function (c) { if (kb.getMaxColumns() > 1) kb.deleteColumns(c, 1); });
  }
}

function siapkanDatabaseDiam_() {
  var ss = ss_();
  try { ss.setSpreadsheetTimeZone(TZ); } catch (e) { /* diam */ }
  pindahVersiLama_(ss);
  URUTAN_TAB.forEach(function (nama, i) { siapkanTab_(ss, nama, i); });
  isiAwal_();
  pindahDataVersi_();
  sembunyikanSistem_(ss);
  muatPengaturan_();
}

/* Pengurai laporan = modul Impor bersama (kit/impor.js). Nama fungsi lama tetap dipakai di seluruh mesin LENSA. */
KitImpor.pasang({
  jenis: JENIS_LENSA.concat(['IBR']), // 1.27 (3C): Daftar IBR dikenali untuk Gudang (MyTagihan Desa); LENSA sendiri memakai IBR dari ITW/ITB
  saranPemetaan: true,
  tambahan: function () { return bacaTab_('PEMETAAN').data; },
  hariIni: function () { return hariIniStr_(); },
  tglLokal: function (d) { return fmt_(d, 'yyyy-MM-dd'); }
});
function uraiCsv_(teks, pemisah) { return KitImpor.uraiCsv(teks, pemisah); }
function deteksiPemisah_(teks) { return KitImpor.deteksiPemisah(teks); }
function pemetaan_(lap) { return KitImpor.pemetaan(lap); }
function analisaGrid_(grid, namaFile) { return KitImpor.analisaGrid(grid, namaFile); }
function petakanKolom_(an, grid) { return KitImpor.petakanKolom(an, grid); }
function ambilBaris_(an, peta, grid) { return KitImpor.ambilBaris(an, peta, grid); }
function tentukanPeriode_(an) { return KitImpor.tentukanPeriode(an); }
function cekPosisi_(jenis, data) { return KitImpor.cekPosisi(jenis, data); }
function ambilKpi084_(grid) { return KitImpor.ambilKpi084(grid); }
function bacaRekapItw_(grid) { return KitImpor.bacaRekapItw(grid); }

/** Pintu masuk impor dari teks CSV. */
function imporTeks_(namaFile, teks) {
  var grid = uraiCsv_(teks, deteksiPemisah_(teks));
  return imporGrid_(namaFile, grid);
}

function imporGrid_(namaFile, grid, anSiap) {
  pastikanSiap_();
  var lr;
  try {
    var an = anSiap || analisaGrid_(grid, namaFile);
    var peta = an.jenis === 'KPI084' ? {} : petakanKolom_(an, grid);
    var data = an.jenis === 'KPI084' ? ambilKpi084_(grid) : ambilBaris_(an, peta, grid);
    if (!data.length) throw new Error('Tidak ada baris data yang terbaca.');
    if (an.posisi) cekPosisi_(an.jenis, data);
    lr = KitImpor.ringkas({ an: an, peta: peta, data: data, per: tentukanPeriode_(an), rekap: an.jenis === 'ITW_ITB' ? bacaRekapItw_(grid) : null, namaFile: namaFile });
  } catch (e) {
    var log = { id_impor: idWaktu_('I'), waktu: sekarangStr_(), jenis: anSiap ? NAMA_LAPORAN[anSiap.jenis] || '' : '', nama_file: namaFile, periode: '', baris: '', aktif: '', baru: '', berubah: '', cek: '', pesan: 'GAGAL: ' + e.message };
    try { tambahBaris_('LOG_IMPOR', [log]); } catch (e2) { /* diam */ }
    return { ok: false, jenis: '', ringkas: namaFile + ': GAGAL — ' + e.message, log: log };
  }
  // laporan utuh (semua pembina) disimpan sekali di Gudang Laporan KC; laporan kiriman Monitor ≤ 1.5 lewat jembatan tidak (hanya baris binaan)
  var gudang = _DARI_SPPG ? '' : simpanGudang_(lr, 'LENSA PK');
  var h = imporLaporan_(lr);
  if (gudang) h.ringkas += ' · ' + gudang;
  return h;
}

/**
 * Laporan ringkas (modul Impor bersama) → tab LENSA. Dipakai impor dari aplikasi LENSA (apiImporLaporan),
 * dari Drive/dialog (imporGrid_), dan laporan unggahan aplikasi lain lewat Hub (imporDariHub_).
 */
function imporLaporan_(lr, opsi) {
  opsi = opsi || {};
  pastikanSiap_();
  var id = idWaktu_('I');
  var log = { id_impor: id, waktu: sekarangStr_(), jenis: '', nama_file: lr.nama_file, periode: '', baris: '', aktif: '', baru: '', berubah: '', cek: '', pesan: '' };
  var namaFile = String(lr.nama_file || 'laporan');
  try {
    var b = KitImpor.buka(lr), an = b.an, peta = b.peta, data = b.data, per = b.per;
    log.jenis = NAMA_LAPORAN[an.jenis] || an.jenis;
    if (an.jenis === 'IBR') { // 1.27 (3C): hanya untuk Gudang → MyTagihan Desa; tab LENSA tidak berubah
      var nNpp = {}; data.forEach(function (o) { nNpp[o.npp] = true; });
      log.periode = per.tanggal; log.baris = data.length;
      log.pesan = 'OK · disimpan di Gudang untuk MyTagihan Desa' + (opsi.asal ? ' · dari ' + opsi.asal : '');
      tambahBaris_('LOG_IMPOR', [log]);
      return { ok: true, jenis: 'IBR', ringkas: NAMA_LAPORAN.IBR + ' (' + namaFile + '): ' + data.length + ' baris, ' + Object.keys(nNpp).length + ' NPP · dikirim ke MyTagihan Desa lewat Gudang (LENSA tetap memakai IBR dari ITW/ITB)', log: log, lr: lr };
    }
    if (JENIS_LENSA.indexOf(an.jenis) < 0) throw new Error('Jenis laporan ini tidak dipakai LENSA PK.');
    if (!data.length) throw new Error('Tidak ada baris data yang terbaca.');
    var jaga = jagaPembina_(an.jenis, per, peta, data);
    data = jaga.data;
    if (per.pembina && !P_('kode_pembina')) setPengaturan_('kode_pembina', per.pembina);
    if (per.namaPembina && !P_('nama_petugas') && jaga.milikSaya) setPengaturan_('nama_petugas', per.namaPembina);
    var ctx = { id: id, periode: per.tanggal, per: per, an: an, rekap: b.rekap, namaFile: namaFile, peta: peta };
    var h;
    if (an.jenis === 'KPI084') h = imporKpi084_(data, ctx);
    else if (an.jenis === 'KPI085') h = imporKpi085_(data, ctx);
    else if (an.jenis === 'ITW_ITB') h = imporItw_(data, ctx);
    else if (an.jenis === 'MONITORING') h = imporMonitoring_(data, ctx);
    else if (an.jenis === 'DATA_BU') h = imporDbu_(data, ctx);
    else h = imporKartu_(data, ctx);
    log.periode = h.periode || ctx.periode;
    log.baris = data.length;
    log.aktif = h.aktif === undefined ? '' : h.aktif;
    log.baru = h.baru === undefined ? '' : h.baru;
    log.berubah = h.berubah === undefined ? '' : h.berubah;
    log.cek = (h.cek || '') + jaga.catatan;
    h.cek = log.cek;
    log.pesan = 'OK' + (opsi.asal ? ' · dari ' + opsi.asal : '') + (an.posisi ? ' · kolom dibaca menurut urutan' : '') + (an.menurutIsi ? ' · format Excel: kolom dibaca menurut isinya' : '') + (h.pesan ? ' · ' + h.pesan : '');
    tambahBaris_('LOG_IMPOR', [log]);
    try { kirimBerkasSppg_(lr, data); } catch (eS) { catatGalat_('kirimBerkasSppg_', eS.message, VERSI, 'server'); }
    return { ok: true, jenis: an.jenis, ringkas: NAMA_LAPORAN[an.jenis] + ' (' + namaFile + '): ' + data.length + ' baris. ' + (h.cek ? h.cek + '. ' : '') + (h.pesan || ''), log: log, lr: lr };
  } catch (e) {
    log.pesan = 'GAGAL: ' + e.message + (opsi.asal ? ' · dari ' + opsi.asal : '');
    try { tambahBaris_('LOG_IMPOR', [log]); } catch (e2) { /* diam */ }
    return { ok: false, jenis: lr.jenis || '', ringkas: namaFile + ': GAGAL — ' + e.message, log: log, lr: lr };
  }
}

/** Laporan ke Gudang Laporan KC (Hub, berkas Hub.gs di proyek ini). Di perangkat (mesin LENSA) tidak ada Hub: dilewati. */
function simpanGudang_(lr, app) {
  if (typeof hubSimpanLaporan_ !== 'function' || !lr || !KitImpor.GUDANG[lr.jenis]) return '';
  try { return hubSimpanLaporan_(lr, { app: app, oleh: typeof aksesOlehTeks_ === 'function' ? aksesOlehTeks_() : '' }).ringkas; }
  catch (e) { try { catatGalat_('simpanGudang_', e.message, VERSI, 'server'); } catch (e2) { /* diam */ } return 'Gudang Laporan KC: gagal (' + e.message + ')'; }
}

/**
 * Laporan unggahan aplikasi lain (Monitor SPPG) yang masuk Hub: baris binaan LENSA langsung diolah di sini.
 * Baris binaan = seluruh laporan bila judulnya menyebut kode pembina LENSA; bila ada kolom pembina, baris berkode LENSA;
 * selain itu NPP yang sudah dikenal LENSA (PERUSAHAAN / STATUS_PK). Aturan ini sama dengan Monitor SPPG ≤ 1.5.
 */
function imporDariHub_(lr, asal) {
  if (!SPPG_JENIS_LAPORAN[lr.jenis]) return null;
  muatPengaturan_();
  var kode = String(P_('kode_pembina') || '').trim().toUpperCase(), per = lr.per || {};
  if (!kode) return { ok: false, lewat: true, ringkas: 'LENSA PK: kode pembina belum diisi, laporan hanya disimpan di gudang' };
  if (per.pembina && per.pembina !== kode) return { ok: false, lewat: true, ringkas: 'LENSA PK: laporan pembina ' + per.pembina + ', bukan ' + kode };
  var iNpp = lr.kolom.indexOf('npp'), iPb = lr.kolom.indexOf('pembina');
  if (iNpp < 0) return null;
  if (iPb >= (lr.nPeta === undefined ? lr.kolom.length : lr.nPeta)) iPb = -1;
  var semua = per.pembina === kode, dikenal = semua || iPb >= 0 ? {} : nppDikenalLensa_();
  var baris = lr.baris.filter(function (r) {
    if (semua) return true;
    if (iPb >= 0) return (String(r[iPb] || '').toUpperCase().match(/[A-Z]{2}\d{6}/) || [''])[0] === kode;
    return !!dikenal[rapikanNpp_(r[iNpp])];
  });
  if (!baris.length) return { ok: false, lewat: true, ringkas: 'LENSA PK: tidak ada baris binaan ' + kode };
  var sub = JSON.parse(JSON.stringify(lr));
  sub.baris = baris;
  var lock = LockService.getDocumentLock();
  if (!lock.tryLock(60000)) throw new Error('LENSA PK sedang sibuk (impor/hitung lain).');
  try {
    _DARI_SPPG = true; // tidak dikirim balik ke Monitor lewat jembatan
    var h = imporLaporan_(sub, { asal: asal || 'Hub' });
    if (h.ok) hitungUlang_();
    return h;
  } finally {
    _DARI_SPPG = false;
    lock.releaseLock();
  }
}

/**
 * Hanya data pembina sendiri (PENGATURAN kode_pembina) yang masuk:
 * - file yang judulnya menyebut kode pembina lain ditolak utuh;
 * - baris dengan kolom pembina berisi kode lain dilewati (ITW/ITB);
 * - KPI085 dipilah di imporKpi085_ (hanya baris binaan yang disimpan);
 * - KPI084 berisi total kantor saja, tanpa data per PK.
 */
function jagaPembina_(jenis, per, peta, data) {
  var kode = String(P_('kode_pembina') || '').trim().toUpperCase();
  var hasil = { data: data, catatan: '', milikSaya: !kode || per.pembina === kode };
  if (!kode || jenis === 'KPI084' || jenis === 'KPI085') return hasil;
  if (per.pembina && per.pembina !== kode) {
    throw new Error('File ini laporan pembina ' + per.pembina + ', bukan ' + kode + '. Tidak diimpor; data Anda tidak berubah.');
  }
  var lain = 0, adaKode = false;
  // 1.28: kode pembina per baris bisa dari kolom pembina atau dari baris kelompok "Pembina : …" (laporan se-KC)
  if (peta.pembina !== undefined || data.some(function (r) { return r.pembina; })) {
    hasil.data = data.filter(function (r) {
      var m = String(r.pembina || '').toUpperCase().match(/[A-Z]{2}\d{6}/);
      if (!m) return true;
      adaKode = true;
      if (m[0] !== kode) { lain++; return false; }
      return true;
    });
    if (!hasil.data.length) throw new Error('Semua baris di file ini milik pembina lain, bukan ' + kode + '. Tidak diimpor; data Anda tidak berubah.');
  }
  if (lain) hasil.catatan = ' · ' + lain + ' baris milik pembina lain dilewati (tetap tersimpan di Gudang Laporan KC)';
  if (!per.pembina && !adaKode) hasil.catatan = ' · kode pembina tidak tercantum di file, pastikan ini laporan ' + kode;
  else hasil.milikSaya = true;
  return hasil;
}

/* ------------------------- snapshot ------------------------- */

function simpanSnapshot_(tab, rows, samaFn) {
  var t = bacaTab_(tab);
  var sisa = t.data.filter(function (o) { return !samaFn(o); });
  var dibuang = t.data.length - sisa.length;
  var r = rampingkan_(sisa);
  if (dibuang || r.dibuang) tulisTab_(tab, r.sisa.concat(rows));
  else tambahBaris_(tab, rows);

}

/** Snapshot lama disimpan satu per bulan (yang terakhir) agar spreadsheet tidak membengkak. */
function rampingkan_(rows) {
  var batas = tambahHari_(hariIniStr_(), -Pn_('simpan_snapshot_harian_hari'));
  var maksBulan = {};
  rows.forEach(function (o) {
    var p = String(o.periode || '');

  });
